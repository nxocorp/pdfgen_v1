    openAdminFormTypesModal() {
      this.showAdminFormTypesModal = true;
    },

    // ---- Upload PDF: AcroForm + vector-PDF structure extraction ----
    // See "Upload PDF workflow" in CLAUDE.md for the full design. Three
    // input shapes, one workflow: classify by what's actually in the file
    // (real fields vs. a real text layer vs. neither), extract whichever
    // way applies, then land in the Form Type Editor either way — with
    // real pre-placed boxes for the first two, or just the real page as a
    // visual reference for the third.
    async handleUploadFormTypePdf(file) {
      if (!file) return;
      this.uploadingFormType = true;
      try {
        const buf = await file.arrayBuffer();
        const bytes = new Uint8Array(buf);

        let result;
        try {
          result = await classifyAndExtractPdf(bytes);
        } catch (e) {
          console.error(e);
          alert("Could not read this file as a PDF — see console for details.");
          return;
        }
        const { kind, candidates, finalBytes } = result;

        const label = (file.name || "New form type").replace(/\.pdf$/i, "").trim() || "New form type";
        const type = uniqueId(slugify(label), this.FORM_TYPES.map(f => f.type));

        const sections = candidates.length
          ? [{ kind: "fields", title: "Extracted fields", columns: 2, fields: candidates.map(c => ({ key: c.key, label: c.label, textarea: false, validation: {} })) }]
          : [];
        const header = {};
        for (const c of candidates) {
          header[c.key] = { page: c.page, x: c.x, y: c.y, width: c.width, fontSize: c.fontSize, allowOverflow: false };
        }

        this.FORM_TYPES.push({
          type, label, bannerNote: "",
          sections,
          defaultLayout: {
            header, cols: {},
            page1: { rows: 0, startY: 0, spacing: 0 },
            page2: { rows: 0, startY: 0, spacing: 0 },
            repeatingHeaderExclude: [], overlays: [], extraTables: [],
          },
          templateB64: bytesToB64(finalBytes),
          custom: true,
        });

        this.announceExtraction(kind, candidates.length);
        this.showAdminFormTypesModal = false;
        this.openEditorModal(type);
      } catch (e) {
        console.error(e);
        alert("Could not process this PDF — see console for details.");
      } finally {
        this.uploadingFormType = false;
      }
    },

    // Attaches or replaces a PDF template on an *existing* custom form
    // type — same classify/extract pipeline as creating a brand-new type
    // (handleUploadFormTypePdf), but additive here: any newly-extracted
    // fields are merged into the type's existing structure (added to an
    // "Extracted fields" section, reusing one already there from an
    // earlier upload rather than creating a confusing duplicate) instead
    // of replacing whatever the admin already built by hand or from a
    // prior upload — nothing existing gets removed or repositioned.
    async handleUploadPdfForExistingType(ft, file) {
      if (!file || !ft || !ft.custom) return;
      this.uploadingFormType = true;
      try {
        const buf = await file.arrayBuffer();
        const bytes = new Uint8Array(buf);

        let result;
        try {
          result = await classifyAndExtractPdf(bytes);
        } catch (e) {
          console.error(e);
          alert("Could not read this file as a PDF — see console for details.");
          return;
        }
        const { kind, candidates, finalBytes } = result;

        ft.templateB64 = bytesToB64(finalBytes);

        if (candidates.length) {
          let section = ft.sections.find(s => s.kind === "fields" && s.title === "Extracted fields");
          if (!section) {
            section = { kind: "fields", title: "Extracted fields", columns: 2, fields: [] };
            ft.sections.push(section);
          }
          const usedKeys = ft.sections.filter(s => s.kind === "fields").flatMap(s => s.fields.map(f => f.key));
          for (const c of candidates) {
            const key = uniqueId(c.key, usedKeys);
            usedKeys.push(key);
            section.fields.push({ key, label: c.label, textarea: false, validation: {} });
            ft.defaultLayout.header[key] = { page: c.page, x: c.x, y: c.y, width: c.width, fontSize: c.fontSize, allowOverflow: false };
          }
        }

        // defaultLayout.header was just updated directly above — drop any
        // stale saved override so getLayout() doesn't merge on top of it
        // with now out-of-date assumptions (same reasoning as
        // confirmSaveEditor/confirmFormTypeBuilder's own custom-type saves).
        delete this.fieldLayouts[ft.type];

        this.announceExtraction(kind, candidates.length);
        this.showAdminFormTypesModal = false;
        this.openEditorModal(ft.type);
      } catch (e) {
        console.error(e);
        alert("Could not process this PDF — see console for details.");
      } finally {
        this.uploadingFormType = false;
      }
    },

    announceExtraction(kind, count) {
      const plural = count === 1 ? "" : "s";
      const messages = {
        acroform: count + " field" + plural + " extracted from the PDF's AcroForm.",
        vector: count + " field candidate" + plural + " guessed from the page layout — review and adjust them below.",
        image: "No extractable text found (looks like a scanned/image PDF) — the page is shown for reference; add fields manually with \"+ Add field\".",
      };
      alert(messages[kind]);
    },

    // Only an admin-created ("shape only") form type can be deleted, and
    // only once no document type still includes it — built-in types (real
    // PDF templates this POC ships with) are permanent fixtures here.
    canDeleteFormType(ft) {
      if (!ft.custom) return false;
      return !Object.values(this.documentTypeForms).some(list => list.includes(ft.type));
    },

    deleteFormType(ft) {
      if (!ft.custom) {
        alert("Built-in form types can't be deleted in this POC.");
        return;
      }
      if (!this.canDeleteFormType(ft)) {
        alert('Unassign "' + ft.label + '" from every document type first (see "Form types…" on each document type).');
        return;
      }
      if (!confirm('Delete form type "' + ft.label + '"? This cannot be undone.')) return;
      const idx = this.FORM_TYPES.findIndex(f => f.type === ft.type);
      if (idx !== -1) this.FORM_TYPES.splice(idx, 1);
    },

    // Label/banner note are the only metadata editable on an *existing*
    // form type (built-in or custom) — its fields/table shape is fixed
    // once created, same as its PDF template (if any) is fixed once
    // uploaded. Persisted separately from the type itself (formTypeOverrides)
    // so a built-in type's edit survives without rewriting form-types.json.
    // A small modal, not prompt() — same reasoning as startRenameAircraftModel
    // above (Electron/VS Code webviews stub window.prompt() to always
    // return null).
    openEditFormTypeMeta(ft) {
      this.editFormTypeDraft = { type: ft.type, label: ft.label, bannerNote: ft.bannerNote || "" };
      this.showEditFormTypeMetaModal = true;
    },

    confirmEditFormTypeMeta() {
      const ft = this.FORM_TYPES.find(f => f.type === this.editFormTypeDraft.type);
      this.showEditFormTypeMetaModal = false;
      if (!ft) return;
      const label = this.editFormTypeDraft.label.trim();
      ft.label = label || ft.label;
      ft.bannerNote = this.editFormTypeDraft.bannerNote.trim();
      this.formTypeOverrides[ft.type] = { label: ft.label, bannerNote: ft.bannerNote };
    },

    // ---- manual schema builder: create a new form type, or edit the full
    // structure (field groups + tables) of an existing custom one ----
    // Both flows share one modal/draft shape — `builderDraft.editingType`
    // is null when creating, or the existing type's key when editing —
    // and one confirm handler (confirmFormTypeBuilder) branches on that.

    openFormTypeBuilder() {
      this.builderDraft = {
        editingType: null,
        label: "", bannerNote: "",
        fieldSections: [{ title: "Details", fields: [] }],
        tableSections: [],
      };
      this.showFormTypeBuilder = true;
    },

    // Splits an existing custom type's `sections` back into the builder's
    // fieldSections/tableSections draft shape, keeping each field/column's
    // real `key` (and a table section's real `rowsKey`) so confirmForm-
    // TypeBuilder can tell "this row already existed" from "this is new"
    // and only regenerate keys for genuinely new rows.
    openFormTypeBuilderForEdit(ft) {
      const fieldSections = [];
      const tableSections = [];
      for (const s of ft.sections) {
        if (s.kind === "fields") {
          fieldSections.push({
            title: s.title || "",
            fields: s.fields.map(f => ({
              key: f.key, label: f.label,
              type: (f.validation && f.validation.type) || "text",
              required: !!(f.validation && f.validation.required),
              textarea: !!f.textarea,
            })),
          });
        } else if (s.kind === "table") {
          tableSections.push({
            rowsKey: s.rowsKey, title: s.title || "", fixedRows: s.fixedRows || 5,
            columns: s.columns.map(c => ({
              key: c.key, label: c.label,
              type: (c.validation && c.validation.type) || "text",
              required: !!(c.validation && c.validation.required),
            })),
          });
        }
      }
      // The primary (growable) table is always rowsKey "rows" by this
      // project's convention — sort it first defensively so
      // firstNonEmptyTableIndex() (position-based) agrees with it, even if
      // a schema's own `sections` array happened not to list it first.
      tableSections.sort((a, b) => (a.rowsKey === "rows" ? -1 : 0) - (b.rowsKey === "rows" ? -1 : 0));

      this.builderDraft = {
        editingType: ft.type,
        label: ft.label, bannerNote: ft.bannerNote || "",
        fieldSections, tableSections,
      };
      this.showFormTypeBuilder = true;
    },

    addBuilderFieldSection() {
      this.builderDraft.fieldSections.push({ title: "Details", fields: [] });
    },

    removeBuilderFieldSection(sIdx) {
      this.builderDraft.fieldSections.splice(sIdx, 1);
    },

    addBuilderField(sIdx) {
      this.builderDraft.fieldSections[sIdx].fields.push({ label: "", type: "text", required: false, textarea: false });
    },

    removeBuilderField(sIdx, idx) {
      this.builderDraft.fieldSections[sIdx].fields.splice(idx, 1);
    },

    // A freshly-added table defaults to a 5-row fixed count — it only
    // becomes the primary growable table if it ends up being the *first
    // one with any columns* (see firstNonEmptyTableIndex), matching
    // confirmFormTypeBuilder's own rule at save time.
    addBuilderTableSection() {
      this.builderDraft.tableSections.push({ title: "Items", fixedRows: 5, columns: [] });
    },

    removeBuilderTableSection(tIdx) {
      this.builderDraft.tableSections.splice(tIdx, 1);
    },

    addBuilderColumn(tIdx) {
      this.builderDraft.tableSections[tIdx].columns.push({ label: "", type: "text", required: false });
    },

    removeBuilderColumn(tIdx, idx) {
      this.builderDraft.tableSections[tIdx].columns.splice(idx, 1);
    },

    // The primary/growable-table rule (used both live in the modal, to
    // label a table "Primary" vs "Fixed rows", and at save time to decide
    // which table gets rowsKey "rows"): the first table section that
    // actually has any columns — an empty table (mid-edit, before its
    // first column is added) doesn't count, so adding a table's first
    // column doesn't unexpectedly bump an already-primary table down to
    // fixed-row.
    firstNonEmptyTableIndex() {
      return this.builderDraft.tableSections.findIndex(ts => ts.columns.length > 0);
    },

    confirmFormTypeBuilder() {
      const d = this.builderDraft;
      const label = d.label.trim();
      if (!label) { alert("Give the form type a label."); return; }

      const nonEmptyFieldSections = d.fieldSections.filter(fs => fs.fields.length > 0);
      const nonEmptyTableSections = d.tableSections.filter(ts => ts.columns.length > 0);
      if (!nonEmptyFieldSections.length && !nonEmptyTableSections.length) {
        alert("Add at least one field, or a table with at least one column.");
        return;
      }

      const isEdit = !!d.editingType;
      const schema = isEdit ? this.FORM_TYPES.find(f => f.type === d.editingType) : null;
      if (isEdit && !schema) { this.showFormTypeBuilder = false; return; }
      const type = isEdit ? schema.type : uniqueId(slugify(label), this.FORM_TYPES.map(f => f.type));
      const priorLayout = isEdit ? schema.defaultLayout : null;

      // Keeps an existing row's real key (so its data/position survive the
      // edit); generates a fresh, deduped one for a genuinely new row.
      // Header keys and column keys are tracked in separate `used` arrays
      // passed in per call — they don't need to be mutually unique (they
      // live in different data trees: instance.header vs instance[rowsKey]),
      // but column keys DO need to stay unique against every OTHER table's
      // columns too (findColBucket's flat, whole-schema key lookup).
      const keyify = (rowLabel, existingKey, used) => {
        if (existingKey) { used.push(existingKey); return existingKey; }
        const key = uniqueId(slugify(rowLabel) || "field", used);
        used.push(key);
        return key;
      };

      const sections = [];
      const header = {};
      const usedHeaderKeys = [];
      for (const fs of nonEmptyFieldSections) {
        const fields = fs.fields.map(f => {
          const key = keyify(f.label, f.key, usedHeaderKeys);
          const validation = {};
          if (f.required) validation.required = true;
          if (f.type !== "text") validation.type = f.type;
          header[key] = (priorLayout && priorLayout.header[key]) || placeholderFieldSpec();
          return { key, label: f.label || key, textarea: !!f.textarea, validation };
        });
        sections.push({ kind: "fields", title: fs.title || "Details", columns: 2, fields });
      }

      // First non-empty table = primary/growable (rowsKey "rows", no
      // fixedRows — matches every built-in type's own primary table); any
      // table after that is a fixed row count, stored in defaultLayout.
      // extraTables (same shape DA 2408-17's Verification/Remarks tables
      // already use — see "Multi-table support" in PDF-gen/CLAUDE.md).
      const usedRowsKeys = [];
      const rowsKeys = nonEmptyTableSections.map((ts, idx) => {
        if (idx === 0) { usedRowsKeys.push("rows"); return "rows"; }
        const key = ts.rowsKey || uniqueId("tableRows", usedRowsKeys);
        usedRowsKeys.push(key);
        return key;
      });

      const cols = {};
      const usedColKeys = [];
      const extraTables = [];
      nonEmptyTableSections.forEach((ts, idx) => {
        const isPrimary = idx === 0;
        const rowsKey = rowsKeys[idx];
        const priorExtra = !isPrimary && priorLayout
          ? (priorLayout.extraTables || []).find(t => t.rowsKey === rowsKey)
          : null;
        const priorCols = isPrimary ? (priorLayout && priorLayout.cols) : (priorExtra && priorExtra.cols);
        const extraCols = {};
        const columns = ts.columns.map(c => {
          const key = keyify(c.label, c.key, usedColKeys);
          const validation = {};
          if (c.required) validation.required = true;
          if (c.type !== "text") validation.type = c.type;
          const spec = (priorCols && priorCols[key]) || placeholderColumnSpec();
          if (isPrimary) cols[key] = spec; else extraCols[key] = spec;
          return { key, label: c.label || key, validation };
        });
        sections.push({
          kind: "table", title: ts.title || "Items", rowsKey, columns,
          ...(isPrimary ? {} : { fixedRows: ts.fixedRows || 5 }),
        });
        if (!isPrimary) {
          extraTables.push({
            rowsKey,
            page: (priorExtra && priorExtra.page) || 0,
            startY: (priorExtra && priorExtra.startY) || 700,
            spacing: (priorExtra && priorExtra.spacing) || 20,
            rows: ts.fixedRows || 5,
            cols: extraCols,
          });
        }
      });

      const defaultLayout = {
        header, cols,
        page1: (priorLayout && priorLayout.page1) || { rows: 0, startY: 0, spacing: 0 },
        page2: (priorLayout && priorLayout.page2) || { rows: 0, startY: 0, spacing: 0 },
        repeatingHeaderExclude: (priorLayout && priorLayout.repeatingHeaderExclude) || [],
        overlays: (priorLayout && priorLayout.overlays) || [],
        extraTables,
      };
      const bannerNote = d.bannerNote.trim() || "";

      if (isEdit) {
        schema.label = label;
        schema.bannerNote = bannerNote;
        schema.sections = sections;
        schema.defaultLayout = defaultLayout;
        delete this.fieldLayouts[type]; // defaultLayout now fully reflects current state, no override layer needed
        this.formTypeOverrides[type] = { label, bannerNote };
      } else {
        this.FORM_TYPES.push({ type, label, bannerNote, sections, defaultLayout, custom: true });
      }
      this.showFormTypeBuilder = false;
    },
  };
}

// ---------------------------------------------------------------------------
// Shared coordinate-fill infrastructure. Every form type in this POC is a
// flat, fieldless PDF (see "Two POC tracks" / this folder's own scope in
// PDF-gen/CLAUDE.md), so filling means drawing text at authored (page, x, y)
// positions rather than setting named AcroForm fields — and merging several
// filled copies is correspondingly simpler than pdfgen-vanilla-multi's
// AcroForm path: there are no field names to collide, so copyPages() alone
// is enough.
// ---------------------------------------------------------------------------
function b64ToBytes(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

// Reverse of b64ToBytes — chunked to avoid blowing the call stack on
// String.fromCharCode.apply for a large PDF.
function bytesToB64(bytes) {
  let binary = "";
  const chunkSize = 0x8000;
  for (let i = 0; i < bytes.length; i += chunkSize) {
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
  }
  return btoa(binary);
}

// ---------------------------------------------------------------------------
// "Upload PDF" structure extraction (Form Types admin panel) — turns an
// uploaded PDF into field candidates, two different ways depending on what
// the PDF actually contains, both landing in the same shape: an array of
// { key, label, page, x, y, width, fontSize }, PDF-point coordinates
// (bottom-left origin), directly usable as a defaultLayout.header entry.
// A PDF with neither real AcroForm fields nor a text layer (a scanned/
// photographed page) yields zero candidates — the caller still opens the
// Form Type Editor against the uploaded page so fields can be added by hand
// with a real visual reference, per "Upload PDF workflow" in CLAUDE.md.
// ---------------------------------------------------------------------------

// "InspNo" -> "Insp No", "date_sample_submitted" -> "Date Sample Submitted".
// Good enough as a starting label — the admin can rename in the editor.
function humanizeFieldName(name) {
  const spaced = (name || "")
    .replace(/[_\-]+/g, " ")
    .replace(/([a-z0-9])([A-Z])/g, "$1 $2")
    .replace(/\s+/g, " ")
    .trim();
  if (!spaced) return name || "Field";
  return spaced.replace(/\b\w/g, c => c.toUpperCase());
}

// A widget's own /P entry is the reliable way to find its page, but some
// PDFs omit it — fall back to scanning every page's /Annots array for a ref
// that dereferences to this exact widget dict. pdf-lib caches indirect
// objects by ref (PDFContext#indirectObjects), so repeated lookups of the
// same ref return the identical object instance — safe to compare by `===`.
function findPageIndexForWidget(pages, widget) {
  const pRef = widget.P();
  if (pRef) {
    const idx = pages.findIndex(p => p.ref === pRef);
    if (idx !== -1) return idx;
  }
  for (let i = 0; i < pages.length; i++) {
    const annots = pages[i].node.Annots();
    if (!annots) continue;
    for (let j = 0; j < annots.size(); j++) {
      if (annots.lookup(j) === widget.dict) return i;
    }
  }
  return 0;
}

// Real AcroForm fields — fully mechanical, no guessing: each text field's
// own widget rectangle is its exact position, already in the same PDF-point,
// bottom-left-origin coordinate space this app's coordinate fill engine
// uses. Non-text fields (checkbox/dropdown/radio) are skipped — this app's
// schema model doesn't have a field kind for them yet. Phase 1 also only
// looks at each field's first widget (a field repeated across pages, e.g. a
// running "page X of Y", is a rare enough case to add manually afterward).
function extractAcroFormCandidates(pdfDoc, form) {
  const { PDFTextField } = PDFLib;
  const pages = pdfDoc.getPages();
  const usedKeys = [];
  const candidates = [];
  for (const field of form.getFields()) {
    if (!(field instanceof PDFTextField)) continue;
    const widgets = field.acroField.getWidgets();
    if (!widgets.length) continue;
    const widget = widgets[0];
    const rect = widget.getRectangle();
    if (!rect.width || !rect.height) continue; // degenerate/hidden widget
    const pageIndex = findPageIndexForWidget(pages, widget);
    const rawName = field.getName().split(".").pop().replace(/\[\d+\]$/, "");
    const label = humanizeFieldName(rawName);
    const key = uniqueId(slugify(label), usedKeys);
    usedKeys.push(key);
    candidates.push({
      key, label, page: pageIndex,
      x: rect.x, y: rect.y, width: rect.width,
      fontSize: Math.max(6, Math.round(rect.height * 0.7)),
    });
  }
  return candidates;
}

// Flattened/exported PDFs have no fields at all, but (unlike a scan) still
// carry a real text layer — pdf.js's getTextContent() gives every text
// run's string plus its exact (x, y) origin in the same PDF-point,
// bottom-left-origin space pdf-lib uses, no viewport/scale conversion
// needed. Heuristic, deliberately simple: cluster items into lines by y,
// then any item ending in ":" is a label, and its field is the blank space
// to its right on that same line, up to the next item (or a capped max
// width). Misses labels stacked above their blank rather than beside it,
// and won't detect table grids at all — both acceptable for a first pass,
// since every candidate lands in the Form Type Editor for review anyway.
function extractVectorPdfCandidates(pages) {
  const LINE_TOLERANCE = 3;
  const GAP_AFTER_LABEL = 4;
  const MIN_FIELD_WIDTH = 40;
  const MAX_FIELD_WIDTH = 220;
  const usedKeys = [];
  const candidates = [];

  for (const { pageIndex, items } of pages) {
    const lines = [];
    for (const item of items) {
      const str = (item.str || "").trim();
      if (!str) continue;
      const x = item.transform[4], y = item.transform[5];
      const width = item.width || 0;
      const height = item.height || 10;
      let line = lines.find(l => Math.abs(l.y - y) <= LINE_TOLERANCE);
      if (!line) { line = { y, items: [] }; lines.push(line); }
      line.items.push({ str, x, y, width, height });
    }
    for (const line of lines) line.items.sort((a, b) => a.x - b.x);

    for (const line of lines) {
      for (let i = 0; i < line.items.length; i++) {
        const it = line.items[i];
        if (!/:\s*$/.test(it.str)) continue;
        const label = it.str.replace(/:\s*$/, "").trim();
        if (!label) continue;
        const next = line.items[i + 1];
        const startX = it.x + it.width + GAP_AFTER_LABEL;
        const endX = next ? next.x - GAP_AFTER_LABEL : startX + MAX_FIELD_WIDTH;
        const available = endX - startX;
        if (available < MIN_FIELD_WIDTH) continue; // no room after this label
        const width = Math.min(MAX_FIELD_WIDTH, available);
        const key = uniqueId(slugify(label), usedKeys);
        usedKeys.push(key);
        candidates.push({
          key, label, page: pageIndex,
          x: startX, y: it.y, width,
          fontSize: Math.max(7, Math.round(it.height * 0.75)),
        });
      }
    }
  }
  return candidates;
}

// Classifies an uploaded PDF's bytes and extracts field candidates —
// shared by both "Upload PDF" (create a brand-new form type) and a custom
// form type's own per-row "Upload/Replace PDF" (attach or swap a template
// on an existing type) — see "Upload PDF workflow" in CLAUDE.md. Throws if
// the bytes aren't a readable PDF at all; callers handle that.
async function classifyAndExtractPdf(bytes) {
  const { PDFDocument } = PDFLib;
  const pdfDoc = await PDFDocument.load(bytes);

  const form = pdfDoc.getForm();
  if (form.getFields().length > 0) {
    const candidates = extractAcroFormCandidates(pdfDoc, form);
    // Flatten so the resulting template has zero live fields — this
    // folder's fill engine is coordinate-draw only (see "Fill engine" in
    // CLAUDE.md), so a leftover live AcroForm field would just be dead
    // weight sitting under the drawn text, not a second path.
    form.flatten();
    const finalBytes = await pdfDoc.save();
    return { kind: "acroform", candidates, finalBytes };
  }

  let totalItems = 0;
  const pageItems = [];
  const loadingTask = pdfjsLib.getDocument({ data: bytes.slice() });
  const pdf = await loadingTask.promise;
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    totalItems += content.items.length;
    pageItems.push({ pageIndex: i - 1, items: content.items });
  }
  if (totalItems > 0) {
    return { kind: "vector", candidates: extractVectorPdfCandidates(pageItems), finalBytes: bytes };
  }
  return { kind: "image", candidates: [], finalBytes: bytes };
}

// Resolves a saved field style to the matching pdf-lib StandardFonts value.
// Helvetica/Times/Courier are the only fonts pdf-lib ships without needing a
// real font file embedded, each with the same four bold/italic variants.
function resolveStandardFont(style) {
  const { StandardFonts } = PDFLib;
  const table = {
    Helvetica:  { "": StandardFonts.Helvetica,  bold: StandardFonts.HelveticaBold,  italic: StandardFonts.HelveticaOblique,  boldItalic: StandardFonts.HelveticaBoldOblique },
    TimesRoman: { "": StandardFonts.TimesRoman, bold: StandardFonts.TimesRomanBold, italic: StandardFonts.TimesRomanItalic,  boldItalic: StandardFonts.TimesRomanBoldItalic },
    Courier:    { "": StandardFonts.Courier,    bold: StandardFonts.CourierBold,    italic: StandardFonts.CourierOblique,    boldItalic: StandardFonts.CourierBoldOblique },
  };
  const family = table[style.fontFamily] || table.Helvetica;
  const variant = style.bold && style.italic ? "boldItalic" : style.bold ? "bold" : style.italic ? "italic" : "";
  return family[variant] || family[""];
}

// One embedded-font cache per physical copy — a copy may use several
// distinct font/bold/italic combinations across its fields, but each
// combination only needs embedding once.
async function getEmbeddedFont(doc, fontCache, standardFontName) {
  if (!fontCache.has(standardFontName)) fontCache.set(standardFontName, await doc.embedFont(standardFontName));
  return fontCache.get(standardFontName);
}

// Draws one field's value at its configured coordinate onto the given page.
// allowOverflow: true draws a single unclipped line (may run past the box's
// width, hence "overflow"); false wraps within the box width instead,
// keeping it contained — exactly what pdfgen-vanilla's original 2408-20
// "remarks" field already did with wrap+lineHeight.
async function drawStyledField(doc, pages, fontCache, value, spec) {
  if (!value) return;
  const { rgb } = PDFLib;
  const font = await getEmbeddedFont(doc, fontCache, resolveStandardFont(spec));
  // Every layout assumes a 2-page (front/back) template, but a custom form
  // type's attached PDF may well be a single page (e.g. a blank/generic
  // background) — clamp rather than crash if a field/row's page index
  // doesn't actually exist, drawing onto the last real page instead.
  const page = pages[spec.page] || pages[pages.length - 1];
  const size = spec.fontSize > 0 ? spec.fontSize : 8;
  if (spec.allowOverflow) {
    page.drawText(String(value), { x: spec.x, y: spec.y, size, font, color: rgb(0, 0, 0) });
  } else {
    page.drawText(String(value), {
      x: spec.x, y: spec.y, size, font,
      maxWidth: spec.width, lineHeight: size + 3, color: rgb(0, 0, 0),
    });
  }
}

// Draws one overlay image (a fixed logo/stamp, or a per-instance
// signature filled into a placeholder — see "Form Type Editor overlays"
// in PDF-gen/CLAUDE.md) onto its configured page/box. `dataUrl` is a full
// `data:image/png;base64,...` or `data:image/jpeg;base64,...` string, as
// produced by FileReader.readAsDataURL — pdf-lib needs the mime-specific
// embed call, so the prefix is what tells embedPng vs embedJpg apart.
async function drawOverlayImage(doc, pages, dataUrl, spec) {
  if (!dataUrl) return;
  const match = /^data:(image\/\w+);base64,(.*)$/.exec(dataUrl);
  if (!match) return;
  const [, mime, b64] = match;
  const bytes = b64ToBytes(b64);
  const image = mime === "image/png" ? await doc.embedPng(bytes) : await doc.embedJpg(bytes);
  const page = pages[spec.page] || pages[pages.length - 1];
  page.drawImage(image, { x: spec.x, y: spec.y, width: spec.width, height: spec.height });
}

// Draws every overlay a form type's layout carries onto one physical copy
// — fixed overlays (mode: "fixed") use the image/text baked into the
// layout itself; placeholder overlays (mode: "placeholder", e.g. a
// "Signature" box the type only reserves space for) pull their actual
// content from this specific instance's own `overlayData`, keyed by
// overlay id. A placeholder with nothing filled in yet is simply skipped
// — signing is optional, not validated, per this feature's scope.
async function drawOverlays(doc, pages, fontCache, layout, form, copyIndex) {
  for (const ov of layout.overlays || []) {
    const filled = ov.mode === "placeholder" ? (form.overlayData && form.overlayData[ov.id]) : ov;
    if (!filled) continue;
    if (ov.kind === "image") {
      await drawOverlayImage(doc, pages, filled.imageB64, ov);
    } else if (ov.kind === "text") {
      await drawStyledField(doc, pages, fontCache, filled.text, ov);
    }
  }
}

// Returns an array of loaded, filled, NOT-yet-merged PDFDocuments — one per
// physical copy needed to fit all rows. Shared by every form type, driven
// purely by a schema's `templateB64` + field layout — nothing form-type-
// specific about this loop, so a schema fetched from form-types.json needs
// no per-type wrapper the way pdfgen-vanilla-image's copies2408_XX() was.
async function buildCoordinateCopies(templateB64, form, layout) {
  const { PDFDocument } = PDFLib;
  const templateBytes = b64ToBytes(templateB64);
  // A header-only form type (e.g. one created via "Upload PDF" or the
  // manual schema builder without "Include a repeating row table") has no
  // `rows` array at all and a 0-row-capacity page1/page2 — always exactly
  // one physical copy in that case, since there's no table to overflow.
  const rows = form.rows || [];
  const page1 = layout.page1, page2 = layout.page2;
  const rowsPerCopy = (page1.rows || 0) + (page2.rows || 0);
  const totalCopies = rowsPerCopy > 0 ? Math.max(1, Math.ceil(rows.length / rowsPerCopy)) : 1;
  const exclude = layout.repeatingHeaderExclude || [];
  const docs = [];

  for (let copyIndex = 0; copyIndex < totalCopies; copyIndex++) {
    const templateDoc = await PDFDocument.load(templateBytes);
    const pages = templateDoc.getPages();
    const fontCache = new Map();

    // The running "Page X of Y" stamp only applies to schemas whose layout
    // actually declares those two header keys (every built-in type does) —
    // a header-only custom type (Upload PDF/manual builder, no table to
    // ever overflow into multiple physical copies) has neither, and
    // drawStyledField(..., undefined) would crash reading properties off
    // an undefined spec.
    if (layout.header.page) await drawStyledField(templateDoc, pages, fontCache, String(copyIndex + 1), layout.header.page);
    if (layout.header.pageOf) await drawStyledField(templateDoc, pages, fontCache, String(totalCopies), layout.header.pageOf);
    for (const key of Object.keys(form.header)) {
      if (exclude.includes(key) && copyIndex > 0) continue; // e.g. remarks: copy 1 only
      if (layout.header[key]) await drawStyledField(templateDoc, pages, fontCache, form.header[key], layout.header[key]);
    }

    const start = copyIndex * rowsPerCopy;
    const chunk = rows.slice(start, start + rowsPerCopy);
    for (let i = 0; i < chunk.length; i++) {
      const row = chunk[i];
      const onPage1 = i < page1.rows;
      const grid = onPage1 ? page1 : page2;
      const rowIdx = onPage1 ? i : i - page1.rows;
      const y = grid.startY - rowIdx * grid.spacing;
      const pageIndex = onPage1 ? 0 : 1;
      for (const key of Object.keys(layout.cols)) {
        // yOffset (default 0) lets a column sit on a second physical line
        // below the row's main baseline — e.g. DA 2408-17's 12 "check
        // number" columns print one line under that row's Item/Nomenclature/
        // Qty line, not beside them.
        const spec = { ...layout.cols[key], page: pageIndex, y: y + (layout.cols[key].yOffset || 0) };
        await drawStyledField(templateDoc, pages, fontCache, row[key], spec);
      }
    }

    // Fixed-count extra tables (Verification log, Remarks — never overflow,
    // never repeat: they're document-level content, not per-copy like the
    // header, so they're only drawn once, on the first physical copy).
    if (copyIndex === 0) {
      for (const table of layout.extraTables || []) {
        const tableRows = form[table.rowsKey] || [];
        for (let idx = 0; idx < tableRows.length; idx++) {
          const row = tableRows[idx];
          const y = table.startY - idx * table.spacing;
          for (const key of Object.keys(table.cols)) {
            const spec = { ...table.cols[key], page: table.page, y: y + (table.cols[key].yOffset || 0) };
            await drawStyledField(templateDoc, pages, fontCache, row[key], spec);
          }
        }
      }
    }

    await drawOverlays(templateDoc, pages, fontCache, layout, form, copyIndex);

    docs.push(templateDoc);
  }

  return docs;
}

// Generic per-form-type entry points, replacing the copies2408_XX()/
// buildFilledPdf2408_XX() wrappers pdfgen-vanilla-image attached to each
// schema object — a JSON-fetched schema carries no functions, so these take
// the schema as a plain argument instead. `layout` defaults to the schema's
// own `defaultLayout` (its fetched, un-overridden field positions/styling).
function buildCopiesGeneric(schema, form, layout) {
  return buildCoordinateCopies(schema.templateB64, form, layout || schema.defaultLayout);
}

async function buildFilledPdfGeneric(schema, form, layout) {
  const outDoc = await mergeCoordinateDocs(await buildCopiesGeneric(schema, form, layout));
  return outDoc.save();
}

// Merges several independent, already-filled coordinate-drawn PDFDocuments
// into one output document. Unlike pdfgen-vanilla-multi's AcroForm merge,
// there are no field names to collide or re-attach to an /AcroForm here —
// the text is just drawn directly onto each page, so copyPages() alone is
// the entire merge.
async function mergeCoordinateDocs(sourceDocs) {
  const { PDFDocument } = PDFLib;
  const outDoc = await PDFDocument.create();
  for (const src of sourceDocs) {
    const pages = await outDoc.copyPages(src, src.getPageIndices());
    pages.forEach(p => outDoc.addPage(p));
  }
  return outDoc;
}

// "Export All" — every form instance in the logbook, merged into one PDF.
// Grouped by form type in the order assigned to this document's document
// type (see documentTypeForms / "assign & sort" in pdfgenApp()), each
// type's own instances in the order they appear in the sidebar. A form
// type with no PDF template yet (an admin-created "shape only" type — see
// the Form Types admin panel) has nothing to draw, so it's skipped here
// rather than crashing buildCoordinateCopies on a missing template.
async function buildCombinedPdf(logbook, fieldLayouts, formTypesList) {
  const allDocs = [];
  for (const ft of formTypesList) {
    if (!ft.templateB64) continue;
    const layout = getLayout(ft, fieldLayouts);
    for (const instance of (logbook[formTypeKey(ft.type)] || [])) {
      allDocs.push(...await buildCopiesGeneric(ft, instance, layout));
    }
  }
  if (!allDocs.length) return null;
  const outDoc = await mergeCoordinateDocs(allDocs);
  return outDoc.save();
}
