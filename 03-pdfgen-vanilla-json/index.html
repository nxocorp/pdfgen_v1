    headerFieldErrors(key) {
      if (!this.activeInstance || !this.activeSchema) return [];
      const spec = headerFieldSpec(this.activeSchema, key);
      return validateFieldValue(this.activeInstance.header[key], spec && spec.validation);
    },

    rowFieldErrors(section, row, key) {
      const spec = columnSpec(section, key);
      return validateFieldValue(row[key], spec && spec.validation);
    },

    // Count of currently-invalid fields across the whole active instance —
    // drives the toolbar's validation-summary banner. Recomputed on every
    // render (cheap at this form's scale), so it always reflects the latest
    // edit without a separate dirty-tracking mechanism.
    activeInstanceErrorCount() {
      if (!this.activeInstance || !this.activeSchema) return 0;
      return validateInstance(this.activeSchema, this.activeInstance).length;
    },

    // Toggles the active instance's complete/incomplete state. Marking
    // complete runs full-instance validation first and refuses if anything
    // fails; unmarking (going back to incomplete) is always allowed, no
    // validation required.
    toggleComplete() {
      const instance = this.activeInstance;
      if (!instance) return;
      if (instance.complete) {
        this.snapshotBeforeChange();
        instance.complete = false;
        this.current.updatedAt = new Date().toISOString();
        return;
      }
      const problems = validateInstance(this.activeSchema, instance);
      if (problems.length) {
        this.validationProblems = problems;
        this.showValidationModal = true;
        return;
      }
      this.snapshotBeforeChange();
      instance.complete = true;
      this.current.updatedAt = new Date().toISOString();
    },

    layoutFor(type) {
      const schema = FORM_TYPES.find(f => f.type === type);
      return schema ? getLayout(schema, this.fieldLayouts) : null;
    },

    // ---- per-instance overlay content ("Signature & attachments") ----
    // Only overlays the Form Type Editor marked "Fill per document" show
    // up here — a "fixed" overlay (a baked-in logo/boilerplate note) is
    // type-level and never needs instance input.
    placeholderOverlays() {
      if (!this.activeFormType) return [];
      const layout = this.layoutFor(this.activeFormType);
      return layout ? layout.overlays.filter(o => o.mode === "placeholder") : [];
    },

    // `overlayData` may be missing on an instance saved before this
    // feature existed (old localStorage data) — guarded here rather than
    // via a migration step, same precedent as `complete` in "Mark
    // complete" (see PDF-gen/CLAUDE.md).
    overlayValue(overlayId) {
      const data = this.activeInstance && this.activeInstance.overlayData;
      return (data && data[overlayId]) || {};
    },

    async setInstanceOverlayImage(overlayId, file) {
      if (!file || !this.activeInstance || this.activeInstance.complete) return;
      const dataUrl = await this.readFileAsDataURL(file);
      this.snapshotBeforeChange();
      if (!this.activeInstance.overlayData) this.activeInstance.overlayData = {};
      this.activeInstance.overlayData[overlayId] = { imageB64: dataUrl };
      this.current.updatedAt = new Date().toISOString();
    },

    removeInstanceOverlayImage(overlayId) {
      if (!this.activeInstance || this.activeInstance.complete) return;
      this.snapshotBeforeChange();
      if (this.activeInstance.overlayData) delete this.activeInstance.overlayData[overlayId];
      this.current.updatedAt = new Date().toISOString();
    },

    setInstanceOverlayText(overlayId, value) {
      if (!this.activeInstance || this.activeInstance.complete) return;
      if (!this.activeInstance.overlayData) this.activeInstance.overlayData = {};
      this.activeInstance.overlayData[overlayId] = { text: value };
      this.current.updatedAt = new Date().toISOString();
    },

    async init() {
      await this.loadFormTypes();
      this.load();
      this.$watch("logbooks", () => this.persistLogbooks(), { deep: true });
      this.$watch("defaults", () => this.persistDefaults(), { deep: true });
      this.$watch("fieldLayouts", () => this.persistFieldLayouts(), { deep: true });

      // Global Ctrl/Cmd+Z (undo) and Ctrl/Cmd+Shift+Z or Ctrl+Y (redo) —
      // skipped while a text input/textarea/select has focus so it doesn't
      // fight with the browser's own per-field undo while actively typing.
      window.addEventListener("keydown", (e) => {
        const tag = (e.target && e.target.tagName) || "";
        if (["INPUT", "TEXTAREA", "SELECT"].includes(tag)) return;
        if (!(e.ctrlKey || e.metaKey)) return;
        const key = e.key.toLowerCase();
        if (key === "z") {
          e.preventDefault();
          if (e.shiftKey) this.redo(); else this.undo();
        } else if (key === "y") {
          e.preventDefault();
          this.redo();
        }
      });
    },

    // Simulates fetching the form-type registry from a database — a real
    // backend would serve this same JSON shape from a `form_types` table
    // (see PDF-gen/CLAUDE.md's Stack section); form-types.json stands in
    // for that here. Requires the page to be served over http(s) — unlike
    // pdfgen-vanilla-image's <script src> tags, fetch() of a local file is
    // blocked by the browser under file://.
    async loadFormTypes() {
      if (this.FORM_TYPES.length) return; // guard against a duplicate init() call re-populating this
      try {
        const res = await fetch(FORM_TYPES_URL);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        // must push through the reactive `this.FORM_TYPES`, not the bare
        // module-level FORM_TYPES — Alpine (like the Vue reactivity it's
        // built on) only re-renders on mutations that go through its
        // reactive proxy; mutating the raw backing array bypasses that,
        // so the sidebar would never show the newly-loaded form types even
        // though the underlying array technically had them.
        this.FORM_TYPES.push(...data);
        this.activeFormType = FORM_TYPES[0] ? FORM_TYPES[0].type : null;
        this.formTypesLoaded = true;
      } catch (e) {
        console.error("Could not load form types from " + FORM_TYPES_URL, e);
        this.formTypesError = true;
      }
    },

    load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        this.logbooks = raw ? JSON.parse(raw) : [];
      } catch { this.logbooks = []; }
      try {
        const raw = localStorage.getItem(DEFAULTS_KEY);
        this.defaults = raw ? JSON.parse(raw) : [];
      } catch { this.defaults = []; }
      try {
        const raw = localStorage.getItem(LAYOUTS_KEY);
        this.fieldLayouts = raw ? JSON.parse(raw) : {};
      } catch { this.fieldLayouts = {}; }
    },

    persistLogbooks() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(this.logbooks)); }
      catch (e) { console.warn("Could not save logbooks", e); }
    },

    persistDefaults() {
      try { localStorage.setItem(DEFAULTS_KEY, JSON.stringify(this.defaults)); }
      catch (e) { console.warn("Could not save defaults", e); }
    },

    persistFieldLayouts() {
      try { localStorage.setItem(LAYOUTS_KEY, JSON.stringify(this.fieldLayouts)); }
      catch (e) { console.warn("Could not save field layouts", e); }
    },

    sortedLogbooks() {
      return this.logbooks.slice().sort((a, b) => b.updatedAt.localeCompare(a.updatedAt));
    },

    // A logbook is complete only once every form instance of every form
    // type it contains has been individually marked complete — matches
    // "Mark complete" being an instance-level action (see toggleComplete).
    isLogbookComplete(lb) {
      return FORM_TYPES.every(ft => (lb[formTypeKey(ft.type)] || []).every(inst => inst.complete));
    },

    formatDate(iso) {
      try { return new Date(iso).toLocaleString(); } catch { return iso; }
    },

    defaultSummary(d) {
      return FORM_TYPES
        .map(ft => d.forms[formTypeKey(ft.type)].length + ' × ' + ft.type)
        .join(', ');
    },

    clearPreview() {
      lastPreviewBytes = null;
      this.previewGenerated = false;
      if (this.$refs.previewPages) this.$refs.previewPages.innerHTML = "";
    },

    // ---- new logbook modal ----
    openNewModal() {
      this.newTailNumber = "";
      this.newSource = "blank";
      this.showNewModal = true;
      this.$nextTick(() => this.$refs.tailInput && this.$refs.tailInput.focus());
    },

    confirmCreateLogbook() {
      const tail = this.newTailNumber.trim();
      if (!tail) return;
      let forms;
      if (this.newSource === "blank") {
        forms = emptyLogbookForms();
      } else {
        const d = this.defaults.find(x => x.id === this.newSource);
        forms = d ? cloneLogbookForms(d.forms) : emptyLogbookForms();
      }
      const lb = emptyLogbook(tail, forms);
      this.logbooks.push(lb);
      this.showNewModal = false;
      this.openLogbook(lb.id);
    },

    // ---- save as default modal ----
    openSaveDefaultModal() {
      this.newDefaultName = "";
      this.showSaveDefaultModal = true;
      this.$nextTick(() => this.$refs.defaultNameInput && this.$refs.defaultNameInput.focus());
    },

    confirmSaveDefault() {
      const name = this.newDefaultName.trim();
      if (!name || !this.current) return;
      this.defaults.push({
        id: uid(),
        name,
        createdAt: new Date().toISOString(),
        forms: cloneLogbookForms(this.current),
      });
      this.showSaveDefaultModal = false;
    },

    // ---- automate form entry modal ----
    openAutomateModal() {
      if (!this.activeInstance || this.activeInstance.complete) return;
      this.automateSteps = [
        { key: "request", label: "Sending request to external data source", status: "pending" },
        { key: "response", label: "Waiting for response", status: "pending" },
        { key: "parsing", label: "Parsing response data", status: "pending" },
        { key: "entry", label: "Populating form fields", status: "pending" },
      ];
      this.automateDone = false;
      this.showAutomateModal = true;
      this.runAutomateWorkflow();
    },

    async runAutomateWorkflow() {
      const delays = [650, 550, 500, 450];
      for (let i = 0; i < this.automateSteps.length; i++) {
        this.automateSteps[i].status = "active";
        await new Promise(resolve => setTimeout(resolve, delays[i]));
        this.automateSteps[i].status = "done";
      }

      const schema = this.activeSchema;
      const instance = this.activeInstance;
      if (schema && instance && schema.sampleData) {
        this.snapshotBeforeChange();
        const data = schema.sampleData; // plain data fetched from form-types.json, not a function
        Object.assign(instance.header, data.header);
        // Only tables sampleData actually supplies rows for get replaced —
        // a fixed-count table like a verification/signature log isn't
        // something a real external data source would ever populate, so
        // sampleData simply omits it and the empty slots stay as-is.
        for (const table of tableSectionsOf(schema)) {
          const rowsData = data[table.rowsKey];
          if (rowsData) instance[table.rowsKey] = rowsData.map(r => ({ ...r, id: uid() }));
        }
        this.current.updatedAt = new Date().toISOString();
      }
      this.automateDone = true;
    },

    closeAutomateModal() {
      this.showAutomateModal = false;
    },

    deleteDefault(id) {
      if (!confirm("Delete this default? This cannot be undone.")) return;
      this.defaults = this.defaults.filter(d => d.id !== id);
      if (this.newSource === id) this.newSource = "blank";
    },

    // ---- logbook selection ----
    openLogbook(id) {
      this.currentId = id;
      const lb = this.logbooks.find(l => l.id === id);
      this.activeFormType = FORM_TYPES[0].type;
      this.activeInstanceId = lb ? lb[formTypeKey(this.activeFormType)][0]?.id ?? null : null;
      this.previewPanelOpen = false;
      this.clearPreview();
    },

    // ---- form instance selection (sidebar "Forms in this document") ----
    openFormInstance(type, instanceId) {
      if (this.activeFormType === type && this.activeInstanceId === instanceId) return;
      this.activeFormType = type;
      this.activeInstanceId = instanceId;
      this.previewPanelOpen = false;
      this.clearPreview();
    },

    addFormInstance(type) {
      if (!this.current) return;
      this.snapshotBeforeChange();
      const ft = FORM_TYPES.find(f => f.type === type);
      const list = this.current[formTypeKey(type)];
      const instance = emptyInstance(ft);
      list.push(instance);
      this.current.updatedAt = new Date().toISOString();
      this.openFormInstance(type, instance.id);
    },

    deleteFormInstance(type, instanceId) {
      if (!this.current) return;
      const list = this.current[formTypeKey(type)];
      if (list.length <= 1) {
        alert("A logbook needs at least one instance of each form type.");
        return;
      }
      if (!confirm("Delete this form instance? This cannot be undone.")) return;
      this.snapshotBeforeChange();
      const idx = list.findIndex(i => i.id === instanceId);
      if (idx === -1) return;
      list.splice(idx, 1);
      this.current.updatedAt = new Date().toISOString();
      if (this.activeFormType === type && this.activeInstanceId === instanceId) {
        this.openFormInstance(type, list[0].id);
      }
    },

    deleteLogbook(id) {
      if (!confirm("Delete this logbook? This cannot be undone.")) return;
      this.logbooks = this.logbooks.filter(l => l.id !== id);
      delete this.undoStacks[id];
      delete this.redoStacks[id];
      if (this.currentId === id) {
        this.currentId = null;
        this.previewPanelOpen = false;
        this.clearPreview();
      }
    },

    // ---- undo/redo, scoped to the currently open logbook ----
    snapshotBeforeChange() {
      if (!this.current) return;
      const id = this.currentId;
      const stack = this.undoStacks[id] || (this.undoStacks[id] = []);
      stack.push(JSON.parse(JSON.stringify(this.current)));
      if (stack.length > 100) stack.shift();
      this.redoStacks[id] = [];
    },

    canUndo() {
      const stack = this.undoStacks[this.currentId];
      return !!(stack && stack.length);
    },

    canRedo() {
      const stack = this.redoStacks[this.currentId];
      return !!(stack && stack.length);
    },

    undo() {
      if (!this.canUndo()) return;
      const id = this.currentId;
      const prev = this.undoStacks[id].pop();
      (this.redoStacks[id] || (this.redoStacks[id] = [])).push(JSON.parse(JSON.stringify(this.current)));
      this.applyRestoredLogbook(prev);
    },

    redo() {
      if (!this.canRedo()) return;
      const id = this.currentId;
      const next = this.redoStacks[id].pop();
      (this.undoStacks[id] || (this.undoStacks[id] = [])).push(JSON.parse(JSON.stringify(this.current)));
      this.applyRestoredLogbook(next);
    },

    applyRestoredLogbook(snapshot) {
      const idx = this.logbooks.findIndex(l => l.id === this.currentId);
      if (idx === -1) return;
      this.logbooks[idx] = snapshot;
      const list = snapshot[formTypeKey(this.activeFormType)] || [];
      if (!list.find(i => i.id === this.activeInstanceId)) {
        this.activeInstanceId = list[0] ? list[0].id : null;
      }
      this.clearPreview();
    },

    // opens the right-hand panel and (re)generates the preview into it —
    // the panel is only ever shown via this action, per the "only display
    // the right panel on Print Preview" requirement.
    async showPrintPreview() {
      this.previewPanelOpen = true;
      await this.regeneratePreview();
    },

    addRow(section) {
      const form = this.activeInstance;
      if (!form || form.complete || section.fixedRows) return;
      this.snapshotBeforeChange();
      form[section.rowsKey].push(emptyRowFor(section));
      this.current.updatedAt = new Date().toISOString();
    },

    removeRow(section, idx) {
      const form = this.activeInstance;
      if (!form || form.complete || section.fixedRows) return;
      this.snapshotBeforeChange();
      const rows = form[section.rowsKey];
      rows.splice(idx, 1);
      if (rows.length === 0) rows.push(emptyRowFor(section));
      this.current.updatedAt = new Date().toISOString();
    },

    duplicateRow(section, idx) {
      const form = this.activeInstance;
      if (!form || form.complete || section.fixedRows) return;
      this.snapshotBeforeChange();
      const rows = form[section.rowsKey];
      const copy = { ...rows[idx], id: uid() };
      rows.splice(idx + 1, 0, copy);
      this.current.updatedAt = new Date().toISOString();
    },

    dragStart(idx) {
      this.dragIndex = idx;
    },

    dropRow(section, targetIdx) {
      if (this.dragIndex === null || this.dragIndex === targetIdx) { this.dragIndex = null; return; }
      const form = this.activeInstance;
      if (!form || form.complete || section.fixedRows) { this.dragIndex = null; return; }
      this.snapshotBeforeChange();
      const rows = form[section.rowsKey];
      const [moved] = rows.splice(this.dragIndex, 1);
      rows.splice(targetIdx, 0, moved);
      this.dragIndex = null;
      this.current.updatedAt = new Date().toISOString();
    },

    async regeneratePreview() {
      if (!this.activeInstance) return;
      this.generating = true;
      try {
        const bytes = await buildFilledPdfGeneric(this.activeSchema, this.activeInstance, this.layoutFor(this.activeFormType));
        lastPreviewBytes = bytes;
        await renderPreviewPages(this.$refs.previewPages, bytes);
        this.previewGenerated = true;
      } catch (e) {
        console.error(e);
        alert("Could not generate the PDF preview — see console for details.");
      } finally {
        this.generating = false;
      }
    },

    printPreview() {
      if (!lastPreviewBytes || !this.$refs.previewPages) return;
      printRenderedPages(this.$refs.previewPages);
    },

    openPreviewPdf() {
      if (!lastPreviewBytes) return;
      openBytesInNewWindow(lastPreviewBytes);
    },

    // drag-to-resize the preview panel from its left edge — dragging left
    // (mouse moving toward smaller clientX) widens the panel, since it's
    // anchored to the right side of the window.
    startPreviewResize(e) {
      e.preventDefault();
      const startX = e.clientX;
      const startWidth = this.previewWidth;
      this.resizingPreview = true;
      const prevUserSelect = document.body.style.userSelect;
      document.body.style.userSelect = "none";

      const onMove = (ev) => {
        const delta = startX - ev.clientX;
        this.previewWidth = Math.min(900, Math.max(260, startWidth + delta));
      };
      const onUp = () => {
        this.resizingPreview = false;
        document.body.style.userSelect = prevUserSelect;
        document.removeEventListener("mousemove", onMove);
        document.removeEventListener("mouseup", onUp);
      };
      document.addEventListener("mousemove", onMove);
      document.addEventListener("mouseup", onUp);
    },

    // "Export All" — every form instance in this logbook, merged into one
    // PDF, rendered into the preview panel and then immediately opened in a
    // new tab (the same action "Open PDF" performs for a single instance),
    // so exporting the whole document is one click instead of two.
    async exportAll() {
      if (!this.current) return;
      this.previewPanelOpen = true;
      this.generating = true;
      try {
        const bytes = await buildCombinedPdf(this.current, this.fieldLayouts);
        lastPreviewBytes = bytes;
        await renderPreviewPages(this.$refs.previewPages, bytes);
        this.previewGenerated = true;
        this.openPreviewPdf();
      } catch (e) {
        console.error(e);
        alert("Could not generate the combined PDF — see console for details.");
      } finally {
        this.generating = false;
      }
    },

    // ================= Form Type Editor =================

    cloneLayout(layout) {
      return JSON.parse(JSON.stringify(layout));
    },

    openEditorModal(type) {
      const schema = FORM_TYPES.find(f => f.type === type);
      if (!schema) return;
      this.editorFormType = type;
      this.editorPageIndex = 0;
      this.editorLabels = { header: {}, col: {} };
      for (const section of schema.sections) {
        if (section.kind === "fields") {
          for (const f of section.fields) {
            this.editorLabels.header[f.key] = (section.title ? section.title + " — " : "") + (f.label || f.key);
          }
        } else if (section.kind === "table") {
          for (const c of section.columns) {
            this.editorLabels.col[c.key] = (section.title ? section.title + " — " : "") + c.label;
          }
        }
      }
      this.editorDraft = this.cloneLayout(getLayout(schema, this.fieldLayouts));
      this.editorSelectedKind = null;
      this.editorSelectedKey = null;
      this.showEditorModal = true;
      this.$nextTick(() => this.renderEditorPage());
    },

    switchEditorPage(idx) {
      this.editorPageIndex = idx;
      this.$nextTick(() => this.renderEditorPage());
    },

    async renderEditorPage() {
      const schema = this.editorSchema;
      const canvas = this.$refs.editorCanvas;
      if (!schema || !canvas) return;
      const bytes = b64ToBytes(schema.templateB64);
      const loadingTask = pdfjsLib.getDocument({ data: bytes.slice() });
      const pdf = await loadingTask.promise;
      const page = await pdf.getPage(this.editorPageIndex + 1);
      const viewport = page.getViewport({ scale: this.editorScale });
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
    },

    // Finds the object holding a table column's spec by key — either the
    // primary (growable, page1/page2) table's `cols`, or one of the
    // fixed-count `extraTables`' own `cols`. Column keys are unique across
    // a schema's table sections by convention, so a flat key lookup is
    // enough; this is what lets a fixed-count extra table (e.g. DA
    // 2408-17's Verification log) reuse every existing 'col'-kind editor
    // interaction (select/drag/resize) with no separate box kind.
    findColBucket(draft, key) {
      if (draft.cols[key]) return draft.cols;
      for (const table of draft.extraTables || []) if (table.cols[key]) return table.cols;
      return null;
    },

    findExtraTableForColKey(draft, key) {
      return (draft.extraTables || []).find(t => t.cols[key]) || null;
    },

    editorBoxesForCurrentPage() {
      const draft = this.editorDraft;
      if (!draft) return [];
      const boxes = [];
      for (const key of Object.keys(draft.header)) {
        const spec = draft.header[key];
        if (spec.page !== this.editorPageIndex) continue;
        boxes.push({ kind: "header", key, label: this.editorLabels.header[key] || key, x: spec.x, y: spec.y, width: spec.width, fontSize: spec.fontSize });
      }
      const grid = this.editorPageIndex === 0 ? draft.page1 : draft.page2;
      for (const key of Object.keys(draft.cols)) {
        const spec = draft.cols[key];
        boxes.push({ kind: "col", key, label: this.editorLabels.col[key] || key, x: spec.x, y: grid.startY + (spec.yOffset || 0), width: spec.width, fontSize: spec.fontSize });
      }
      for (const table of draft.extraTables || []) {
        if (table.page !== this.editorPageIndex) continue;
        for (const key of Object.keys(table.cols)) {
          const spec = table.cols[key];
          boxes.push({ kind: "col", key, label: this.editorLabels.col[key] || key, x: spec.x, y: table.startY + (spec.yOffset || 0), width: spec.width, fontSize: spec.fontSize });
        }
      }
      for (const ov of draft.overlays || []) {
        if (ov.page !== this.editorPageIndex) continue;
        boxes.push({
          kind: "overlay", key: ov.id, overlayKind: ov.kind,
          label: ov.label || (ov.kind === "image" ? "Image" : "Text box"),
          x: ov.x, y: ov.y, width: ov.width, height: ov.height, fontSize: ov.fontSize,
        });
      }
      return boxes;
    },

    // Converts a field's PDF-point box into on-canvas CSS pixels. PDF's
    // origin is bottom-left; the canvas/DOM origin is top-left, so the
    // vertical axis is flipped here — this is the one piece of math the
    // whole drag/resize interaction depends on getting right. An image
    // overlay's (x, y) is pdf-lib drawImage's bottom-left corner, so its
    // on-canvas top is offset by its own full height; every other box
    // kind (text-based) keeps the original fontSize-derived offset.
    editorBoxStyle(box) {
      const scale = this.editorScale;
      const isImage = box.kind === "overlay" && box.overlayKind === "image";
      const fontSize = box.fontSize || 8;
      const boxHeight = isImage ? (box.height || 40) : fontSize * 1.6;
      const topOffset = isImage ? boxHeight : fontSize * 1.2;
      const left = box.x * scale;
      const top = (792 - box.y - topOffset) * scale;
      const width = (box.width || 40) * scale;
      const height = boxHeight * scale;
      return `left:${left}px; top:${top}px; width:${width}px; height:${height}px; font-size:${Math.max(9, fontSize * scale * 0.85)}px;`;
    },

    selectEditorField(kind, key) {
      this.editorSelectedKind = kind;
      this.editorSelectedKey = key;
      if (kind === "header" && this.editorDraft) {
        const page = this.editorDraft.header[key].page;
        if (page !== this.editorPageIndex) this.switchEditorPage(page);
      } else if (kind === "col" && this.editorDraft) {
        const extra = this.findExtraTableForColKey(this.editorDraft, key);
        if (extra && extra.page !== this.editorPageIndex) this.switchEditorPage(extra.page);
      } else if (kind === "overlay" && this.editorDraft) {
        const ov = this.overlayByKey(key);
        if (ov && ov.page !== this.editorPageIndex) this.switchEditorPage(ov.page);
      }
    },

    overlayByKey(id) {
      return this.editorDraft ? (this.editorDraft.overlays || []).find(o => o.id === id) || null : null;
    },

    editorSelectedSpec() {
      if (!this.editorDraft || !this.editorSelectedKind || !this.editorSelectedKey) return null;
      if (this.editorSelectedKind === "overlay") return this.overlayByKey(this.editorSelectedKey);
      const bucket = this.editorSelectedKind === "header" ? this.editorDraft.header : this.findColBucket(this.editorDraft, this.editorSelectedKey);
      return (bucket && bucket[this.editorSelectedKey]) || null;
    },

    editorSelectedLabel() {
      if (!this.editorSelectedKind || !this.editorSelectedKey) return "";
      if (this.editorSelectedKind === "overlay") {
        const ov = this.overlayByKey(this.editorSelectedKey);
        return (ov && ov.label) || (ov && ov.kind === "image" ? "Image" : "Text box") || "";
      }
      return this.editorLabels[this.editorSelectedKind][this.editorSelectedKey] || this.editorSelectedKey;
    },

    // The row grid backing whichever 'col' box is selected — the primary
    // table's page1/page2 (unchanged), or a fixed-count extra table's own
    // startY/spacing/rows object directly (mutating it here mutates
    // editorDraft.extraTables[i] in place, same as page1/page2).
    editorCurrentGrid() {
      if (!this.editorDraft) return { startY: 0, spacing: 0, rows: 0 };
      if (this.editorSelectedKind === "col" && this.editorSelectedKey) {
        const extra = this.findExtraTableForColKey(this.editorDraft, this.editorSelectedKey);
        if (extra) return extra;
      }
      return this.editorPageIndex === 0 ? this.editorDraft.page1 : this.editorDraft.page2;
    },

    startBoxDrag(e, box) {
      e.preventDefault();
      const startX = e.clientX, startY = e.clientY;
      const origX = box.x, origY = box.y;
      const colBucket = box.kind === "col" ? this.findColBucket(this.editorDraft, box.key) : null;
      const origYOffset = colBucket ? (colBucket[box.key].yOffset || 0) : 0;
      const scale = this.editorScale;
      const onMove = (ev) => {
        const dx = (ev.clientX - startX) / scale;
        const dy = (ev.clientY - startY) / scale; // canvas-down is positive; PDF-up is positive, so flip below
        if (box.kind === "header" || box.kind === "overlay") {
          const spec = box.kind === "header" ? this.editorDraft.header[box.key] : this.overlayByKey(box.key);
          spec.x = Math.round((origX + dx) * 10) / 10;
          spec.y = Math.round((origY - dy) * 10) / 10;
        } else {
          const bucket = this.findColBucket(this.editorDraft, box.key);
          const spec = bucket[box.key];
          spec.x = Math.round((origX + dx) * 10) / 10;
          if (spec.independentY) {
            // This column opted out of following its table's shared row
            // grid (see "Move independently" below) — vertical drag
            // adjusts its own yOffset instead of the whole table's
            // startY, so it can sit on a different line than the rest of
            // the row (e.g. DA 2408-17's Item No./Nomenclature sitting
            // above that row's 12 check-number columns).
            spec.yOffset = Math.round((origYOffset - dy) * 10) / 10;
          } else {
            const extra = this.findExtraTableForColKey(this.editorDraft, box.key);
            const grid = extra || (this.editorPageIndex === 0 ? this.editorDraft.page1 : this.editorDraft.page2);
            grid.startY = Math.round((origY - dy) * 10) / 10;
          }
        }
      };
      const onUp = () => {
        document.removeEventListener("mousemove", onMove);
        document.removeEventListener("mouseup", onUp);
      };
      document.addEventListener("mousemove", onMove);
      document.addEventListener("mouseup", onUp);
    },

    startBoxResize(e, box) {
      e.preventDefault();
      const startX = e.clientX;
      const origWidth = box.width || 40;
      const scale = this.editorScale;
      const bucket = box.kind === "header" ? this.editorDraft.header : box.kind === "col" ? this.findColBucket(this.editorDraft, box.key) : null;
      const onMove = (ev) => {
        const dx = (ev.clientX - startX) / scale;
        const newWidth = Math.max(8, Math.round((origWidth + dx) * 10) / 10);
        if (box.kind === "overlay") this.overlayByKey(box.key).width = newWidth;
        else bucket[box.key].width = newWidth;
      };
      const onUp = () => {
        document.removeEventListener("mousemove", onMove);
        document.removeEventListener("mouseup", onUp);
      };
      document.addEventListener("mousemove", onMove);
      document.addEventListener("mouseup", onUp);
    },

    // Bottom-edge drag, image overlays only — adjusts height, the one
    // dimension a text-based box never needs (its height is always
    // derived from font size).
    startBoxResizeHeight(e, box) {
      e.preventDefault();
      const startY = e.clientY;
      const origHeight = box.height || 40;
      const scale = this.editorScale;
      const spec = this.overlayByKey(box.key);
      const onMove = (ev) => {
        const dy = (ev.clientY - startY) / scale;
        spec.height = Math.max(8, Math.round((origHeight + dy) * 10) / 10);
      };
      const onUp = () => {
        document.removeEventListener("mousemove", onMove);
        document.removeEventListener("mouseup", onUp);
      };
      document.addEventListener("mousemove", onMove);
      document.addEventListener("mouseup", onUp);
    },

    // Reads a File as a data URL (e.g. "data:image/png;base64,...") — the
    // form pdf-lib's embedPng/embedJpg and an <img src> preview both want.
    readFileAsDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(file);
      });
    },

    async addImageOverlay(file) {
      if (!file || !this.editorDraft) return;
      const imageB64 = await this.readFileAsDataURL(file);
      const overlay = {
        id: uid(), kind: "image", mode: "fixed", page: this.editorPageIndex,
        x: 40, y: 40, width: 120, height: 50, label: "Image", imageB64,
      };
      this.editorDraft.overlays.push(overlay);
      this.selectEditorField("overlay", overlay.id);
    },

    addTextOverlay() {
      if (!this.editorDraft) return;
      const overlay = {
        id: uid(), kind: "text", mode: "fixed", page: this.editorPageIndex,
        x: 40, y: 40, width: 150, fontSize: 10, fontFamily: "Helvetica",
        bold: false, italic: false, allowOverflow: true, label: "Text box", text: "New text",
      };
      this.editorDraft.overlays.push(overlay);
      this.selectEditorField("overlay", overlay.id);
    },

    removeOverlay(id) {
      if (!this.editorDraft) return;
      this.editorDraft.overlays = this.editorDraft.overlays.filter(o => o.id !== id);
      if (this.editorSelectedKind === "overlay" && this.editorSelectedKey === id) {
        this.editorSelectedKind = null;
        this.editorSelectedKey = null;
      }
    },

    async replaceOverlayImage(overlay, file) {
      if (!file || !overlay) return;
      overlay.imageB64 = await this.readFileAsDataURL(file);
    },

    // Toggling "Fill per document" clears whatever fixed content the
    // overlay was carrying (image or text) — switching to a placeholder
    // means every instance supplies its own, so a stale baked-in value
    // left behind would be confusing (and would leak into instances that
    // never touch this box, since drawOverlays only reads instance data
    // for placeholder-mode overlays in the first place).
    setOverlayPlaceholder(overlay, isPlaceholder) {
      if (!overlay) return;
      overlay.mode = isPlaceholder ? "placeholder" : "fixed";
      if (isPlaceholder) {
        delete overlay.imageB64;
        delete overlay.text;
      }
    },

    // Toggling a column off "independent" snaps its yOffset back to 0 —
    // otherwise a hidden nonzero offset would keep silently shifting the
    // column even after the checkbox no longer shows any way to see or
    // edit it, which would look like the position "randomly" reverted the
    // next time this column happened to get selected.
    toggleIndependentY(spec, isIndependent) {
      if (!spec) return;
      spec.independentY = isIndependent;
      if (!isIndependent) spec.yOffset = 0;
    },

    resetEditorAll() {
      const schema = this.editorSchema;
      if (!schema) return;
      if (!confirm("Reset every field in this form type back to its default position and styling? This also removes any images/text boxes added here.")) return;
      this.editorDraft = this.cloneLayout(schema.defaultLayout);
      this.editorSelectedKind = null;
      this.editorSelectedKey = null;
    },

    confirmSaveEditor() {
      if (!this.editorFormType) return;
      this.fieldLayouts[this.editorFormType] = this.editorDraft;
      this.showEditorModal = false;
      if (this.activeFormType === this.editorFormType) this.clearPreview();
    },
  };
}

// ---------------------------------------------------------------------------
// Shared coordinate-fill infrastructure. Every form type in this POC is a
// flat, fieldless PDF (see "Two POC tracks" / this folder's own scope in
// PDF-gen/CLAUDE.md), so filling means drawing text at authored (page, x, y)
// positions rather than setting named AcroForm fields — and merging several
// filled copies is correspondingly simpler than pdfgen-vanilla-multi's
// AcroForm path: there are no field names to collide, so copyPages() alone
// is enough.
// ---------------------------------------------------------------------------
function b64ToBytes(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

// Resolves a saved field style to the matching pdf-lib StandardFonts value.
// Helvetica/Times/Courier are the only fonts pdf-lib ships without needing a
// real font file embedded, each with the same four bold/italic variants.
function resolveStandardFont(style) {
  const { StandardFonts } = PDFLib;
  const table = {
    Helvetica:  { "": StandardFonts.Helvetica,  bold: StandardFonts.HelveticaBold,  italic: StandardFonts.HelveticaOblique,  boldItalic: StandardFonts.HelveticaBoldOblique },
    TimesRoman: { "": StandardFonts.TimesRoman, bold: StandardFonts.TimesRomanBold, italic: StandardFonts.TimesRomanItalic,  boldItalic: StandardFonts.TimesRomanBoldItalic },
    Courier:    { "": StandardFonts.Courier,    bold: StandardFonts.CourierBold,    italic: StandardFonts.CourierOblique,    boldItalic: StandardFonts.CourierBoldOblique },
  };
  const family = table[style.fontFamily] || table.Helvetica;
  const variant = style.bold && style.italic ? "boldItalic" : style.bold ? "bold" : style.italic ? "italic" : "";
  return family[variant] || family[""];
}

// One embedded-font cache per physical copy — a copy may use several
// distinct font/bold/italic combinations across its fields, but each
// combination only needs embedding once.
async function getEmbeddedFont(doc, fontCache, standardFontName) {
  if (!fontCache.has(standardFontName)) fontCache.set(standardFontName, await doc.embedFont(standardFontName));
  return fontCache.get(standardFontName);
}

// Draws one field's value at its configured coordinate onto the given page.
// allowOverflow: true draws a single unclipped line (may run past the box's
// width, hence "overflow"); false wraps within the box width instead,
// keeping it contained — exactly what pdfgen-vanilla's original 2408-20
// "remarks" field already did with wrap+lineHeight.
async function drawStyledField(doc, pages, fontCache, value, spec) {
  if (!value) return;
  const { rgb } = PDFLib;
  const font = await getEmbeddedFont(doc, fontCache, resolveStandardFont(spec));
  const page = pages[spec.page];
  const size = spec.fontSize > 0 ? spec.fontSize : 8;
  if (spec.allowOverflow) {
    page.drawText(String(value), { x: spec.x, y: spec.y, size, font, color: rgb(0, 0, 0) });
  } else {
    page.drawText(String(value), {
      x: spec.x, y: spec.y, size, font,
      maxWidth: spec.width, lineHeight: size + 3, color: rgb(0, 0, 0),
    });
  }
}

// Draws one overlay image (a fixed logo/stamp, or a per-instance
// signature filled into a placeholder — see "Form Type Editor overlays"
// in PDF-gen/CLAUDE.md) onto its configured page/box. `dataUrl` is a full
// `data:image/png;base64,...` or `data:image/jpeg;base64,...` string, as
// produced by FileReader.readAsDataURL — pdf-lib needs the mime-specific
// embed call, so the prefix is what tells embedPng vs embedJpg apart.
async function drawOverlayImage(doc, pages, dataUrl, spec) {
  if (!dataUrl) return;
  const match = /^data:(image\/\w+);base64,(.*)$/.exec(dataUrl);
  if (!match) return;
  const [, mime, b64] = match;
  const bytes = b64ToBytes(b64);
  const image = mime === "image/png" ? await doc.embedPng(bytes) : await doc.embedJpg(bytes);
  const page = pages[spec.page];
  page.drawImage(image, { x: spec.x, y: spec.y, width: spec.width, height: spec.height });
}

// Draws every overlay a form type's layout carries onto one physical copy
// — fixed overlays (mode: "fixed") use the image/text baked into the
// layout itself; placeholder overlays (mode: "placeholder", e.g. a
// "Signature" box the type only reserves space for) pull their actual
// content from this specific instance's own `overlayData`, keyed by
// overlay id. A placeholder with nothing filled in yet is simply skipped
// — signing is optional, not validated, per this feature's scope.
async function drawOverlays(doc, pages, fontCache, layout, form, copyIndex) {
  for (const ov of layout.overlays || []) {
    const filled = ov.mode === "placeholder" ? (form.overlayData && form.overlayData[ov.id]) : ov;
    if (!filled) continue;
    if (ov.kind === "image") {
      await drawOverlayImage(doc, pages, filled.imageB64, ov);
    } else if (ov.kind === "text") {
      await drawStyledField(doc, pages, fontCache, filled.text, ov);
    }
  }
}

// Returns an array of loaded, filled, NOT-yet-merged PDFDocuments — one per
// physical copy needed to fit all rows. Shared by every form type, driven
// purely by a schema's `templateB64` + field layout — nothing form-type-
// specific about this loop, so a schema fetched from form-types.json needs
// no per-type wrapper the way pdfgen-vanilla-image's copies2408_XX() was.
async function buildCoordinateCopies(templateB64, form, layout) {
  const { PDFDocument } = PDFLib;
  const templateBytes = b64ToBytes(templateB64);
  const rows = form.rows;
  const page1 = layout.page1, page2 = layout.page2;
  const rowsPerCopy = page1.rows + page2.rows;
  const totalCopies = Math.max(1, Math.ceil(rows.length / rowsPerCopy));
  const exclude = layout.repeatingHeaderExclude || [];
  const docs = [];

  for (let copyIndex = 0; copyIndex < totalCopies; copyIndex++) {
    const templateDoc = await PDFDocument.load(templateBytes);
    const pages = templateDoc.getPages();
    const fontCache = new Map();

    await drawStyledField(templateDoc, pages, fontCache, String(copyIndex + 1), layout.header.page);
    await drawStyledField(templateDoc, pages, fontCache, String(totalCopies), layout.header.pageOf);
    for (const key of Object.keys(form.header)) {
      if (exclude.includes(key) && copyIndex > 0) continue; // e.g. remarks: copy 1 only
      if (layout.header[key]) await drawStyledField(templateDoc, pages, fontCache, form.header[key], layout.header[key]);
    }

    const start = copyIndex * rowsPerCopy;
    const chunk = rows.slice(start, start + rowsPerCopy);
    for (let i = 0; i < chunk.length; i++) {
      const row = chunk[i];
      const onPage1 = i < page1.rows;
      const grid = onPage1 ? page1 : page2;
      const rowIdx = onPage1 ? i : i - page1.rows;
      const y = grid.startY - rowIdx * grid.spacing;
      const pageIndex = onPage1 ? 0 : 1;
      for (const key of Object.keys(layout.cols)) {
        // yOffset (default 0) lets a column sit on a second physical line
        // below the row's main baseline — e.g. DA 2408-17's 12 "check
        // number" columns print one line under that row's Item/Nomenclature/
        // Qty line, not beside them.
        const spec = { ...layout.cols[key], page: pageIndex, y: y + (layout.cols[key].yOffset || 0) };
        await drawStyledField(templateDoc, pages, fontCache, row[key], spec);
      }
    }

    // Fixed-count extra tables (Verification log, Remarks — never overflow,
    // never repeat: they're document-level content, not per-copy like the
    // header, so they're only drawn once, on the first physical copy).
    if (copyIndex === 0) {
      for (const table of layout.extraTables || []) {
        const tableRows = form[table.rowsKey] || [];
        for (let idx = 0; idx < tableRows.length; idx++) {
          const row = tableRows[idx];
          const y = table.startY - idx * table.spacing;
          for (const key of Object.keys(table.cols)) {
            const spec = { ...table.cols[key], page: table.page, y: y + (table.cols[key].yOffset || 0) };
            await drawStyledField(templateDoc, pages, fontCache, row[key], spec);
          }
        }
      }
    }

    await drawOverlays(templateDoc, pages, fontCache, layout, form, copyIndex);

    docs.push(templateDoc);
  }

  return docs;
}

// Generic per-form-type entry points, replacing the copies2408_XX()/
// buildFilledPdf2408_XX() wrappers pdfgen-vanilla-image attached to each
// schema object — a JSON-fetched schema carries no functions, so these take
// the schema as a plain argument instead. `layout` defaults to the schema's
// own `defaultLayout` (its fetched, un-overridden field positions/styling).
function buildCopiesGeneric(schema, form, layout) {
  return buildCoordinateCopies(schema.templateB64, form, layout || schema.defaultLayout);
}

async function buildFilledPdfGeneric(schema, form, layout) {
  const outDoc = await mergeCoordinateDocs(await buildCopiesGeneric(schema, form, layout));
  return outDoc.save();
}

// Merges several independent, already-filled coordinate-drawn PDFDocuments
// into one output document. Unlike pdfgen-vanilla-multi's AcroForm merge,
// there are no field names to collide or re-attach to an /AcroForm here —
// the text is just drawn directly onto each page, so copyPages() alone is
// the entire merge.
async function mergeCoordinateDocs(sourceDocs) {
  const { PDFDocument } = PDFLib;
  const outDoc = await PDFDocument.create();
  for (const src of sourceDocs) {
    const pages = await outDoc.copyPages(src, src.getPageIndices());
    pages.forEach(p => outDoc.addPage(p));
  }
  return outDoc;
}

// "Print All" — every form instance in the logbook, merged into one PDF.
// Grouped by form type in numeric order, each type's own instances in the
// order they appear in the sidebar.
async function buildCombinedPdf(logbook, fieldLayouts) {
  const allDocs = [];
  for (const ft of FORM_TYPES) {
    const layout = getLayout(ft, fieldLayouts);
    for (const instance of logbook[formTypeKey(ft.type)]) {
      allDocs.push(...await buildCopiesGeneric(ft, instance, layout));
    }
  }
  const outDoc = await mergeCoordinateDocs(allDocs);
  return outDoc.save();
}
