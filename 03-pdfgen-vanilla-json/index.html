<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF-gen POC (json) — UH-60R Logbook</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>

<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --border: #d7dae0; --border-strong: #b9bec8;
    --text: #1d222b; --muted: #6b7280; --accent: #3454d1; --accent-bg: #eaeefc;
    --danger: #b42318;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; }

  header.topbar {
    height: 52px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    padding: 0 18px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  header.topbar .brand { font-weight: 700; font-size: 14px; letter-spacing: -0.01em; }
  header.topbar .sub { font-size: 12px; color: var(--muted); margin-left: 10px; }

  .app-body { flex: 1; display: flex; min-height: 0; }

  /* ---------- Sidebar ---------- */
  aside.sidebar {
    width: 260px; flex-shrink: 0; display: flex; flex-direction: column;
    background: #fbfbfc; border-right: 1px solid var(--border);
  }
  aside.sidebar.collapsed { width: 44px; align-items: center; }
  .sidebar-toggle {
    width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--border-strong); border-radius: 5px; background: #fff; color: var(--muted);
    cursor: pointer; flex-shrink: 0;
  }
  .sidebar-toggle:hover { background: #f0f1f3; }
  .sidebar-collapsed-strip { padding: 12px 0; display: flex; justify-content: center; }
  .sidebar-header-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 0; }
  .sidebar-section { padding: 12px 14px 4px; }
  .sidebar-label { font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
  .model-pill {
    display: inline-block; margin-top: 6px; font-size: 12px; font-weight: 600; padding: 4px 10px;
    border-radius: 12px; background: var(--accent-bg); color: var(--accent);
  }
  .doctype-line { font-size: 11.5px; color: var(--muted); margin-top: 6px; }
  .sidebar-list { flex: 1; overflow-y: auto; padding: 4px 8px 8px; }
  .sidebar-item {
    display: flex; align-items: center; gap: 8px; padding: 8px 8px; border-radius: 6px; cursor: pointer;
    font-size: 12.5px;
  }
  .sidebar-item:hover { background: #f0f1f3; }
  .sidebar-item.active { background: var(--accent-bg); }
  .sidebar-item .tail { font-family: ui-monospace, Menlo, monospace; font-weight: 600; flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sidebar-item .meta { font-size: 10px; color: var(--muted); }
  .sidebar-item .del { opacity: 0; color: var(--danger); font-size: 15px; line-height: 1; background: none; border: none; cursor: pointer; }
  .sidebar-item:hover .del, .sidebar-item:hover .instance-rename-btn { opacity: 1; }
  .sidebar-empty { padding: 14px 8px; font-size: 12px; color: var(--muted); }
  .sidebar-footer { padding: 12px 14px; border-top: 1px solid var(--border); }
  .sidebar-footer .btn { width: 100%; justify-content: center; }

  .form-type-group { margin-bottom: 4px; }
  .form-type-header {
    display: flex; align-items: center; gap: 6px; padding: 8px 8px 4px;
    font-size: 11px; font-weight: 700; color: var(--text);
  }
  .form-type-header .form-type-count { color: var(--muted); font-weight: 600; }
  .form-type-actions { margin-left: auto; display: flex; gap: 4px; }
  .form-type-collapse {
    width: 16px; height: 16px; flex-shrink: 0; line-height: 1; display: flex; align-items: center; justify-content: center;
    border: none; background: none; color: var(--muted); font-size: 10px; cursor: pointer; padding: 0;
  }
  .form-type-collapse:hover { color: var(--text); }
  .form-type-gear, .form-type-add {
    width: 18px; height: 18px; line-height: 1; display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--border-strong); border-radius: 4px; background: #fff; color: var(--muted); font-size: 13px;
    cursor: pointer; padding: 0;
  }
  .form-type-gear:hover, .form-type-add:hover { background: #f0f1f3; color: var(--text); }
  .form-instance-item { padding-left: 18px; font-size: 12px; }
  .instance-rename-btn {
    opacity: 0; flex-shrink: 0; color: var(--muted); background: none; border: none; cursor: pointer; font-size: 12px; padding: 0;
  }
  .instance-rename-btn:hover { color: var(--accent); }
  .instance-rename-input {
    flex: 1; min-width: 0; font-size: 12px; padding: 3px 5px; border: 1px solid var(--accent); border-radius: 4px;
    font-family: inherit; background: #fff; color: var(--text);
  }

  /* ---------- Center ---------- */
  main.center { flex: 1; min-width: 0; overflow-y: auto; padding: 22px 26px 60px; }
  .placeholder { max-width: 420px; margin: 60px auto 0; text-align: center; color: var(--muted); font-size: 13px; }

  .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 12px; }
  .toolbar .titles h1 { font-size: 18px; margin: 0 0 2px; display: inline-block; }
  .toolbar .titles .cap { font-size: 12px; color: var(--muted); }
  .toolbar .actions { display: flex; gap: 8px; flex-shrink: 0; }
  .status-pill {
    display: inline-block; margin-left: 10px; font-size: 10.5px; font-weight: 700; letter-spacing: .03em;
    text-transform: uppercase; padding: 3px 9px; border-radius: 10px; vertical-align: middle;
  }
  .status-complete { background: #e7f7ee; color: #1a7f4b; }
  .status-incomplete { background: #f0f1f3; color: var(--muted); }
  .validation-summary {
    font-size: 12px; color: var(--danger); background: #fef4f2; border: 1px solid #f3c6bd; border-radius: 6px;
    padding: 8px 12px; margin-bottom: 14px; white-space: pre-line;
  }
  .validation-modal-list { max-height: 320px; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 4px; }
  .validation-modal-row { display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px; border-bottom: 1px solid #f1f2f4; }
  .validation-modal-row:last-child { border-bottom: none; }
  .validation-modal-badge {
    flex-shrink: 0; font-size: 9.5px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase;
    padding: 3px 7px; border-radius: 8px; margin-top: 1px;
  }
  .badge-pending { background: #fff6e5; color: #7a5200; }
  .badge-invalid { background: #fef4f2; color: var(--danger); }
  .validation-modal-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .validation-modal-field { font-size: 12.5px; font-weight: 600; color: var(--text); }
  .validation-modal-msg { font-size: 11.5px; color: var(--muted); }

  .btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; font-size: 13px; font-weight: 600;
    border-radius: 6px; border: 1px solid var(--border-strong); background: #fff; color: var(--text); cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover { background: #f0f1f3; }
  .btn-primary { border-color: var(--accent); background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #2a44b8; }
  .btn-sm { padding: 5px 10px; font-size: 12px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-label-disabled { opacity: .5; cursor: not-allowed; pointer-events: none; }

  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; }
  .section-title {
    font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
    color: var(--muted); padding: 14px 16px 8px;
  }
  .field-grid { display: grid; gap: 12px; padding: 0 16px 16px; }
  label { display: block; font-size: 10.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; margin-bottom: 4px; min-height: 1px; }
  .req-star { color: var(--danger); text-transform: none; }
  input[type=text], input[type=number], textarea, select {
    width: 100%; padding: 7px 9px; font-size: 13px; border: 1px solid var(--border-strong); border-radius: 5px;
    font-family: inherit; background: #fff; color: var(--text);
  }
  textarea { resize: vertical; min-height: 60px; }
  input:read-only, textarea:read-only { background: #f4f5f7; color: var(--muted); }
  .input-invalid { border-color: var(--danger) !important; background: #fef4f2; }

  table.rows { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.rows th {
    text-align: left; font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase;
    padding: 6px 6px; border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  table.rows td { padding: 4px 4px; border-bottom: 1px solid #eef0f2; vertical-align: top; }
  table.rows input[type=text] { font-size: 12px; padding: 5px 6px; }
  .row-num { font-family: ui-monospace, Menlo, monospace; color: var(--muted); font-size: 11px; padding-top: 8px; }
  .drag-handle { cursor: grab; color: var(--muted); text-align: center; padding-top: 7px; user-select: none; font-size: 13px; }
  .drag-handle:active { cursor: grabbing; }
  table.rows tr.dragging { opacity: .4; }
  .row-actions { display: flex; gap: 2px; padding-top: 4px; }
  .row-actions button {
    display: flex; align-items: center; justify-content: center;
    background: none; border: none; cursor: pointer; padding: 4px;
    color: var(--muted); border-radius: 4px;
  }
  .row-actions button:disabled { opacity: .35; cursor: not-allowed; }
  .row-actions button:hover { background: #f0f1f3; }
  .row-actions button.danger:hover { color: var(--danger); }
  .table-wrap { overflow-x: auto; padding: 0 16px 8px; }
  .table-actions { padding: 4px 16px 16px; }

  .banner-note {
    font-size: 12px; color: #7a5200; background: #fff6e5; border: 1px solid #f0dca6; border-radius: 6px;
    padding: 8px 12px; margin-bottom: 14px;
  }

  /* ---------- Right preview panel ---------- */
  aside.preview {
    flex-shrink: 0; display: flex; flex-direction: column;
    border-left: 1px solid var(--border); background: #fff;
  }
  .preview-resizer {
    width: 6px; flex-shrink: 0; cursor: col-resize; background: transparent;
    position: relative;
  }
  .preview-resizer:hover, .preview-resizer.resizing { background: var(--accent-bg); }
  .preview-resizer::after {
    content: ""; position: absolute; top: 0; bottom: 0; left: 2px; width: 2px; background: var(--border);
  }
  .preview-toolbar {
    height: 46px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    padding: 0 12px; border-bottom: 1px solid var(--border);
  }
  .preview-toolbar .label { font-size: 12px; font-weight: 600; color: var(--muted); }
  .preview-frame-wrap { flex: 1; background: #e9eaec; overflow: auto; }
  .preview-pages { padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .preview-pages canvas { max-width: 100%; height: auto; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
  .preview-empty { height: 100%; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 12.5px; text-align: center; padding: 20px; }
  .preview-footer { padding: 8px 12px; border-top: 1px solid var(--border); font-size: 11px; color: var(--muted); text-align: center; }

  /* ---------- Modal ---------- */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(20,22,28,.45); display: flex; align-items: center; justify-content: center; z-index: 50;
  }
  .modal {
    width: 440px; max-width: calc(100vw - 40px); background: #fff; border-radius: 10px; box-shadow: 0 20px 48px rgba(0,0,0,.28);
    padding: 20px 22px;
  }
  .modal h2 { font-size: 15.5px; margin: 0 0 4px; }
  /* declared after the base .modal rule so its width/height win the cascade */
  .modal-wide {
    width: 90vw; max-width: 90vw; height: 88vh; max-height: 88vh;
    display: flex; flex-direction: column;
  }
  .modal .cap { font-size: 12px; color: var(--muted); margin-bottom: 16px; }
  .modal .field { margin-bottom: 14px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 6px; }
  .source-option {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--border-strong);
    border-radius: 6px; margin-bottom: 6px; cursor: pointer; font-size: 12.5px;
  }
  .source-option.selected { border-color: var(--accent); background: var(--accent-bg); }
  .source-option .name { flex: 1; font-weight: 600; }
  .source-option .del { color: var(--danger); background: none; border: none; cursor: pointer; font-size: 14px; }

  .automate-steps { display: flex; flex-direction: column; gap: 12px; margin: 6px 0 20px; }
  .automate-step { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
  .automate-step.active, .automate-step.done { color: var(--text); font-weight: 600; }
  .automate-step-icon {
    width: 20px; height: 20px; flex-shrink: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 11px; border: 1px solid var(--border-strong); color: var(--muted);
  }
  .automate-step.active .automate-step-icon {
    border-color: var(--accent); animation: automate-pulse 1s ease-in-out infinite;
  }
  .automate-step.done .automate-step-icon { border-color: #1a7f4b; background: #1a7f4b; color: #fff; }
  @keyframes automate-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }

  .select-field { margin-bottom: 10px; }
  .not-supported-note {
    margin: 8px 8px 0; padding: 10px 10px; font-size: 11.5px; line-height: 1.5; color: #7a5200;
    background: #fff6e5; border: 1px solid #f0dca6; border-radius: 6px;
  }

  /* ---------- Form Type Editor (visual field placement) ---------- */
  .editor-body { flex: 1; display: flex; min-height: 0; gap: 16px; }
  .editor-canvas-pane { flex: 1.4; min-width: 0; display: flex; flex-direction: column; }
  .editor-page-tabs { display: flex; gap: 6px; margin-bottom: 8px; flex-shrink: 0; }
  .editor-page-tabs button {
    padding: 5px 12px; font-size: 12px; font-weight: 600; border-radius: 6px; border: 1px solid var(--border-strong);
    background: #fff; color: var(--muted); cursor: pointer;
  }
  .editor-page-tabs button.active { border-color: var(--accent); background: var(--accent-bg); color: var(--accent); }
  .editor-canvas-wrap {
    flex: 1; position: relative; overflow: auto; background: #e9eaec; border: 1px solid var(--border); border-radius: 6px;
  }
  .editor-canvas-wrap canvas { display: block; background: #fff; }
  .editor-box {
    position: absolute; border: 1.5px solid rgba(52,84,209,.55); background: rgba(52,84,209,.08);
    cursor: move; box-sizing: content-box;
  }
  .editor-box:hover { border-color: var(--accent); background: rgba(52,84,209,.16); }
  .editor-box.selected { border-color: var(--accent); background: rgba(52,84,209,.22); box-shadow: 0 0 0 1px var(--accent); }
  .editor-box-label {
    position: absolute; top: -16px; left: -1px; font-size: 9px; font-weight: 700; color: var(--accent);
    background: #fff; padding: 0 3px; border-radius: 3px; white-space: nowrap; pointer-events: none;
    max-width: 160px; overflow: hidden; text-overflow: ellipsis;
  }
  .editor-box-resize {
    position: absolute; right: -4px; top: 0; bottom: 0; width: 8px; cursor: ew-resize;
  }
  .editor-box-resize-v {
    position: absolute; left: 0; right: 0; bottom: -4px; height: 8px; cursor: ns-resize;
  }
  .editor-props-pane { width: 320px; flex-shrink: 0; display: flex; flex-direction: column; min-height: 0; }
  .editor-field-list { max-height: 220px; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 12px; flex-shrink: 0; }
  .editor-field-list-group-label {
    font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted);
    padding: 6px 10px 4px; background: #fbfbfc;
  }
  .editor-field-list-item {
    padding: 6px 10px; font-size: 12px; cursor: pointer; border-bottom: 1px solid #f1f2f4;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .editor-field-list-item:hover { background: #f5f6f8; }
  .editor-field-list-item.selected { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
  .editor-field-list-item-overlay { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .editor-field-list-empty { padding: 8px 10px; font-size: 11.5px; color: var(--muted); }
  .editor-overlay-remove { flex-shrink: 0; color: var(--danger); background: none; border: none; cursor: pointer; font-size: 15px; line-height: 1; padding: 0; }
  .editor-overlay-preview { max-width: 100%; max-height: 100px; border: 1px solid var(--border); border-radius: 4px; display: block; }
  .editor-props-card {
    border: 1px solid var(--border); border-radius: 6px; padding: 12px; flex: 1; overflow-y: auto;
  }
  .editor-props-card h3 { font-size: 12px; margin: 0 0 10px; }
  .editor-props-empty { color: var(--muted); font-size: 12px; padding: 8px 2px; }
  .editor-prop-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .editor-prop-row.full { grid-template-columns: 1fr; }
  .editor-prop-toggles { display: flex; gap: 14px; margin-bottom: 10px; }
  .editor-check { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text); cursor: pointer; text-transform: none; }
  .editor-props-divider { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
</style>
</head>
<body x-data="pdfgenApp()">

  <header class="topbar">
    <div>
      <span class="brand">PDF-gen</span>
      <span class="sub">POC (json) &middot; UH-60R &middot; Logbook &middot; form types fetched from form-types.json</span>
    </div>
    <div style="display:flex; align-items:center; gap:10px;">
      <button class="btn btn-sm" x-show="current" @click="openSaveDefaultModal()">Save as default</button>
      <button class="btn btn-sm" x-show="activeInstance" @click="toggleComplete()">
        <span x-text="activeInstance?.complete ? 'Mark incomplete' : 'Mark complete'"></span>
      </button>
      <button class="btn btn-sm" x-show="current" @click="exportAll()" :disabled="generating">
        <span x-text="generating ? 'Generating…' : 'Export All'"></span>
      </button>
      <span style="font-size:11px;color:#1a7f4b;background:#e7f7ee;padding:4px 10px;border-radius:10px;">Saved to this browser</span>
    </div>
  </header>

  <div class="app-body">

    <!-- ============ LEFT SIDEBAR ============ -->
    <aside class="sidebar" :class="{ collapsed: !sidebarOpen }">

      <template x-if="!sidebarOpen">
        <div class="sidebar-collapsed-strip">
          <button class="sidebar-toggle" title="Expand sidebar" @click="sidebarOpen = true">&raquo;</button>
        </div>
      </template>

      <template x-if="sidebarOpen">
        <div style="display:flex; flex-direction:column; min-height:0; flex:1;">
          <div class="sidebar-header-row">
            <div class="sidebar-label">Selection</div>
            <button class="sidebar-toggle" title="Collapse sidebar" @click="sidebarOpen = false">&laquo;</button>
          </div>

          <template x-if="!formTypesLoaded && !formTypesError">
            <div class="not-supported-note" style="margin:8px 8px 0;">
              Loading form types from <code>form-types.json</code>&hellip;
            </div>
          </template>
          <template x-if="formTypesError">
            <div class="not-supported-note" style="margin:8px 8px 0; color:var(--danger);">
              Could not load <code>form-types.json</code> — this page must be served over
              http(s), not opened as a <code>file://</code> URL (fetch of a local file is
              blocked). Try e.g. <code>python -m http.server</code> from this folder.
            </div>
          </template>

          <div class="sidebar-section" style="padding-top:6px;">
            <div class="select-field">
              <label>Aircraft model</label>
              <select x-model="selectedModel">
                <template x-for="m in AIRCRAFT_MODELS" :key="m">
                  <option :value="m" x-text="m"></option>
                </template>
              </select>
            </div>
            <div class="select-field" style="margin-bottom:0;">
              <label>Document type</label>
              <select x-model="selectedDocType">
                <template x-for="t in DOCUMENT_TYPES" :key="t">
                  <option :value="t" x-text="t"></option>
                </template>
              </select>
            </div>
          </div>

          <template x-if="!isSupported">
            <div class="not-supported-note">
              This POC only implements <strong>UH-60R &middot; Logbook</strong>.
              Pick that combination to create or view logbooks — the other options are here
              for testing the selector only.
            </div>
          </template>

          <template x-if="isSupported">
            <div style="display:flex; flex-direction:column; min-height:0; flex:1;">
              <div class="sidebar-section" style="padding-top:14px;">
                <div class="sidebar-label">Logbooks (<span x-text="logbooks.length"></span>)</div>
              </div>
              <div class="sidebar-list" style="flex:0 1 auto; max-height:220px;">
                <template x-if="logbooks.length === 0">
                  <div class="sidebar-empty">No logbooks yet.</div>
                </template>
                <template x-for="lb in sortedLogbooks()" :key="lb.id">
                  <div class="sidebar-item" :class="{ active: lb.id === currentId }" @click="openLogbook(lb.id)">
                    <div style="flex:1;min-width:0;">
                      <div class="tail" x-text="lb.tailNumber"></div>
                      <div class="meta" x-text="formatDate(lb.updatedAt)"></div>
                    </div>
                    <span class="status-pill" :class="isLogbookComplete(lb) ? 'status-complete' : 'status-incomplete'"
                          style="margin-left:0;"
                          x-text="isLogbookComplete(lb) ? 'Complete' : 'Incomplete'"></span>
                    <button class="del" title="Delete logbook" @click.stop="deleteLogbook(lb.id)">&times;</button>
                  </div>
                </template>
              </div>
              <div class="sidebar-footer">
                <button class="btn btn-primary" :disabled="!formTypesLoaded" @click="openNewModal()">+ New logbook</button>
              </div>

              <template x-if="current">
                <div style="display:flex; flex-direction:column; min-height:0; flex:1; border-top:1px solid var(--border);">
                  <div class="sidebar-section" style="padding-top:12px;">
                    <div class="sidebar-label">Forms in this document</div>
                  </div>
                  <div class="sidebar-list">
                    <template x-for="ft in FORM_TYPES" :key="ft.type">
                      <div class="form-type-group">
                        <div class="form-type-header">
                          <button class="form-type-collapse" @click.stop="toggleFormTypeCollapsed(ft.type)"
                                  :title="isFormTypeCollapsed(ft.type) ? 'Expand instances' : 'Collapse instances'">
                            <span x-text="isFormTypeCollapsed(ft.type) ? '▸' : '▾'"></span>
                          </button>
                          <span x-text="ft.label"></span>
                          <span class="form-type-count" x-text="'(' + instancesOf(ft.type).length + ')'"></span>
                          <span class="form-type-actions">
                            <button class="form-type-gear" title="Form Type Editor — field placement & styling" @click.stop="openEditorModal(ft.type)">
                              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                            </button>
                            <button class="form-type-add" :title="'New ' + ft.type" @click="addFormInstance(ft.type)">+</button>
                          </span>
                        </div>
                        <template x-if="!isFormTypeCollapsed(ft.type)">
                          <template x-for="(inst, i) in instancesOf(ft.type)" :key="inst.id">
                            <div class="sidebar-item form-instance-item"
                                 :class="{ active: activeFormType === ft.type && activeInstanceId === inst.id }"
                                 @click="renamingInstanceId !== inst.id && openFormInstance(ft.type, inst.id)">
                              <template x-if="renamingInstanceId === inst.id">
                                <input type="text" class="instance-rename-input" x-ref="renameInput" x-model="renameDraft"
                                       @click.stop
                                       @keydown.enter="commitRename(inst)"
                                       @keydown.escape="cancelRename()"
                                       @blur="commitRename(inst)">
                              </template>
                              <template x-if="renamingInstanceId !== inst.id">
                                <div style="flex:1;min-width:0;" x-text="instanceLabel(ft, inst, i)"></div>
                              </template>
                              <span x-show="inst.complete" title="Marked complete" style="color:#1a7f4b;font-size:12px;">&#10003;</span>
                              <button class="instance-rename-btn" title="Rename" x-show="renamingInstanceId !== inst.id"
                                      @click.stop="startRenameInstance(ft, inst, i)">&#9998;</button>
                              <button class="del" title="Delete this form instance" @click.stop="deleteFormInstance(ft.type, inst.id)">&times;</button>
                            </div>
                          </template>
                        </template>
                      </div>
                    </template>
                  </div>
                </div>
              </template>
            </div>
          </template>
        </div>
      </template>
    </aside>

    <!-- ============ CENTER ============ -->
    <main class="center">

      <template x-if="!current">
        <div class="placeholder">
          Select a logbook from the sidebar, or create a new one to get started.
        </div>
      </template>

      <template x-if="current && activeSchema && activeInstance">
        <div>
          <div class="toolbar">
            <div class="titles">
              <h1 x-text="'Logbook — ' + current.tailNumber"></h1>
              <span class="status-pill" :class="activeInstance.complete ? 'status-complete' : 'status-incomplete'"
                    x-text="activeInstance.complete ? 'Complete' : 'Incomplete'"></span>
              <div class="cap" x-text="activeSchema.label + ' — ' + (activeInstance.name && activeInstance.name.trim() ? activeInstance.name : 'Instance ' + activeInstanceIndex())"></div>
            </div>
            <div class="actions">
              <button class="btn btn-sm" title="Undo (Ctrl+Z)" :disabled="!canUndo()" @click="undo()">↶ Undo</button>
              <button class="btn btn-sm" title="Redo (Ctrl+Shift+Z)" :disabled="!canRedo()" @click="redo()">↷ Redo</button>
              <button class="btn" :disabled="activeInstance.complete" @click="openAutomateModal()">Auto-fill from source</button>
              <button class="btn btn-primary" @click="showPrintPreview()" :disabled="generating">
                <span x-text="generating ? 'Generating…' : 'Print Preview'"></span>
              </button>
            </div>
          </div>

          <div class="banner-note" x-show="activeSchema.bannerNote" x-text="activeSchema.bannerNote"></div>
          <div class="validation-summary" x-show="activeInstanceErrorCount() > 0"
               x-text="activeInstanceErrorCount() + ' field' + (activeInstanceErrorCount() === 1 ? '' : 's') + ' need attention before this form can be marked complete.'"></div>

          <!-- ===== Generic, schema-driven form renderer ===== -->
          <div class="card">
            <template x-for="section in activeSchema.sections" :key="section.title">
              <div>

                <!-- a labeled field group (header-level data) -->
                <template x-if="section.kind === 'fields'">
                  <div>
                    <div class="section-title" x-text="section.title"></div>
                    <div class="field-grid" :style="'grid-template-columns: repeat(' + (section.columns || 3) + ', 1fr)'">
                      <template x-for="field in section.fields" :key="field.key">
                        <div>
                          <label>
                            <span x-text="field.label"></span>
                            <span class="req-star" x-show="field.validation && field.validation.required">*</span>
                          </label>
                          <template x-if="field.textarea">
                            <textarea :value="activeInstance.header[field.key]" @focus="snapshotBeforeChange()"
                                      :readonly="activeInstance.complete"
                                      :maxlength="(field.validation && field.validation.maxLength) || null"
                                      :class="{ 'input-invalid': headerFieldErrors(field.key).length }"
                                      :title="headerFieldErrors(field.key).join('; ')"
                                      @input="activeInstance.header[field.key] = $event.target.value"></textarea>
                          </template>
                          <template x-if="!field.textarea">
                            <input type="text" :value="activeInstance.header[field.key]" @focus="snapshotBeforeChange()"
                                   :readonly="activeInstance.complete"
                                   :maxlength="(field.validation && field.validation.maxLength) || null"
                                   :class="{ 'input-invalid': headerFieldErrors(field.key).length }"
                                   :title="headerFieldErrors(field.key).join('; ')"
                                   @input="activeInstance.header[field.key] = $event.target.value">
                          </template>
                        </div>
                      </template>
                    </div>
                  </div>
                </template>

                <!-- a repeating row table (e.g. sample rows, inspection items).
                     activeInstance[section.rowsKey] falls back to [] here and
                     below — switching form types changes activeFormType and
                     activeInstanceId in two separate reactive writes, so
                     Alpine can briefly re-evaluate an outgoing schema's
                     section against the new instance before the DOM settles;
                     harmless once every schema shared one "rows" key, but
                     a form type with its own rowsKey (verifRows, remarksRows)
                     needs the guard. -->
                <template x-if="section.kind === 'table'">
                  <div>
                    <div class="section-title" x-text="section.title + ' (' + (activeInstance[section.rowsKey] || []).length + ')'"></div>
                    <div class="table-wrap">
                      <table class="rows">
                        <thead>
                          <tr>
                            <th style="width:18px" x-show="!section.fixedRows"></th>
                            <th style="width:26px"></th>
                            <template x-for="col in section.columns" :key="col.key">
                              <th>
                                <span x-text="col.label"></span>
                                <span class="req-star" x-show="col.validation && col.validation.required">*</span>
                              </th>
                            </template>
                            <th style="width:44px" x-show="!section.fixedRows"></th>
                          </tr>
                        </thead>
                        <tbody>
                          <template x-for="(row, idx) in (activeInstance[section.rowsKey] || [])" :key="row.id">
                            <tr :class="{ dragging: dragIndex === idx }"
                                @dragover.prevent @drop="dropRow(section, idx)">
                              <td class="drag-handle" x-show="!section.fixedRows" :draggable="!activeInstance.complete"
                                  @dragstart="dragStart(idx)" @dragend="dragIndex = null" title="Drag to reorder">&#8942;&#8942;</td>
                              <td class="row-num" x-text="idx + 1"></td>
                              <template x-for="col in section.columns" :key="col.key">
                                <td>
                                  <input type="text" :value="row[col.key]"
                                         :maxlength="(col.validation && col.validation.maxLength) || null"
                                         :readonly="activeInstance.complete"
                                         :class="{ 'input-invalid': rowFieldErrors(section, row, col.key).length }"
                                         :title="rowFieldErrors(section, row, col.key).join('; ')"
                                         @focus="snapshotBeforeChange()" @input="row[col.key] = $event.target.value">
                                </td>
                              </template>
                              <td class="row-actions" x-show="!section.fixedRows">
                                <button title="Duplicate row" :disabled="activeInstance.complete" @click="duplicateRow(section, idx)">
                                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="13" height="13" rx="1.5"/><path d="M4 16V5a1 1 0 0 1 1-1h11"/></svg>
                                </button>
                                <button class="danger" title="Remove row" :disabled="activeInstance.complete" @click="removeRow(section, idx)">
                                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
                                </button>
                              </td>
                            </tr>
                          </template>
                        </tbody>
                      </table>
                    </div>
                    <div class="table-actions" x-show="!section.fixedRows">
                      <button class="btn btn-sm" :disabled="activeInstance.complete" @click="addRow(section)">+ Add row</button>
                    </div>
                  </div>
                </template>

              </div>
            </template>
          </div>
          <!-- ===== /generic renderer ===== -->

          <!-- ===== Signature & attachments — per-instance content for any -->
          <!-- overlay the Form Type Editor marked "Fill per document" ===== -->
          <template x-if="placeholderOverlays().length">
            <div class="card" style="margin-top:16px;">
              <div class="section-title">Signature &amp; attachments</div>
              <div class="field-grid" style="grid-template-columns: 1fr;">
                <template x-for="ov in placeholderOverlays()" :key="ov.id">
                  <div>
                    <label x-text="ov.label || (ov.kind === 'image' ? 'Image' : 'Text')"></label>

                    <template x-if="ov.kind === 'image'">
                      <div>
                        <img :src="overlayValue(ov.id).imageB64" class="editor-overlay-preview"
                             style="margin-bottom:8px;" x-show="overlayValue(ov.id).imageB64">
                        <div style="display:flex; gap:8px; align-items:center;">
                          <label class="btn btn-sm" :for="'overlayUpload_' + ov.id" :class="{ 'btn-label-disabled': activeInstance.complete }">
                            <span x-text="overlayValue(ov.id).imageB64 ? 'Replace image' : 'Upload image'"></span>
                          </label>
                          <input type="file" accept="image/png,image/jpeg" :id="'overlayUpload_' + ov.id"
                                 :disabled="activeInstance.complete" style="display:none;"
                                 @change="setInstanceOverlayImage(ov.id, $event.target.files[0]); $event.target.value = ''">
                          <button class="btn btn-sm" :disabled="activeInstance.complete" x-show="overlayValue(ov.id).imageB64"
                                  @click="removeInstanceOverlayImage(ov.id)">Remove</button>
                        </div>
                      </div>
                    </template>

                    <template x-if="ov.kind === 'text'">
                      <textarea :value="overlayValue(ov.id).text" :readonly="activeInstance.complete"
                                @focus="snapshotBeforeChange()"
                                @input="setInstanceOverlayText(ov.id, $event.target.value)"></textarea>
                    </template>
                  </div>
                </template>
              </div>
            </div>
          </template>

        </div>
      </template>

    </main>

    <!-- ============ RIGHT PREVIEW PANEL ============ -->
    <div class="preview-resizer" x-show="current && previewPanelOpen"
         :class="{ resizing: resizingPreview }" @mousedown="startPreviewResize($event)"
         title="Drag to resize"></div>
    <aside class="preview" x-show="current && previewPanelOpen" :style="'width:' + previewWidth + 'px'">
      <div class="preview-toolbar">
        <span class="label">PDF preview</span>
        <div style="display:flex; gap:6px;">
          <button class="btn btn-sm" @click="regeneratePreview()" :disabled="generating">Refresh</button>
          <button class="btn btn-sm" @click="openPreviewPdf()" :disabled="!previewGenerated"
                  title="Open the rendered PDF in a new tab">Open PDF</button>
          <button class="btn btn-sm btn-primary" @click="printPreview()" :disabled="!previewGenerated">Print</button>
          <button class="sidebar-toggle" title="Close preview" @click="previewPanelOpen = false">&times;</button>
        </div>
      </div>
      <div class="preview-frame-wrap">
        <div class="preview-pages" x-ref="previewPages" x-show="previewGenerated"></div>
        <template x-if="!previewGenerated">
          <div class="preview-empty">
            <span x-text="generating ? 'Generating preview…' : 'Click \'Print Preview\' to render this logbook.'"></span>
          </div>
        </template>
      </div>
      <div class="preview-footer">Preview reflects unsaved changes as of the last refresh</div>
    </aside>

  </div>

  <!-- ============ NEW LOGBOOK MODAL ============ -->
  <template x-if="showNewModal">
    <div class="modal-backdrop" @click.self="showNewModal = false">
      <div class="modal">
        <h2>New logbook</h2>
        <div class="cap">UH-60R &middot; Logbook</div>

        <div class="field">
          <label>Aircraft tail number</label>
          <input type="text" x-model="newTailNumber" placeholder="e.g. 16-04578" x-ref="tailInput">
        </div>

        <div class="field">
          <label>Start from</label>
          <div class="source-option" :class="{ selected: newSource === 'blank' }" @click="newSource = 'blank'">
            <input type="radio" :checked="newSource === 'blank'" @click.stop="newSource = 'blank'">
            <span class="name">Blank logbook</span>
          </div>
          <template x-for="d in defaults" :key="d.id">
            <div class="source-option" :class="{ selected: newSource === d.id }" @click="newSource = d.id">
              <input type="radio" :checked="newSource === d.id" @click.stop="newSource = d.id">
              <span class="name" x-text="d.name"></span>
              <span style="font-size:10.5px;color:var(--muted);" x-text="defaultSummary(d)"></span>
              <button class="del" title="Delete this default" @click.stop="deleteDefault(d.id)">&times;</button>
            </div>
          </template>
          <div class="cap" x-show="defaults.length === 0" style="margin:6px 0 0;">
            No saved defaults yet — open a logbook and use "Save as default" to create one.
          </div>
        </div>

        <div class="modal-actions">
          <button class="btn" @click="showNewModal = false">Cancel</button>
          <button class="btn btn-primary" @click="confirmCreateLogbook()" :disabled="!newTailNumber.trim()">Create</button>
        </div>
      </div>
    </div>
  </template>

  <!-- ============ SAVE AS DEFAULT MODAL ============ -->
  <template x-if="showSaveDefaultModal">
    <div class="modal-backdrop" @click.self="showSaveDefaultModal = false">
      <div class="modal">
        <h2>Save as default</h2>
        <div class="cap">
          Stores this logbook's forms as a reusable starting point for new logbooks.
          This logbook stays independent — editing it later won't change the saved default.
        </div>
        <div class="field">
          <label>Default name</label>
          <input type="text" x-model="newDefaultName" placeholder="e.g. Standard UH-60R logbook" x-ref="defaultNameInput">
        </div>
        <div class="modal-actions">
          <button class="btn" @click="showSaveDefaultModal = false">Cancel</button>
          <button class="btn btn-primary" @click="confirmSaveDefault()" :disabled="!newDefaultName.trim()">Save</button>
        </div>
      </div>
    </div>
  </template>

  <!-- ============ FORM TYPE EDITOR MODAL ============ -->
  <template x-if="showEditorModal">
    <div class="modal-backdrop" @click.self="showEditorModal = false">
      <div class="modal modal-wide">
        <h2 x-text="'Form Type Editor — ' + (editorSchema ? editorSchema.label : '')"></h2>
        <div class="cap">
          Drag a field to reposition it, drag its right edge to resize. Header fields move freely;
          a table column's box represents that column's first row — dragging it up/down adjusts the
          whole column grid's starting row for this page (see "Row grid" below once a column is selected).
        </div>

        <div class="editor-body">
          <div class="editor-canvas-pane">
            <div class="editor-page-tabs">
              <button :class="{ active: editorPageIndex === 0 }" @click="switchEditorPage(0)">Front page</button>
              <button :class="{ active: editorPageIndex === 1 }" @click="switchEditorPage(1)">Back page</button>
              <span style="flex:1;"></span>
              <button class="btn btn-sm" @click="$refs.overlayImageInput.click()">+ Add image</button>
              <input type="file" accept="image/png,image/jpeg" x-ref="overlayImageInput" style="display:none;"
                     @change="addImageOverlay($event.target.files[0]); $event.target.value = ''">
              <button class="btn btn-sm" @click="addTextOverlay()">+ Add text box</button>
            </div>
            <div class="editor-canvas-wrap" x-ref="editorCanvasWrap">
              <canvas x-ref="editorCanvas"></canvas>
              <template x-for="box in editorBoxesForCurrentPage()" :key="box.kind + ':' + box.key">
                <div class="editor-box" :class="{ selected: editorSelectedKind === box.kind && editorSelectedKey === box.key }"
                     :style="editorBoxStyle(box)"
                     @mousedown="selectEditorField(box.kind, box.key); startBoxDrag($event, box)">
                  <span class="editor-box-label" x-text="box.label"></span>
                  <div class="editor-box-resize" @mousedown.stop="selectEditorField(box.kind, box.key); startBoxResize($event, box)"></div>
                  <div class="editor-box-resize-v" x-show="box.kind === 'overlay' && box.overlayKind === 'image'"
                       @mousedown.stop="selectEditorField(box.kind, box.key); startBoxResizeHeight($event, box)"></div>
                </div>
              </template>
            </div>
          </div>

          <div class="editor-props-pane">
            <div class="editor-field-list">
              <div class="editor-field-list-group-label">Header fields</div>
              <template x-for="f in editorFieldList.filter(f => f.kind === 'header')" :key="f.key">
                <div class="editor-field-list-item" :class="{ selected: editorSelectedKind === 'header' && editorSelectedKey === f.key }"
                     @click="selectEditorField('header', f.key)" x-text="f.label"></div>
              </template>
              <div class="editor-field-list-group-label">Table columns</div>
              <template x-for="f in editorFieldList.filter(f => f.kind === 'col')" :key="f.key">
                <div class="editor-field-list-item" :class="{ selected: editorSelectedKind === 'col' && editorSelectedKey === f.key }"
                     @click="selectEditorField('col', f.key)" x-text="f.label"></div>
              </template>
              <div class="editor-field-list-group-label">Overlays (images &amp; text boxes)</div>
              <template x-if="editorDraft && editorDraft.overlays.length === 0">
                <div class="editor-field-list-empty">None yet — use "+ Add image" or "+ Add text box" above.</div>
              </template>
              <template x-for="ov in (editorDraft ? editorDraft.overlays : [])" :key="ov.id">
                <div class="editor-field-list-item editor-field-list-item-overlay"
                     :class="{ selected: editorSelectedKind === 'overlay' && editorSelectedKey === ov.id }"
                     @click="selectEditorField('overlay', ov.id)">
                  <span x-text="(ov.kind === 'image' ? '🖼 ' : '𝑇 ') + (ov.label || (ov.kind === 'image' ? 'Image' : 'Text box'))"></span>
                  <button class="editor-overlay-remove" title="Remove this overlay" @click.stop="removeOverlay(ov.id)">&times;</button>
                </div>
              </template>
            </div>

            <div class="editor-props-card">
              <template x-if="!editorSelectedSpec()">
                <div class="editor-props-empty">Select a field on the canvas or in the list to edit its position and styling.</div>
              </template>
              <template x-if="editorSelectedSpec()">
                <div>
                  <h3 x-text="editorSelectedLabel()"></h3>

                  <template x-if="editorSelectedKind === 'overlay'">
                    <div class="editor-prop-row">
                      <div class="full">
                        <label>Label</label>
                        <input type="text" :value="editorSelectedSpec().label"
                               @input="editorSelectedSpec().label = $event.target.value">
                      </div>
                    </div>
                  </template>

                  <div class="editor-prop-row">
                    <div>
                      <label>X (pt)</label>
                      <input type="number" step="0.5" :value="editorSelectedSpec().x"
                             @input="editorSelectedSpec().x = Number($event.target.value)">
                    </div>
                    <div x-show="editorSelectedKind === 'header' || editorSelectedKind === 'overlay'">
                      <label>Y (pt)</label>
                      <input type="number" step="0.5" :value="editorSelectedSpec().y"
                             @input="editorSelectedSpec().y = Number($event.target.value)">
                    </div>
                  </div>

                  <div class="editor-prop-row">
                    <div>
                      <label>Width (pt)</label>
                      <input type="number" step="1" min="8" :value="editorSelectedSpec().width"
                             @input="editorSelectedSpec().width = Number($event.target.value)">
                    </div>
                    <div x-show="!(editorSelectedKind === 'overlay' && editorSelectedSpec().kind === 'image')">
                      <label>Font size</label>
                      <input type="number" step="0.5" min="5" max="24" :value="editorSelectedSpec().fontSize"
                             @input="editorSelectedSpec().fontSize = Number($event.target.value)">
                    </div>
                    <div x-show="editorSelectedKind === 'overlay' && editorSelectedSpec().kind === 'image'">
                      <label>Height (pt)</label>
                      <input type="number" step="1" min="8" :value="editorSelectedSpec().height"
                             @input="editorSelectedSpec().height = Number($event.target.value)">
                    </div>
                  </div>

                  <template x-if="!(editorSelectedKind === 'overlay' && editorSelectedSpec().kind === 'image')">
                    <div>
                      <div class="editor-prop-row">
                        <div class="full">
                          <label>Font</label>
                          <select :value="editorSelectedSpec().fontFamily || 'Helvetica'"
                                  @change="editorSelectedSpec().fontFamily = $event.target.value">
                            <option value="Helvetica">Helvetica</option>
                            <option value="TimesRoman">Times</option>
                            <option value="Courier">Courier</option>
                          </select>
                        </div>
                      </div>

                      <div class="editor-prop-toggles">
                        <label class="editor-check"><input type="checkbox" :checked="editorSelectedSpec().bold"
                          @change="editorSelectedSpec().bold = $event.target.checked"> Bold</label>
                        <label class="editor-check"><input type="checkbox" :checked="editorSelectedSpec().italic"
                          @change="editorSelectedSpec().italic = $event.target.checked"> Italic</label>
                        <label class="editor-check"><input type="checkbox" :checked="editorSelectedSpec().allowOverflow"
                          @change="editorSelectedSpec().allowOverflow = $event.target.checked"> Allow overflow</label>
                      </div>
                    </div>
                  </template>

                  <template x-if="editorSelectedKind === 'overlay'">
                    <div>
                      <hr class="editor-props-divider">
                      <label class="editor-check" style="margin-bottom:10px;">
                        <input type="checkbox" :checked="editorSelectedSpec().mode === 'placeholder'"
                               @change="setOverlayPlaceholder(editorSelectedSpec(), $event.target.checked)">
                        Fill per document (leave this blank here; each form instance supplies its own)
                      </label>

                      <template x-if="editorSelectedSpec().mode === 'placeholder'">
                        <div class="cap" style="margin:0;">
                          This box reserves space only — its
                          <span x-text="editorSelectedSpec().kind === 'image' ? 'image' : 'text'"></span>
                          is entered per document, in the "Signature &amp; attachments" section of that
                          form instance.
                        </div>
                      </template>

                      <template x-if="editorSelectedSpec().mode === 'fixed' && editorSelectedSpec().kind === 'text'">
                        <div class="field" style="margin:0;">
                          <label>Text content (same on every instance)</label>
                          <textarea :value="editorSelectedSpec().text"
                                    @input="editorSelectedSpec().text = $event.target.value"></textarea>
                        </div>
                      </template>

                      <template x-if="editorSelectedSpec().mode === 'fixed' && editorSelectedSpec().kind === 'image'">
                        <div>
                          <img :src="editorSelectedSpec().imageB64" class="editor-overlay-preview"
                               x-show="editorSelectedSpec().imageB64">
                          <button class="btn btn-sm" style="margin-top:8px;" @click="$refs.overlayReplaceInput.click()">
                            <span x-text="editorSelectedSpec().imageB64 ? 'Replace image' : 'Upload image'"></span>
                          </button>
                          <input type="file" accept="image/png,image/jpeg" x-ref="overlayReplaceInput" style="display:none;"
                                 @change="replaceOverlayImage(editorSelectedSpec(), $event.target.files[0]); $event.target.value = ''">
                        </div>
                      </template>
                    </div>
                  </template>

                  <template x-if="editorSelectedKind === 'col'">
                    <div>
                      <hr class="editor-props-divider">
                      <label class="editor-check" style="margin-bottom:10px;">
                        <input type="checkbox" :checked="editorSelectedSpec().independentY"
                               @change="toggleIndependentY(editorSelectedSpec(), $event.target.checked)">
                        Move independently of this table's row grid
                      </label>
                      <template x-if="editorSelectedSpec().independentY">
                        <div class="field" style="margin:0 0 12px;">
                          <label>Y offset from the row (pt)</label>
                          <input type="number" step="0.5" :value="editorSelectedSpec().yOffset || 0"
                                 @input="editorSelectedSpec().yOffset = Number($event.target.value)">
                          <div class="cap" style="margin:4px 0 0;">
                            Drag this box vertically on the canvas, or set the offset here — e.g. a
                            negative value prints it on a line below the row's other columns (like DA
                            2408-17's 12 check-number columns sitting under Item No./Nomenclature).
                          </div>
                        </div>
                      </template>
                      <h3 x-text="'Row grid — ' + (editorPageIndex === 0 ? 'front page' : 'back page')"></h3>
                      <div class="editor-prop-row">
                        <div>
                          <label>Start Y (pt)</label>
                          <input type="number" step="0.5" :value="editorCurrentGrid().startY"
                                 @input="editorCurrentGrid().startY = Number($event.target.value)">
                        </div>
                        <div>
                          <label>Row spacing (pt)</label>
                          <input type="number" step="0.1" min="4" :value="editorCurrentGrid().spacing"
                                 @input="editorCurrentGrid().spacing = Number($event.target.value)">
                        </div>
                      </div>
                      <div class="cap" style="margin:0;" x-text="editorCurrentGrid().rows + ' rows on this page (fixed by the physical form layout)'"></div>
                    </div>
                  </template>
                </div>
              </template>
            </div>
          </div>
        </div>

        <div class="modal-actions">
          <button class="btn" @click="resetEditorAll()">Reset all to defaults</button>
          <button class="btn" @click="showEditorModal = false">Cancel</button>
          <button class="btn btn-primary" @click="confirmSaveEditor()">Save</button>
        </div>
      </div>
    </div>
  </template>

  <!-- ============ AUTOMATE FORM ENTRY MODAL ============ -->
  <template x-if="showAutomateModal">
    <div class="modal-backdrop" @click.self="automateDone && closeAutomateModal()">
      <div class="modal">
        <h2>Automate form entry</h2>
        <div class="cap">
          POC scope: this simulates pulling data for
          <strong x-text="activeSchema && activeSchema.label"></strong> from an external system —
          no real request is made, but the four stages a real integration would go through are
          shown below before the form is auto-populated.
        </div>

        <div class="automate-steps">
          <template x-for="step in automateSteps" :key="step.key">
            <div class="automate-step" :class="{ active: step.status === 'active', done: step.status === 'done' }">
              <span class="automate-step-icon">
                <span x-show="step.status === 'done'">&#10003;</span>
                <span x-show="step.status === 'pending'">&#9675;</span>
              </span>
              <span x-text="step.label"></span>
            </div>
          </template>
        </div>

        <div class="modal-actions">
          <button class="btn btn-primary" @click="closeAutomateModal()" :disabled="!automateDone">
            <span x-text="automateDone ? 'Done' : 'Working…'"></span>
          </button>
        </div>
      </div>
    </div>
  </template>

  <!-- ============ MARK-COMPLETE VALIDATION MODAL ============ -->
  <template x-if="showValidationModal">
    <div class="modal-backdrop" @click.self="showValidationModal = false">
      <div class="modal">
        <h2>Cannot mark complete</h2>
        <div class="cap">
          <span x-text="validationProblems.length"></span> field<span x-show="validationProblems.length !== 1">s</span>
          need attention before this form can be marked complete.
        </div>

        <div class="validation-modal-list">
          <template x-for="(p, i) in validationProblems" :key="i">
            <div class="validation-modal-row">
              <span class="validation-modal-badge" :class="p.kind === 'pending' ? 'badge-pending' : 'badge-invalid'"
                    x-text="p.kind === 'pending' ? 'Pending' : 'Incorrect'"></span>
              <div class="validation-modal-text">
                <span class="validation-modal-field" x-text="p.location + ' — ' + p.label"></span>
                <span class="validation-modal-msg" x-text="p.message"></span>
              </div>
            </div>
          </template>
        </div>

        <div class="modal-actions">
          <button class="btn btn-primary" @click="showValidationModal = false">Close</button>
        </div>
      </div>
    </div>
  </template>

<script>
// ---------------------------------------------------------------------------
// Form-type registry. Unlike pdfgen-vanilla-multi/-image (which hardcode
// each form type as a schema object exported by its own js/form-XXXX.js),
// here the registry starts empty and is populated by fetching
// FORM_TYPES_URL — simulating a database-backed form-type registry (see
// PDF-gen/CLAUDE.md's "form_types" table sketch) instead of shipping the
// form definitions as JS. A schema fetched this way is pure JSON — no
// functions — so the model factories (empty/clone/newRow) and fill-engine
// entry points that pdfgen-vanilla-image attached directly to each schema
// object are generic top-level functions here instead, parameterized by
// whichever schema they're given. index.html renders whatever's in
// FORM_TYPES, generically, via the "fields"/"table" section renderers and
// the Form Type Editor below — adding a form type means adding an entry to
// form-types.json, not touching any markup or JS.
// ---------------------------------------------------------------------------
const FORM_TYPES_URL = "form-types.json";
let FORM_TYPES = []; // populated in place (push, never reassigned) by loadFormTypes()

const STORAGE_KEY = "pdfgen-vanilla-json-logbooks";
const DEFAULTS_KEY = "pdfgen-vanilla-json-defaults";
const LAYOUTS_KEY = "pdfgen-vanilla-json-fieldlayouts";

function formTypeKey(type) {
  return "forms" + type.replace("-", "_"); // '2408-20' -> 'forms2408_20'
}

function uid() {
  return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
}

// ---------------------------------------------------------------------------
// Generic model factories, driven entirely by a schema's own `sections` —
// replace the per-form-type empty()/clone()/newRow() functions that
// pdfgen-vanilla-image attached to each schema object. A fetched JSON
// schema has no functions on it at all, so these read `sections` instead:
// one header key per "fields" section field, one row-column key per
// "table" section column. A schema can carry more than one "table" section
// (e.g. DA 2408-17's growable Equipment Checklist alongside its fixed-count
// Verification and Remarks tables) — each gets its own `rowsKey` array on
// the instance, so nothing here assumes exactly one.
// ---------------------------------------------------------------------------
function headerKeysOf(schema) {
  const keys = [];
  for (const s of schema.sections) if (s.kind === "fields") for (const f of s.fields) keys.push(f.key);
  return keys;
}

function tableSectionsOf(schema) {
  return schema.sections.filter(s => s.kind === "table");
}

// A table section's `fixedRows` (if set) marks it as a fixed physical row
// count that never grows/shrinks (e.g. a 6-slot verification log) — as
// opposed to the default growable table (starts with 1 row, add/remove/
// reorder freely, overflows onto extra physical copies when it outgrows
// its page capacity).
function emptyRowFor(table) {
  const row = { id: uid() };
  for (const col of table.columns) row[col.key] = "";
  return row;
}

// ---------------------------------------------------------------------------
// Field/form validation. Rules (required, type, min/maxLength) travel with
// the schema itself — fetched from form-types.json alongside `sections`,
// per-field via a `validation` object — the same "simulated database"
// registry that already carries sections/defaultLayout/sampleData/
// templateB64 (see "Form-type registry as data" in PDF-gen/CLAUDE.md). A
// real Postgres-backed `form_types` table would carry this the same way
// (a `field_map`-adjacent jsonb column), not as a separate mechanism.
// ---------------------------------------------------------------------------
function isEmptyValue(v) {
  return v === undefined || v === null || String(v).trim() === "";
}

// Lenient on purpose: this project's real sample data mixes army-style
// dates ("15 MAR 26"), ISO ("2026-03-05"), and slash dates — a strict
// Date.parse() would flag legitimate values as invalid.
const DATE_LIKE = /^\d{1,2}\s*[A-Za-z]{3,9}\s*\d{2,4}$/;
const DATE_ISO = /^\d{4}-\d{2}-\d{2}$/;
const DATE_SLASH = /^\d{1,2}\/\d{1,2}\/\d{2,4}$/;

function looksLikeDate(str) {
  return DATE_LIKE.test(str) || DATE_ISO.test(str) || DATE_SLASH.test(str);
}

// Validates one value against its field/column's `validation` spec.
// Returns an array of human-readable problem strings (empty = valid).
function validateFieldValue(value, validation) {
  if (!validation) return [];
  const empty = isEmptyValue(value);
  if (validation.required && empty) return ["Required"];
  if (empty) return []; // optional and empty — nothing further to check

  const str = String(value);
  const errors = [];
  if (validation.type === "number" && isNaN(Number(str))) errors.push("Must be a number");
  if (validation.type === "date" && !looksLikeDate(str)) errors.push("Must be a valid date");
  if (validation.minLength && str.length < validation.minLength) errors.push(`Must be at least ${validation.minLength} characters`);
  if (validation.maxLength && str.length > validation.maxLength) errors.push(`Must be at most ${validation.maxLength} characters`);
  return errors;
}

// Looks up a schema's header field / table column definition (which
// carries the `validation` spec) by key.
function headerFieldSpec(schema, key) {
  for (const s of schema.sections) if (s.kind === "fields") {
    const f = s.fields.find(f => f.key === key);
    if (f) return f;
  }
  return null;
}

function columnSpec(section, key) {
  return (section.columns || []).find(c => c.key === key) || null;
}

// Full-instance validation, used by "Mark complete" — every header field
// and every row's columns, against the active schema's validation specs.
// Returns a flat list of "Label: problem" strings (empty = the instance is
// clean enough to mark complete).
// Returns one entry per failed check: { location, label, message, kind }.
// kind is "pending" for a required-but-empty field, "invalid" for anything
// that has a value but fails a format/length check — the distinction the
// "Mark complete" review dialog uses to separate "still needs data" from
// "has a wrong value".
function validateInstance(schema, instance) {
  const problems = [];
  const collect = (location, label, errors) => {
    for (const message of errors) problems.push({ location, label, message, kind: message === "Required" ? "pending" : "invalid" });
  };
  for (const key of headerKeysOf(schema)) {
    const spec = headerFieldSpec(schema, key);
    collect("Header", (spec && spec.label) || key, validateFieldValue(instance.header[key], spec && spec.validation));
  }
  const tables = tableSectionsOf(schema);
  // Only disambiguate the location with the table's own title when a
  // schema has more than one table section — keeps every existing
  // single-table form's "Row N" wording exactly as it was.
  for (const table of tables) {
    const prefix = tables.length > 1 ? (table.title || table.rowsKey) + " — " : "";
    instance[table.rowsKey].forEach((row, idx) => {
      for (const col of table.columns) {
        collect(`${prefix}Row ${idx + 1}`, col.label || col.key, validateFieldValue(row[col.key], col.validation));
      }
    });
  }
  return problems;
}

function emptyInstance(schema) {
  const header = {};
  for (const key of headerKeysOf(schema)) header[key] = "";
  const instance = { id: uid(), header, complete: false, overlayData: {}, name: "" };
  for (const table of tableSectionsOf(schema)) {
    const count = table.fixedRows || 1;
    instance[table.rowsKey] = Array.from({ length: count }, () => emptyRowFor(table));
  }
  return instance;
}

// A clone always starts incomplete, with no carried-over overlay data
// (signature images, placeholder text), even if the source instance (e.g.
// a saved Default) had either set — both track this specific instance's
// own review/signing, not whatever state the source happened to be in.
// `name` is the one thing that DOES carry over — it's an organizational
// label (e.g. "Left engine" vs "Right engine"), not review/signing state,
// so a document created from a Default keeps the same instance names.
// Row arrays are found by duck-typing (any own array-valued property) —
// header/overlayData are always plain objects, so this needs no schema
// and generalizes automatically to however many table sections a schema
// declares.
function cloneInstance(instance) {
  const out = { id: uid(), header: { ...instance.header }, complete: false, overlayData: {}, name: instance.name || "" };
  for (const key of Object.keys(instance)) {
    if (Array.isArray(instance[key])) out[key] = instance[key].map(r => ({ ...r, id: uid() }));
  }
  return out;
}

// A logbook document bundles every form type belonging to it (per the
// "Document = collection of Forms" model), each as an *array* of instances —
// a logbook can contain more than one of a given form type. Fully generic
// over FORM_TYPES, so a new form type needs no changes here.
function emptyLogbookForms() {
  const forms = {};
  for (const ft of FORM_TYPES) forms[formTypeKey(ft.type)] = [emptyInstance(ft)];
  return forms;
}

function cloneLogbookForms(forms) {
  const out = {};
  for (const ft of FORM_TYPES) out[formTypeKey(ft.type)] = forms[formTypeKey(ft.type)].map(cloneInstance);
  return out;
}

function emptyLogbook(tailNumber, forms) {
  const now = new Date().toISOString();
  const f = forms || emptyLogbookForms();
  const lb = {
    id: uid(), tailNumber, aircraftModel: "UH-60R", documentType: "Logbook",
    createdAt: now, updatedAt: now,
  };
  for (const ft of FORM_TYPES) lb[formTypeKey(ft.type)] = f[formTypeKey(ft.type)];
  return lb;
}

// Merges a form type's default field layout with any saved per-field
// overrides (Form Type Editor). Overrides are shallow per-field (a saved
// header/col entry replaces only the properties it sets... in practice the
// editor always writes a full spec object per field, but merging keeps a
// partial hand-edited localStorage entry from crashing the fill engine).
function getLayout(schema, savedLayouts) {
  const saved = (savedLayouts && savedLayouts[schema.type]) || {};
  const base = schema.defaultLayout;
  const header = {};
  for (const key of Object.keys(base.header)) header[key] = { ...base.header[key], ...((saved.header && saved.header[key]) || {}) };
  const cols = {};
  for (const key of Object.keys(base.cols)) cols[key] = { ...base.cols[key], ...((saved.cols && saved.cols[key]) || {}) };
  const page1 = { ...base.page1, ...(saved.page1 || {}) };
  const page2 = { ...base.page2, ...(saved.page2 || {}) };
  // Overlays (user-added images/text boxes, see the Form Type Editor's
  // "+ Add image"/"+ Add text box") are whole user-authored objects, not
  // per-key style overrides like header/cols above — a save fully replaces
  // the overlay list rather than merging field-by-field, so removing an
  // overlay in the editor actually removes it instead of it reappearing
  // from defaultLayout.
  const overlays = saved.overlays !== undefined ? saved.overlays : (base.overlays || []);
  // Fixed-count "extra" tables (e.g. DA 2408-17's Verification log and
  // Remarks list — see "Multi-table support" in PDF-gen/CLAUDE.md) live on
  // one page with a single startY/spacing grid (no page1/page2 split, since
  // they never overflow). Per-column positions merge the same way as the
  // primary table's `cols`; startY/spacing/page merge at the table level so
  // an untouched extra table still renders exactly as its default.
  const extraTables = (base.extraTables || []).map(baseTable => {
    const savedTable = (saved.extraTables || []).find(t => t.rowsKey === baseTable.rowsKey) || {};
    const tableCols = {};
    for (const key of Object.keys(baseTable.cols)) {
      tableCols[key] = { ...baseTable.cols[key], ...((savedTable.cols && savedTable.cols[key]) || {}) };
    }
    return { ...baseTable, ...savedTable, cols: tableCols };
  });
  return { header, cols, page1, page2, repeatingHeaderExclude: base.repeatingHeaderExclude || [], overlays, extraTables };
}

// ---------------------------------------------------------------------------
// Preview rendering. Mobile browsers (Chrome/Safari on Android/iOS in
// particular) do not render PDFs inline inside an <iframe> — they show a
// generic "open externally" card instead, which also breaks
// iframe.contentWindow.print(). Rendering each page to a <canvas> with
// pdf.js works identically on every platform, and printing is done by
// turning those canvases into images in a dedicated print window instead of
// relying on any browser's native PDF viewer.
// ---------------------------------------------------------------------------
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

// kept outside Alpine's reactive state — it's a large binary blob, not UI
// state, so there's no reason to pay for deep-proxying it on every change.
let lastPreviewBytes = null;

function openBytesInNewWindow(bytes) {
  const blob = new Blob([bytes], { type: "application/pdf" });
  const url = URL.createObjectURL(blob);
  const win = window.open(url, "_blank");
  if (!win) {
    alert("Your browser blocked the new window — please allow pop-ups for this page and try again.");
    URL.revokeObjectURL(url);
    return;
  }
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

async function renderPreviewPages(container, bytes) {
  container.innerHTML = "";
  const loadingTask = pdfjsLib.getDocument({ data: bytes.slice() });
  const pdf = await loadingTask.promise;
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const viewport = page.getViewport({ scale: 1.4 });
    const canvas = document.createElement("canvas");
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    container.appendChild(canvas);
    await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
  }
}

function printRenderedPages(container) {
  const canvases = container.querySelectorAll("canvas");
  if (!canvases.length) return;
  const win = window.open("", "_blank");
  if (!win) {
    alert("Your browser blocked the print window — please allow pop-ups for this page and try again.");
    return;
  }
  const imagesHtml = Array.from(canvases)
    .map(c => `<img src="${c.toDataURL("image/png")}">`)
    .join("");
  win.document.open();
  win.document.write(`<!doctype html><html><head><title>Print preview</title><style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    img { display: block; width: 100%; page-break-after: always; }
    @media print { @page { margin: 0; } }
  </style></head><body>${imagesHtml}</body></html>`);
  win.document.close();
  setTimeout(() => { win.focus(); win.print(); }, 150);
}

function pdfgenApp() {
  return {
    logbooks: [],
    defaults: [],
    fieldLayouts: {},
    currentId: null,
    generating: false,
    previewGenerated: false,

    // Undo/redo history, in-memory only (not persisted) — keyed by logbook
    // id so switching logbooks doesn't mix histories. Each entry is a full
    // deep-cloned snapshot of that logbook's state just before a change.
    undoStacks: {},
    redoStacks: {},

    sidebarOpen: true,
    previewPanelOpen: false,
    previewWidth: 380,
    resizingPreview: false,
    FORM_TYPES,                // same array reference module-level loadFormTypes() pushes into
    formTypesLoaded: false,
    formTypesError: false,
    activeFormType: null,      // set once form-types.json resolves, e.g. '2408-18'
    activeInstanceId: null,    // id of the specific instance being edited
    dragIndex: null,

    // Per-form-type collapse state for the "Forms in this document"
    // sidebar list — in-memory only (like undo/redo), keyed by form type.
    collapsedFormTypes: {},

    // Inline rename of a form instance's sidebar label — only one row can
    // be in edit mode at a time, so a single id/draft pair (rather than
    // per-row state) is enough.
    renamingInstanceId: null,
    renameDraft: "",

    // Fake examples for testing the selectors — only UH-60R / Logbook is
    // actually implemented in this POC (see isSupported below).
    AIRCRAFT_MODELS: ["UH-60R", "UH-60M", "MH-60R", "MH-60M", "AH-64D", "AH-64E"],
    DOCUMENT_TYPES: ["Logbook", "SN Book", "Maintenance Record", "Historical Record"],
    selectedModel: "UH-60R",
    selectedDocType: "Logbook",

    showNewModal: false,
    newTailNumber: "",
    newSource: "blank",

    showSaveDefaultModal: false,
    newDefaultName: "",

    showAutomateModal: false,
    automateSteps: [],
    automateDone: false,

    showValidationModal: false,
    validationProblems: [],

    // ---- Form Type Editor state ----
    showEditorModal: false,
    editorFormType: null,
    editorPageIndex: 0,
    editorLabels: { header: {}, col: {} },
    editorDraft: null,          // deep clone of the layout being edited, per "getLayout" shape
    editorSelectedKind: null,   // 'header' | 'col'
    editorSelectedKey: null,
    editorScale: 1,
    editorDrag: null,           // { mode: 'move'|'resize', kind, key, startX, startY, origX, origY, origWidth }

    get current() {
      return this.logbooks.find(l => l.id === this.currentId) || null;
    },

    get isSupported() {
      return this.selectedModel === "UH-60R" && this.selectedDocType === "Logbook";
    },

    get activeSchema() {
      return FORM_TYPES.find(f => f.type === this.activeFormType) || null;
    },

    get editorSchema() {
      return FORM_TYPES.find(f => f.type === this.editorFormType) || null;
    },

    get editorFieldList() {
      const list = [];
      for (const key of Object.keys(this.editorLabels.header)) list.push({ kind: "header", key, label: this.editorLabels.header[key] });
      for (const key of Object.keys(this.editorLabels.col)) list.push({ kind: "col", key, label: this.editorLabels.col[key] });
      return list;
    },

    // the currently-open logbook's instances of a given form type
    instancesOf(type) {
      return this.current ? this.current[formTypeKey(type)] : [];
    },

    toggleFormTypeCollapsed(type) {
      this.collapsedFormTypes[type] = !this.collapsedFormTypes[type];
    },

    isFormTypeCollapsed(type) {
      return !!this.collapsedFormTypes[type];
    },

    // A custom name wins if set; otherwise falls back to the original
    // auto-generated "<type> — Instance N" label, unchanged from before
    // renaming existed.
    instanceLabel(ft, inst, idx) {
      const name = inst.name && inst.name.trim();
      return name || (ft.type + " — Instance " + (idx + 1));
    },

    startRenameInstance(ft, inst, idx) {
      this.renamingInstanceId = inst.id;
      this.renameDraft = (inst.name && inst.name.trim()) || this.instanceLabel(ft, inst, idx);
      this.$nextTick(() => this.$refs.renameInput && this.$refs.renameInput.select());
    },

    commitRename(inst) {
      if (this.renamingInstanceId !== inst.id) return; // already committed/cancelled (blur firing after Enter)
      inst.name = this.renameDraft.trim();
      this.renamingInstanceId = null;
      if (this.current) this.current.updatedAt = new Date().toISOString();
    },

    cancelRename() {
      this.renamingInstanceId = null;
    },

    get activeInstance() {
      if (!this.current) return null;
      const list = this.current[formTypeKey(this.activeFormType)];
      return list.find(i => i.id === this.activeInstanceId) || null;
    },

    activeInstanceIndex() {
      if (!this.current) return "";
      const list = this.current[formTypeKey(this.activeFormType)];
      const idx = list.findIndex(i => i.id === this.activeInstanceId);
      return idx === -1 ? "" : idx + 1;
    },

    // ---- field/form validation (see validateFieldValue/validateInstance) ----
