        // selectEditorField. Every type's defaultLayout just becomes
        // whatever was last saved now — no separate position-only override
        // layer (fieldLayouts) needed for any type anymore. A built-in
        // type's PRE-EXISTING fieldLayouts entry (from before structural
        // editing existed) was already merged into editorDraft when this
        // editor opened (getLayout() below), so nothing from it is lost —
        // it's just "baked in" here instead of staying a separate override.
        schema.defaultLayout = this.cloneLayout(this.editorDraft);
        delete this.fieldLayouts[this.editorFormType];
      }
      if (this.activeFormType === this.editorFormType) this.clearPreview();
      logAction("EDITOR", "Saved form type layout", this.editorFormType);
      this.closeEditorModal();
    },

    // Closes the Form Type Editor and clears its selection — used by
    // Cancel, the backdrop click, and confirmSaveEditor alike, so no path
    // out of this modal can leave editorSelectedKind/Key pointing at a key
    // that belongs to whichever form type was just being edited. Without
    // this, reopening the editor for a *different* type has a brief window
    // where Alpine's reactive re-render can evaluate the properties panel's
    // bindings against the outgoing selection before openEditorModal's own
    // reset takes effect — the actual cause of a real "Cannot read
    // properties of null" crash seen here, on top of which every read in
    // that panel also got a defensive `?.` (see the properties panel
    // template) since a transient null render is cheap to tolerate either way.
    closeEditorModal() {
      this.showEditorModal = false;
      this.editorSelectedKind = null;
      this.editorSelectedKey = null;
    },

    // ================= Admin: aircraft models =================

    openAdminModelsModal() {
      this.newModelName = "";
      this.showAdminModelsModal = true;
    },

    addAircraftModel() {
      const name = this.newModelName.trim();
      if (!name || this.aircraftModels.includes(name)) return;
      this.aircraftModels.push(name);
      this.newModelName = "";
      logAction("ADMIN", "Added aircraft model", name);
    },

    // Inline rename (not a native prompt() dialog — Electron-based
    // renderers, including VS Code's own webviews, stub window.prompt() to
    // always return null, which silently no-ops a prompt()-based rename;
    // alert()/confirm() are patched to real dialogs there but prompt() isn't
    // — same inline-input pattern this file already uses for instance
    // rename, just at the aircraft-model-list level).
    startRenameAircraftModel(name) {
      this.renamingModelName = name;
      this.renameModelDraft = name;
      this.$nextTick(() => this.$refs.renameModelInput && this.$refs.renameModelInput.select());
    },

    cancelRenameAircraftModel() {
      this.renamingModelName = null;
    },

    commitRenameAircraftModel() {
      const oldName = this.renamingModelName;
      if (oldName === null) return;
      const name = this.renameModelDraft.trim();
      this.renamingModelName = null;
      if (!name || name === oldName) return;
      if (this.aircraftModels.includes(name)) { alert("That model already exists."); return; }
      const idx = this.aircraftModels.indexOf(oldName);
      if (idx === -1) return;
      this.aircraftModels[idx] = name;
      // Cascade the rename everywhere the old name was referenced, rather
      // than leaving those references pointing at a name that no longer
      // exists in `aircraftModels`.
      for (const dt of this.documentTypes) {
        const i = dt.models.indexOf(oldName);
        if (i !== -1) dt.models[i] = name;
      }
      for (const lb of this.logbooks) if (lb.aircraftModel === oldName) lb.aircraftModel = name;
      for (const d of this.defaults) if (d.aircraftModel === oldName) d.aircraftModel = name;
      if (this.selectedModel === oldName) this.selectedModel = name;
      logAction("ADMIN", "Renamed aircraft model", oldName + " -> " + name);
    },

    canDeleteAircraftModel(name) {
      const usedByDocType = this.documentTypes.some(dt => dt.models.includes(name));
      const usedByDocument = this.logbooks.some(l => l.aircraftModel === name) || this.defaults.some(d => d.aircraftModel === name);
      return !usedByDocType && !usedByDocument;
    },

    deleteAircraftModel(name) {
      if (!this.canDeleteAircraftModel(name)) {
        alert('Can\'t delete "' + name + '" — it\'s still referenced by a document type or an existing document/default.');
        return;
      }
      if (!confirm('Delete aircraft model "' + name + '"?')) return;
      this.aircraftModels = this.aircraftModels.filter(m => m !== name);
      if (this.selectedModel === name) this.selectedModel = this.aircraftModels[0] || "";
      logAction("ADMIN", "Deleted aircraft model", name);
    },

    // ================= Admin: document types =================

    openAdminDocTypesModal() {
      this.newDocTypeName = "";
      this.showAdminDocTypesModal = true;
    },

    addDocumentType() {
      const name = this.newDocTypeName.trim();
      if (!name) return;
      const id = uniqueId(slugify(name), this.documentTypes.map(d => d.id));
      this.documentTypes.push({ id, name, models: [] });
      this.documentTypeForms[id] = [];
      this.newDocTypeName = "";
      logAction("ADMIN", "Added document type", name);
    },

    // Inline rename, same reasoning as startRenameAircraftModel above.
    startRenameDocumentType(dt) {
      this.renamingDocTypeId = dt.id;
      this.renameDocTypeDraft = dt.name;
      this.$nextTick(() => this.$refs.renameDocTypeInput && this.$refs.renameDocTypeInput.select());
    },

    cancelRenameDocumentType() {
      this.renamingDocTypeId = null;
    },

    commitRenameDocumentType(dt) {
      if (this.renamingDocTypeId !== dt.id) return;
      const oldName = dt.name;
      const name = this.renameDocTypeDraft.trim();
      this.renamingDocTypeId = null;
      if (name) dt.name = name;
      if (name && name !== oldName) logAction("ADMIN", "Renamed document type", oldName + " -> " + name);
    },

    toggleDocTypeModel(dt, model) {
      const i = dt.models.indexOf(model);
      if (i === -1) dt.models.push(model); else dt.models.splice(i, 1);
      logAction("ADMIN", "Toggled model for document type", dt.name + ": " + model + (i === -1 ? " added" : " removed"));
    },

    canDeleteDocumentType(dt) {
      return !this.logbooks.some(l => l.documentTypeId === dt.id) && !this.defaults.some(d => d.documentTypeId === dt.id);
    },

    deleteDocumentType(dt) {
      if (!this.canDeleteDocumentType(dt)) {
        alert('Can\'t delete "' + dt.name + '" — documents (or saved defaults) of this type already exist.');
        return;
      }
      if (!confirm('Delete document type "' + dt.name + '"? This cannot be undone.')) return;
      this.documentTypes = this.documentTypes.filter(d => d.id !== dt.id);
      delete this.documentTypeForms[dt.id];
      if (this.selectedDocType === dt.id) this.selectedDocType = this.documentTypes[0] ? this.documentTypes[0].id : null;
      logAction("ADMIN", "Deleted document type", dt.name);
    },

    // ================= Admin: assign & sort form types =================
    // Which form types a document type contains, and in what order — the
    // sidebar's "Forms in this document", Export All's grouping, and the
    // merge order all read this back via formTypesFor() (see above).

    openAssignModal(dt) {
      this.adminAssignDocTypeId = dt.id;
      this.assignDraft = (this.documentTypeForms[dt.id] || []).slice();
      this.showAdminAssignModal = true;
    },

    get assignDocType() {
      return this.documentTypes.find(d => d.id === this.adminAssignDocTypeId) || null;
    },

    toggleAssigned(type) {
      const i = this.assignDraft.indexOf(type);
      if (i === -1) this.assignDraft.push(type); else this.assignDraft.splice(i, 1);
    },

    assignDragStart(idx) {
      this.assignDragIndex = idx;
    },

    assignDrop(targetIdx) {
      if (this.assignDragIndex === null || this.assignDragIndex === targetIdx) { this.assignDragIndex = null; return; }
      const [moved] = this.assignDraft.splice(this.assignDragIndex, 1);
      this.assignDraft.splice(targetIdx, 0, moved);
      this.assignDragIndex = null;
    },

    saveAssignModal() {
      if (!this.adminAssignDocTypeId) return;
      this.documentTypeForms[this.adminAssignDocTypeId] = this.assignDraft.slice();
      this.showAdminAssignModal = false;
      logAction("ADMIN", "Saved form-type assignment", this.assignDocType ? this.assignDocType.name : this.adminAssignDocTypeId);
    },

    // ================= Admin: form types =================

    openAdminFormTypesModal() {
      this.showAdminFormTypesModal = true;
    },

    // ---- Upload PDF: AcroForm + vector-PDF structure extraction ----
    // See "Upload PDF workflow" in CLAUDE.md for the full design. Three
    // input shapes, one workflow: classify by what's actually in the file
    // (real fields vs. a real text layer vs. neither), extract whichever
    // way applies, then land in the Form Type Editor either way — with
    // real pre-placed boxes for the first two, or just the real page as a
    // visual reference for the third.
    async handleUploadFormTypePdf(file) {
      if (!file) return;
      logAction("ADMIN", "Upload PDF (new type) started", file.name || "");
      this.uploadingFormType = true;
      try {
        const buf = await file.arrayBuffer();
        const bytes = new Uint8Array(buf);

        let result;
        try {
          result = await classifyAndExtractPdf(bytes);
        } catch (e) {
          console.error(e);
          alert("Could not read this file as a PDF — see console for details.");
          return;
        }
        const { kind, headerCandidates, tableCandidates, finalBytes } = result;

        const label = (file.name || "New form type").replace(/\.pdf$/i, "").trim() || "New form type";
        const type = uniqueId(slugify(label), this.FORM_TYPES.map(f => f.type));

        const sections = headerCandidates.length
          ? [{ kind: "fields", title: "Extracted fields", columns: 2, fields: headerCandidates.map(c => ({ key: c.key, label: c.label, textarea: false, validation: {} })) }]
          : [];
        const header = {};
        for (const c of headerCandidates) {
          header[c.key] = { page: c.page, x: c.x, y: c.y, width: c.width, fontSize: c.fontSize, allowOverflow: false };
        }
        const tableLayout = tableCandidatesToLayout(tableCandidates);
        sections.push(...tableLayout.sections);

        this.FORM_TYPES.push({
          type, label, bannerNote: "",
          sections,
          defaultLayout: {
            header, cols: {},
            page1: { rows: 0, startY: 0, spacing: 0 },
            page2: { rows: 0, startY: 0, spacing: 0 },
            repeatingHeaderExclude: [], overlays: [], extraTables: tableLayout.extraTables,
          },
          templateB64: bytesToB64(finalBytes),
          custom: true,
        });

        this.announceExtraction(kind, headerCandidates.length, tableCandidates.length);
        this.showAdminFormTypesModal = false;
        this.openEditorModal(type);
      } catch (e) {
        console.error(e);
        alert("Could not process this PDF — see console for details.");
      } finally {
        this.uploadingFormType = false;
      }
    },

    // Attaches or replaces a PDF template on an *existing* custom form
    // type — same classify/extract pipeline as creating a brand-new type
    // (handleUploadFormTypePdf), but additive here: any newly-extracted
    // fields are merged into the type's existing structure (added to an
    // "Extracted fields" section, reusing one already there from an
    // earlier upload rather than creating a confusing duplicate) instead
    // of replacing whatever the admin already built by hand or from a
    // prior upload — nothing existing gets removed or repositioned.
    async handleUploadPdfForExistingType(ft, file) {
      if (!file || !ft || !ft.custom) return;
      logAction("ADMIN", "Upload PDF (existing type) started", ft.type + ": " + (file.name || ""));
      this.uploadingFormType = true;
      try {
        const buf = await file.arrayBuffer();
        const bytes = new Uint8Array(buf);

        let result;
        try {
          result = await classifyAndExtractPdf(bytes);
        } catch (e) {
          console.error(e);
          alert("Could not read this file as a PDF — see console for details.");
          return;
        }
        const { kind, headerCandidates, tableCandidates, finalBytes } = result;

        ft.templateB64 = bytesToB64(finalBytes);

        if (headerCandidates.length) {
          let section = ft.sections.find(s => s.kind === "fields" && s.title === "Extracted fields");
          if (!section) {
            section = { kind: "fields", title: "Extracted fields", columns: 2, fields: [] };
            ft.sections.push(section);
          }
          const usedKeys = ft.sections.filter(s => s.kind === "fields").flatMap(s => s.fields.map(f => f.key));
          for (const c of headerCandidates) {
            const key = uniqueId(c.key, usedKeys);
            usedKeys.push(key);
            section.fields.push({ key, label: c.label, textarea: false, validation: {} });
            ft.defaultLayout.header[key] = { page: c.page, x: c.x, y: c.y, width: c.width, fontSize: c.fontSize, allowOverflow: false };
          }
        }

        // Detected tables are appended as brand-new table sections/extraTables
        // entries — additive, same treatment as header fields above. Existing
        // rowsKeys/titles are passed in so a second upload can't collide with
        // a table an earlier upload already added (tableCandidatesToLayout
        // renumbers on collision — see its own comment for why a title
        // collision specifically is dangerous, not just cosmetic).
        if (tableCandidates.length) {
          const existingRowsKeys = ft.sections.filter(s => s.kind === "table").map(s => s.rowsKey);
          const existingTitles = ft.sections.filter(s => s.kind === "table").map(s => s.title);
          const tableLayout = tableCandidatesToLayout(tableCandidates, existingRowsKeys, existingTitles);
          ft.sections.push(...tableLayout.sections);
          if (!ft.defaultLayout.extraTables) ft.defaultLayout.extraTables = [];
          ft.defaultLayout.extraTables.push(...tableLayout.extraTables);
        }

        // defaultLayout was just updated directly above — drop any stale
        // saved override so getLayout() doesn't merge on top of it with now
        // out-of-date assumptions (same reasoning as confirmSaveEditor/
        // confirmFormTypeBuilder's own custom-type saves).
        delete this.fieldLayouts[ft.type];

        this.announceExtraction(kind, headerCandidates.length, tableCandidates.length);
        this.showAdminFormTypesModal = false;
        this.openEditorModal(ft.type);
      } catch (e) {
        console.error(e);
        alert("Could not process this PDF — see console for details.");
      } finally {
        this.uploadingFormType = false;
      }
    },

    announceExtraction(kind, fieldCount, tableCount) {
      const fieldPlural = fieldCount === 1 ? "" : "s";
      const tableNote = tableCount ? " Also detected " + tableCount + " table" + (tableCount === 1 ? "" : "s") + " — review its row count and columns below." : "";
      const messages = {
        acroform: fieldCount + " field" + fieldPlural + " extracted from the PDF's AcroForm." + tableNote,
        vector: fieldCount + " field candidate" + fieldPlural + " guessed from the page layout — review and adjust them below." + tableNote,
        image: "No extractable text found (looks like a scanned/image PDF) — the page is shown for reference; add fields manually with \"+ Add field\".",
      };
      logAction("ADMIN", "PDF extracted", kind + ", " + fieldCount + " fields, " + tableCount + " tables");
      alert(messages[kind]);
    },

    // Only an admin-created ("shape only") form type can be deleted, and
    // only once no document type still includes it — built-in types (real
    // PDF templates this POC ships with) are permanent fixtures here.
    canDeleteFormType(ft) {
      if (!ft.custom) return false;
      return !Object.values(this.documentTypeForms).some(list => list.includes(ft.type));
    },

    deleteFormType(ft) {
      if (!ft.custom) {
        alert("Built-in form types can't be deleted in this POC.");
        return;
      }
      if (!this.canDeleteFormType(ft)) {
        alert('Unassign "' + ft.label + '" from every document type first (see "Form types…" on each document type).');
        return;
      }
      if (!confirm('Delete form type "' + ft.label + '"? This cannot be undone.')) return;
      const idx = this.FORM_TYPES.findIndex(f => f.type === ft.type);
      if (idx !== -1) this.FORM_TYPES.splice(idx, 1);
      logAction("ADMIN", "Deleted form type", ft.type + " (" + ft.label + ")");
    },

    // ---- manual schema builder: create a new form type, or edit the full
    // structure (field groups + tables) of ANY existing type, built-in or
    // custom ----
    // Both flows share one modal/draft shape — `builderDraft.editingType`
    // is null when creating, or the existing type's key when editing —
    // and one confirm handler (confirmFormTypeBuilder) branches on that.

    openFormTypeBuilder() {
      // Close the Form Types list modal first — it and this one are both
      // full-screen `.modal-backdrop` overlays; leaving both mounted at
      // once was a pre-existing bug here (reproducible even for this
      // blank scaffold, unrelated to what's being edited) that threw an
      // uncaught Alpine "_x_dataStack" error on open, discovered while
      // testing built-in-type editing. "Upload PDF" (handleUploadFormTypePdf)
      // already closed the list modal before opening its own next modal —
      // this just brings these two entry points in line with that.
      this.showAdminFormTypesModal = false;
      this.builderDraft = {
        editingType: null,
        label: "", bannerNote: "",
        fieldSections: [{ title: "Details", fields: [] }],
        tableSections: [],
      };
      this.showFormTypeBuilder = true;
    },

    // Drives the builder's cap text — whether the type currently being
    // edited (if any) already has a real PDF template, i.e. whether
    // structural edits here can affect an already-rendered form/existing
    // saved documents rather than just a shape-only type nothing depends on
    // yet.
    builderEditingHasTemplate() {
      if (!this.builderDraft || !this.builderDraft.editingType) return false;
      const ft = this.FORM_TYPES.find(f => f.type === this.builderDraft.editingType);
      return !!(ft && this.hasTemplate(ft));
    },

    // Splits an existing type's (built-in or custom) `sections` back into
    // the builder's fieldSections/tableSections draft shape, keeping each
    // field/column's real `key` (and a table section's real `rowsKey`) so
    // confirmFormTypeBuilder can tell "this row already existed" from
    // "this is new" and only regenerate keys for genuinely new rows —
    // which is also what keeps a built-in type's real, PDF-derived
    // positions intact for every field/column that wasn't touched.
    openFormTypeBuilderForEdit(ft) {
      // getLayout() normalizes both the primary table's page1/page2/maxRows
      // and every extra table's shape (old flat {page,startY,spacing,rows}
      // or the current page1/page2 pair) into one consistent shape here, so
      // this reads real front/back/total numbers regardless of which shape
      // this type's saved data happens to be in.
      const layout = getLayout(ft, this.fieldLayouts);
      const fieldSections = [];
      const tableSections = [];
      for (const s of ft.sections) {
        if (s.kind === "fields") {
          fieldSections.push({
            title: s.title || "",
            fields: s.fields.map(f => ({
              key: f.key, label: f.label,
              type: (f.validation && f.validation.type) || "text",
              required: !!(f.validation && f.validation.required),
              textarea: !!f.textarea,
            })),
          });
        } else if (s.kind === "table") {
          const isPrimary = s.rowsKey === "rows";
          const pos = isPrimary
            ? { maxRows: layout.maxRows, page1: layout.page1, page2: layout.page2 }
            : (layout.extraTables.find(t => t.rowsKey === s.rowsKey) || { maxRows: s.fixedRows || 5, page1: { rows: s.fixedRows || 5 }, page2: { rows: 0 } });
          const maxRowsFront = pos.page1.rows || 0;
          const maxRowsBack = pos.page2.rows || 0;
          const maxRowsTotal = pos.maxRows != null ? pos.maxRows : (maxRowsFront + maxRowsBack);
          tableSections.push({
            rowsKey: s.rowsKey, title: s.title || "",
            placement: maxRowsFront > 0 && maxRowsBack > 0 ? "both" : (maxRowsBack > 0 ? "back" : "front"),
            maxRowsFront, maxRowsBack, maxRowsTotal,
            columns: s.columns.map(c => ({
              key: c.key, label: c.label,
              type: (c.validation && c.validation.type) || "text",
              required: !!(c.validation && c.validation.required),
            })),
          });
        }
      }
      // The primary (growable) table is always rowsKey "rows" by this
      // project's convention — sort it first defensively so
      // firstNonEmptyTableIndex() (position-based) agrees with it, even if
      // a schema's own `sections` array happened not to list it first.
      tableSections.sort((a, b) => (a.rowsKey === "rows" ? -1 : 0) - (b.rowsKey === "rows" ? -1 : 0));

      this.showAdminFormTypesModal = false; // see openFormTypeBuilder's comment
      this.builderDraft = {
        editingType: ft.type,
        label: ft.label, bannerNote: ft.bannerNote || "",
        fieldSections, tableSections,
      };
      this.showFormTypeBuilder = true;
    },

    addBuilderFieldSection() {
      this.builderDraft.fieldSections.push({ title: "Details", fields: [] });
    },

    removeBuilderFieldSection(sIdx) {
      this.builderDraft.fieldSections.splice(sIdx, 1);
    },

    addBuilderField(sIdx) {
      this.builderDraft.fieldSections[sIdx].fields.push({ label: "", type: "text", required: false, textarea: false });
    },

    removeBuilderField(sIdx, idx) {
      this.builderDraft.fieldSections[sIdx].fields.splice(idx, 1);
    },

    // A freshly-added table defaults to a 5-row fixed count — it only
    // becomes the primary growable table if it ends up being the *first
    // one with any columns* (see firstNonEmptyTableIndex), matching
    // confirmFormTypeBuilder's own rule at save time.
    addBuilderTableSection() {
      this.builderDraft.tableSections.push({
        title: "Items",
        placement: "front", maxRowsFront: 20, maxRowsBack: 0, maxRowsTotal: 20,
        columns: [],
      });
    },

    // The "Table shows on" select is a friendlier front-end over the same
    // front/back numbers the Form Type Editor's own Row Grid panel exposes
    // (see "Database backend..." in PDF-gen/CLAUDE.md) — switching it just
    // seeds a sensible front/back split from the table's current total;
    // the two number fields stay independently editable afterward for an
    // uneven split (e.g. 12 rows on the front, 8 on the back).
    setBuilderTablePlacement(ts, placement) {
      ts.placement = placement;
      const total = ts.maxRowsTotal || 0;
      if (placement === "front") { ts.maxRowsFront = total; ts.maxRowsBack = 0; }
      else if (placement === "back") { ts.maxRowsFront = 0; ts.maxRowsBack = total; }
      else { ts.maxRowsFront = Math.ceil(total / 2); ts.maxRowsBack = total - ts.maxRowsFront; }
    },

    removeBuilderTableSection(tIdx) {
      this.builderDraft.tableSections.splice(tIdx, 1);
    },

    addBuilderColumn(tIdx) {
      this.builderDraft.tableSections[tIdx].columns.push({ label: "", type: "text", required: false });
    },

    removeBuilderColumn(tIdx, idx) {
      this.builderDraft.tableSections[tIdx].columns.splice(idx, 1);
    },

    // The primary/growable-table rule (used both live in the modal, to
    // label a table "Primary" vs "Fixed rows", and at save time to decide
    // which table gets rowsKey "rows"): the first table section that
    // actually has any columns — an empty table (mid-edit, before its
    // first column is added) doesn't count, so adding a table's first
    // column doesn't unexpectedly bump an already-primary table down to
    // fixed-row.
    firstNonEmptyTableIndex() {
      return this.builderDraft.tableSections.findIndex(ts => ts.columns.length > 0);
    },

    confirmFormTypeBuilder() {
      const d = this.builderDraft;
      const label = d.label.trim();
      if (!label) { alert("Give the form type a label."); return; }

      const nonEmptyFieldSections = d.fieldSections.filter(fs => fs.fields.length > 0);
      const nonEmptyTableSections = d.tableSections.filter(ts => ts.columns.length > 0);
      if (!nonEmptyFieldSections.length && !nonEmptyTableSections.length) {
        alert("Add at least one field, or a table with at least one column.");
        return;
      }

      const isEdit = !!d.editingType;
      const schema = isEdit ? this.FORM_TYPES.find(f => f.type === d.editingType) : null;
      if (isEdit && !schema) { this.showFormTypeBuilder = false; return; }
      const type = isEdit ? schema.type : uniqueId(slugify(label), this.FORM_TYPES.map(f => f.type));
      const priorLayout = isEdit ? schema.defaultLayout : null;

      // Keeps an existing row's real key (so its data/position survive the
      // edit); generates a fresh, deduped one for a genuinely new row.
      // Header keys and column keys are tracked in separate `used` arrays
      // passed in per call — they don't need to be mutually unique (they
      // live in different data trees: instance.header vs instance[rowsKey]),
      // but column keys DO need to stay unique against every OTHER table's
      // columns too (findColBucket's flat, whole-schema key lookup).
      const keyify = (rowLabel, existingKey, used) => {
        if (existingKey) { used.push(existingKey); return existingKey; }
        const key = uniqueId(slugify(rowLabel) || "field", used);
        used.push(key);
        return key;
      };

      const sections = [];
      const header = {};
      const usedHeaderKeys = [];
      for (const fs of nonEmptyFieldSections) {
        const fields = fs.fields.map(f => {
          const key = keyify(f.label, f.key, usedHeaderKeys);
          const validation = {};
          if (f.required) validation.required = true;
          if (f.type !== "text") validation.type = f.type;
          header[key] = (priorLayout && priorLayout.header[key]) || placeholderFieldSpec();
          return { key, label: f.label || key, textarea: !!f.textarea, validation };
        });
        sections.push({ kind: "fields", title: fs.title || "Details", columns: 2, fields });
      }

      // First non-empty table = primary/growable (rowsKey "rows", no
      // fixedRows — matches every built-in type's own primary table); any
      // table after that is a fixed row count, stored in defaultLayout.
      // extraTables (same shape DA 2408-17's Verification/Remarks tables
      // already use — see "Multi-table support" in PDF-gen/CLAUDE.md).
      const usedRowsKeys = [];
      const rowsKeys = nonEmptyTableSections.map((ts, idx) => {
        if (idx === 0) { usedRowsKeys.push("rows"); return "rows"; }
        const key = ts.rowsKey || uniqueId("tableRows", usedRowsKeys);
        usedRowsKeys.push(key);
        return key;
      });

      const cols = {};
      const usedColKeys = [];
      const extraTables = [];
      // The primary table's own page1/page2/maxRows (schema-level, not in
      // extraTables) — set inside the loop below when idx === 0, or left at
      // these no-table-yet defaults if this type has no table sections at all.
      let primaryPage1 = (priorLayout && priorLayout.page1) || { rows: 0, startY: 0, spacing: 0 };
      let primaryPage2 = (priorLayout && priorLayout.page2) || { rows: 0, startY: 0, spacing: 0 };
      let primaryMaxRows = priorLayout && priorLayout.maxRows;
      nonEmptyTableSections.forEach((ts, idx) => {
        const isPrimary = idx === 0;
        const rowsKey = rowsKeys[idx];
        const priorExtraRaw = !isPrimary && priorLayout
          ? (priorLayout.extraTables || []).find(t => t.rowsKey === rowsKey)
          : null;
        const priorExtra = priorExtraRaw ? normalizeExtraTable(priorExtraRaw) : null;
        const priorCols = isPrimary ? (priorLayout && priorLayout.cols) : (priorExtra && priorExtra.cols);
        const extraCols = {};
        const columns = ts.columns.map(c => {
          const key = keyify(c.label, c.key, usedColKeys);
          const validation = {};
          if (c.required) validation.required = true;
          if (c.type !== "text") validation.type = c.type;
          const spec = (priorCols && priorCols[key]) || placeholderColumnSpec();
          if (isPrimary) cols[key] = spec; else extraCols[key] = spec;
          return { key, label: c.label || key, validation };
        });
        // Front/back/total row counts — same 3 properties for every table,
        // primary or not (see "Table shows on front/back/both" + the 3
        // "Max rows" fields in the builder UI just above). Real per-page
        // startY/spacing aren't editable here (that stays the Form Type
        // Editor's job — see its "Row grid" panel) so those carry over
        // from whatever this table already had, independent of the row
        // counts changing here.
        const maxRowsFront = ts.maxRowsFront || 0;
        const maxRowsBack = ts.maxRowsBack || 0;
        const maxRowsTotal = ts.maxRowsTotal != null ? ts.maxRowsTotal : (maxRowsFront + maxRowsBack);
        sections.push({
          kind: "table", title: ts.title || "Items", rowsKey, columns,
          ...(isPrimary ? {} : { fixedRows: maxRowsTotal || 5 }),
        });
        if (isPrimary) {
          primaryMaxRows = maxRowsTotal;
          primaryPage1 = { rows: maxRowsFront, startY: primaryPage1.startY || 700, spacing: primaryPage1.spacing || 20 };
          primaryPage2 = { rows: maxRowsBack, startY: primaryPage2.startY || 700, spacing: primaryPage2.spacing || 20 };
        } else {
          extraTables.push({
            rowsKey,
            maxRows: maxRowsTotal,
            page1: { rows: maxRowsFront, startY: (priorExtra && priorExtra.page1.startY) || 700, spacing: (priorExtra && priorExtra.page1.spacing) || 20 },
            page2: { rows: maxRowsBack, startY: (priorExtra && priorExtra.page2.startY) || 700, spacing: (priorExtra && priorExtra.page2.spacing) || 20 },
            cols: extraCols,
          });
        }
      });

      // `page`/`pageOf` (the running "Page X of Y" stamp — see
      // buildCoordinateCopies) are layout-only header keys: they were never
      // real fields in `sections.fields`, so the field-sections loop above
      // never repopulates them the way it does every other key — a type
      // that had them would otherwise silently lose its page stamp on any
      // edit here. Never triggered before this builder could edit built-in
      // types (the only ones that ever carry these two keys); carried
      // forward untouched, same as page1/page2/overlays/extraTables above,
      // unless the admin's own field list now defines a REAL field using
      // one of these names (then that wins — nothing to restore).
      if (priorLayout) {
        if (priorLayout.header.page && !header.page) header.page = priorLayout.header.page;
        if (priorLayout.header.pageOf && !header.pageOf) header.pageOf = priorLayout.header.pageOf;
      }

      const defaultLayout = {
        header, cols,
        page1: primaryPage1,
        page2: primaryPage2,
        maxRows: primaryMaxRows,
        repeatingHeaderExclude: (priorLayout && priorLayout.repeatingHeaderExclude) || [],
        overlays: (priorLayout && priorLayout.overlays) || [],
        extraTables,
      };
      const bannerNote = d.bannerNote.trim() || "";

      if (isEdit) {
        schema.label = label;
        schema.bannerNote = bannerNote;
        schema.sections = sections;
        schema.defaultLayout = defaultLayout;
        delete this.fieldLayouts[type]; // defaultLayout now fully reflects current state, no override layer needed
        this.formTypeOverrides[type] = { label, bannerNote };
        logAction("EDITOR", "Edited form type structure", type + " (" + label + ")");
      } else {
        this.FORM_TYPES.push({ type, label, bannerNote, sections, defaultLayout, custom: true });
        logAction("EDITOR", "Created form type", type + " (" + label + ")");
      }
      this.showFormTypeBuilder = false;
    },
  };
}

// ---------------------------------------------------------------------------
// Shared coordinate-fill infrastructure. Every form type in this POC is a
// flat, fieldless PDF (see "Two POC tracks" / this folder's own scope in
// PDF-gen/CLAUDE.md), so filling means drawing text at authored (page, x, y)
// positions rather than setting named AcroForm fields — and merging several
// filled copies is correspondingly simpler than pdfgen-vanilla-multi's
// AcroForm path: there are no field names to collide, so copyPages() alone
// is enough.
// ---------------------------------------------------------------------------
function b64ToBytes(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

// Reverse of b64ToBytes — chunked to avoid blowing the call stack on
// String.fromCharCode.apply for a large PDF.
function bytesToB64(bytes) {
  let binary = "";
  const chunkSize = 0x8000;
  for (let i = 0; i < bytes.length; i += chunkSize) {
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
  }
  return btoa(binary);
}

// ---------------------------------------------------------------------------
// "Upload PDF" structure extraction (Form Types admin panel) — turns an
// uploaded PDF into field candidates, two different ways depending on what
// the PDF actually contains, both landing in the same shape: an array of
// { key, label, page, x, y, width, fontSize }, PDF-point coordinates
// (bottom-left origin), directly usable as a defaultLayout.header entry.
// A PDF with neither real AcroForm fields nor a text layer (a scanned/
// photographed page) yields zero candidates — the caller still opens the
// Form Type Editor against the uploaded page so fields can be added by hand
// with a real visual reference, per "Upload PDF workflow" in CLAUDE.md.
// ---------------------------------------------------------------------------

// "InspNo" -> "Insp No", "date_sample_submitted" -> "Date Sample Submitted".
// Good enough as a starting label — the admin can rename in the editor.
function humanizeFieldName(name) {
  const spaced = (name || "")
    .replace(/[_\-]+/g, " ")
    .replace(/([a-z0-9])([A-Z])/g, "$1 $2")
    .replace(/\s+/g, " ")
    .trim();
  if (!spaced) return name || "Field";
  return spaced.replace(/\b\w/g, c => c.toUpperCase());
}

// A widget's own /P entry is the reliable way to find its page, but some
// PDFs omit it — fall back to scanning every page's /Annots array for a ref
// that dereferences to this exact widget dict. pdf-lib caches indirect
// objects by ref (PDFContext#indirectObjects), so repeated lookups of the
// same ref return the identical object instance — safe to compare by `===`.
function findPageIndexForWidget(pages, widget) {
  const pRef = widget.P();
  if (pRef) {
    const idx = pages.findIndex(p => p.ref === pRef);
    if (idx !== -1) return idx;
  }
  for (let i = 0; i < pages.length; i++) {
    const annots = pages[i].node.Annots();
    if (!annots) continue;
    for (let j = 0; j < annots.size(); j++) {
      if (annots.lookup(j) === widget.dict) return i;
    }
  }
  return 0;
}

// Real AcroForm fields — fully mechanical, no guessing: each text field's
// own widget rectangle is its exact position, already in the same PDF-point,
// bottom-left-origin coordinate space this app's coordinate fill engine
// uses. Non-text fields (checkbox/dropdown/radio) are skipped — this app's
// schema model doesn't have a field kind for them yet. Phase 1 also only
// looks at each field's first widget (a field repeated across pages, e.g. a
// running "page X of Y", is a rare enough case to add manually afterward).
//
// Table detection: a repeating row in the original form shows up as several
// fields sharing the same base name with a trailing array index (e.g.
// "Item[0]", "Item[1]", ...) — a real, reliable structural signal, not a
// guess. Fields are grouped by (page, base name); any group of >=2 members
// that all carry an index becomes one detected table COLUMN (its row count,
// startY, and spacing derived from the indexed widgets' real Y positions,
// same refit-to-{startY,spacing} technique already used elsewhere in this
// project for DA 2408-20/18's coordinates). clusterColumnsIntoTables then
// merges columns that share the same page/row-count/grid into one table.
// Every group of exactly 1 (or with missing indices) stays a flat header
// field, unchanged from before.
function extractAcroFormCandidates(pdfDoc, form) {
  const { PDFTextField } = PDFLib;
  const pages = pdfDoc.getPages();
  const fields = [];
  for (const field of form.getFields()) {
    if (!(field instanceof PDFTextField)) continue;
    const widgets = field.acroField.getWidgets();
    if (!widgets.length) continue;
    const widget = widgets[0];
    const rect = widget.getRectangle();
    if (!rect.width || !rect.height) continue; // degenerate/hidden widget
    const pageIndex = findPageIndexForWidget(pages, widget);
    // Strip the LiveCycle-style "[0]" instance suffix every field carries
    // (constant, not a row signal — real repeating rows use a different
    // convention, see below). The remaining name is either bare ("InspNo")
    // — row 0 — or ends in "_N" ("InspNo_1", "InspNo_2", ...) — row N. This
    // is the actual repeating-row convention real Acrobat/LiveCycle forms
    // use (confirmed against this project's own reference PDFs); a field's
    // real *array*-widget repetition (one field, multiple widgets) is a
    // separate, rarer case this extractor doesn't attempt to detect as a
    // table (per the existing "only looks at each field's first widget"
    // scope note below).
    const base = field.getName().split(".").pop().replace(/\[\d+\]$/, "");
    const suffixMatch = /_(\d+)$/.exec(base);
    // A widget's BOX height is not its text size — form cells are routinely
    // far taller than the text meant to go in them (a real uploaded form's
    // row cells measured ~37pt tall here, which an unclamped height*0.7 rule
    // turned into a 26pt font: text overflowing every cell and running off
    // the page). Clamp to a realistic form-fill range instead; the admin can
    // still fine-tune any field in the Form Type Editor.
    const fontSize = Math.min(12, Math.max(6, Math.round(rect.height * 0.6)));
    fields.push({
      rawName: suffixMatch ? base.slice(0, suffixMatch.index) : base,
      index: suffixMatch ? Number(suffixMatch[1]) : 0,
      page: pageIndex, x: rect.x, width: rect.width, fontSize,
      // pdf-lib draws from the text BASELINE, while rect.y is the box's
      // bottom edge — using it raw sits every value directly on the cell's
      // bottom rule. Centre the text in the box instead (clamped, so a very
      // tall cell doesn't float its text absurdly high).
      y: rect.y + Math.max(2, Math.min(8, (rect.height - fontSize) / 2)),
    });
  }

  const groups = new Map();
  for (const f of fields) {
    const groupKey = f.page + "|" + f.rawName;
    if (!groups.has(groupKey)) groups.set(groupKey, []);
    groups.get(groupKey).push(f);
  }

  const usedKeys = [];
  const headerCandidates = [];
  const columnCandidates = [];
  for (const members of groups.values()) {
    // A real repeating row is a *consecutive* 0,1,2,... run — requiring
    // that (rather than just ">=2 members") rules out a coincidental
    // "_N"-suffixed name that isn't actually a table column.
    const indices = members.map(m => m.index).sort((a, b) => a - b);
    const isConsecutiveRun = indices.every((idx, i) => idx === i);
    if (members.length < 2 || !isConsecutiveRun) {
      for (const m of members) {
        const label = humanizeFieldName(m.rawName);
        const key = uniqueId(slugify(label), usedKeys);
        usedKeys.push(key);
        headerCandidates.push({ key, label, page: m.page, x: m.x, y: m.y, width: m.width, fontSize: m.fontSize });
      }
      continue;
    }
    members.sort((a, b) => a.index - b.index);
    const deltas = [];
    for (let i = 1; i < members.length; i++) deltas.push(members[i - 1].y - members[i].y);
    columnCandidates.push({
      label: humanizeFieldName(members[0].rawName),
      page: members[0].page,
      x: members.reduce((s, m) => s + m.x, 0) / members.length,
      width: members.reduce((s, m) => s + m.width, 0) / members.length,
      fontSize: members[0].fontSize,
      startY: members[0].y,
      spacing: deltas.reduce((a, b) => a + b, 0) / deltas.length,
      rows: members.length,
    });
  }

  return { headerCandidates, tableCandidates: clusterColumnsIntoTables(columnCandidates) };
}

// Merges detected table COLUMNS (from either extraction path) into whole
// tables: columns on the same page sharing the same row count and grid
// (startY/spacing within a couple points — the same tolerance this project
// already accepted when refitting DA 2408-20/18's real per-row Y values to
// a uniform {startY,spacing} pair) belong to one real table. A column with
// no matching partner still becomes a valid one-column table rather than
// being discarded.
// Turns detected tableCandidates (see clusterColumnsIntoTables / the vector
// grid-detection pass above) into the schema.sections "table" entries +
// defaultLayout.extraTables entries a form type actually needs — the exact
// same shapes addEditorTable/confirmFormTypeBuilder produce, so a detected
// table is indistinguishable from a hand-built one once it lands.
// `existingRowsKeys`/`existingTitles` should list every rowsKey/title the
// target schema's `sections` already has — required so an *additive*
// upload (handleUploadPdfForExistingType) can't collide with a table a
// previous upload already added. `title` collisions are the more
// dangerous case: the main document view's schema-section renderer keys
// its `x-for` on `section.title` (index.html's "Generic, schema-driven
// form renderer"), and every detected table otherwise defaults to the
// same generic "Table" label — two sections sharing a `:key` crashes
// Alpine's reactivity for the *entire page*, not just this form type (a
// real incident this exact bug caused — every field on every form type
// went blank after uploading a PDF whose extraction produced two
// same-titled tables). Titles are deduped here, at the one choke point
// both extraction paths funnel through, rather than trying to make every
// extractor generate unique titles on its own.
function tableCandidatesToLayout(tableCandidates, existingRowsKeys, existingTitles) {
  const usedRowsKeys = (existingRowsKeys || []).slice();
  const usedTitles = (existingTitles || []).slice();
  const sections = [];
  const extraTables = [];
  for (const t of tableCandidates) {
    const rowsKey = usedRowsKeys.includes(t.rowsKey) ? uniqueId("table", usedRowsKeys) : t.rowsKey;
    usedRowsKeys.push(rowsKey);
    let title = t.title, n = 2;
    while (usedTitles.includes(title)) title = t.title + " " + (n++);
    usedTitles.push(title);
    sections.push({
      kind: "table", title, rowsKey, fixedRows: t.rows,
      columns: t.columns.map(c => ({ key: c.key, label: c.label, validation: {} })),
    });
    const cols = {};
    for (const c of t.columns) cols[c.key] = { x: c.x, width: c.width, fontSize: c.fontSize, allowOverflow: false };
    // Detection only ever finds a table on one physical page — it has no way
    // to know a table continues onto the other page, since nothing about a
    // real table's *columns* signals that. Lands entirely on whichever page
    // it was detected on; an admin re-splits it across page1/page2 in the
    // Form Type Editor afterward if the real form needs that (see
    // normalizeExtraTable / the editor's "Max rows" controls).
    const onPage2 = t.page === 1;
    extraTables.push({
      rowsKey,
      maxRows: t.rows,
      page1: onPage2 ? { rows: 0, startY: 700, spacing: 20 } : { rows: t.rows, startY: t.startY, spacing: t.spacing },
      page2: onPage2 ? { rows: t.rows, startY: t.startY, spacing: t.spacing } : { rows: 0, startY: 700, spacing: 20 },
      cols,
    });
  }
  return { sections, extraTables };
}

function clusterColumnsIntoTables(columnCandidates) {
  const GRID_TOLERANCE = 2;
  const used = new Array(columnCandidates.length).fill(false);
  const tables = [];
  const usedRowsKeys = [];
  const usedColKeys = [];
  for (let i = 0; i < columnCandidates.length; i++) {
    if (used[i]) continue;
    const base = columnCandidates[i];
    const group = [base];
    used[i] = true;
    for (let j = i + 1; j < columnCandidates.length; j++) {
      if (used[j]) continue;
      const cand = columnCandidates[j];
      if (cand.page !== base.page || cand.rows !== base.rows) continue;
      if (Math.abs(cand.startY - base.startY) > GRID_TOLERANCE) continue;
      if (Math.abs(cand.spacing - base.spacing) > GRID_TOLERANCE) continue;
      group.push(cand);
      used[j] = true;
    }
    group.sort((a, b) => a.x - b.x);
    const rowsKey = uniqueId("table", usedRowsKeys);
    usedRowsKeys.push(rowsKey);
    const columns = group.map(c => {
      const key = uniqueId(slugify(c.label) || "col", usedColKeys);
      usedColKeys.push(key);
      return { key, label: c.label, x: c.x, width: c.width, fontSize: c.fontSize };
    });
    tables.push({
      title: columns.length === 1 ? columns[0].label : "Table",
      rowsKey, page: base.page, startY: base.startY, spacing: base.spacing, rows: base.rows,
      columns,
    });
  }
  return tables;
}

// Flattened/exported PDFs have no fields at all, but (unlike a scan) still
// carry a real text layer — pdf.js's getTextContent() gives every text
// run's string plus its exact (x, y) origin in the same PDF-point,
// bottom-left-origin space pdf-lib uses, no viewport/scale conversion
// needed. Heuristic, deliberately simple: cluster items into lines by y,
// then any item ending in ":" is a label, and its field is the blank space
// to its right on that same line, up to the next item (or a capped max
// width). Misses labels stacked above their blank rather than beside it —
// acceptable, since every candidate lands in the Form Type Editor for
// review anyway.
//
// Table detection: over the lines NOT already claimed by a label ("...:")
// (so a key/value block is never double-classified as a table), look for a
// run of >=3 consecutive lines with the same item count whose item
// x-positions line up column-by-column within a few points — a real grid,
// not a coincidence. This is fuzzier than the AcroForm path's field-name
// signal (no field names exist here at all) and can misfire on
// coincidentally-aligned text; every result still lands in the Form Type
// Editor for review before anything is saved.
function extractVectorPdfCandidates(pages) {
  const LINE_TOLERANCE = 3;
  const GAP_AFTER_LABEL = 4;
  const MIN_FIELD_WIDTH = 40;
  const MAX_FIELD_WIDTH = 220;
  const GRID_X_TOLERANCE = 5;
  const MIN_GRID_ROWS = 3; // header row + >=2 data rows, to keep false positives down
  const usedKeys = [];
  const usedRowsKeys = [];
  const headerCandidates = [];
  const tableCandidates = [];

  for (const { pageIndex, items } of pages) {
    const lines = [];
    for (const item of items) {
      const str = (item.str || "").trim();
      if (!str) continue;
      const x = item.transform[4], y = item.transform[5];
      const width = item.width || 0;
      const height = item.height || 10;
      let line = lines.find(l => Math.abs(l.y - y) <= LINE_TOLERANCE);
      if (!line) { line = { y, items: [] }; lines.push(line); }
      line.items.push({ str, x, y, width, height });
    }
    for (const line of lines) line.items.sort((a, b) => a.x - b.x);
    lines.sort((a, b) => b.y - a.y); // top-to-bottom, needed for the grid run-detection below

    const isLabelLine = lines.map(line => line.items.some(it => /:\s*$/.test(it.str)));

    lines.forEach((line, idx) => {
      if (!isLabelLine[idx]) return;
      for (let i = 0; i < line.items.length; i++) {
        const it = line.items[i];
        if (!/:\s*$/.test(it.str)) continue;
        const label = it.str.replace(/:\s*$/, "").trim();
        if (!label) continue;
        const next = line.items[i + 1];
        const startX = it.x + it.width + GAP_AFTER_LABEL;
        const endX = next ? next.x - GAP_AFTER_LABEL : startX + MAX_FIELD_WIDTH;
        const available = endX - startX;
        if (available < MIN_FIELD_WIDTH) continue; // no room after this label
        const width = Math.min(MAX_FIELD_WIDTH, available);
        const key = uniqueId(slugify(label), usedKeys);
        usedKeys.push(key);
        headerCandidates.push({
          key, label, page: pageIndex,
          x: startX, y: it.y, width,
          fontSize: Math.min(12, Math.max(7, Math.round(it.height * 0.75))),
        });
      }
    });

    const gridLines = lines.filter((line, idx) => !isLabelLine[idx] && line.items.length >= 2);
    let i = 0;
    while (i < gridLines.length) {
      let runEnd = i;
      while (
        runEnd + 1 < gridLines.length &&
        gridLines[runEnd + 1].items.length === gridLines[i].items.length &&
        gridLines[runEnd + 1].items.every((it, colIdx) => Math.abs(it.x - gridLines[i].items[colIdx].x) <= GRID_X_TOLERANCE)
      ) runEnd++;
      const runLength = runEnd - i + 1;
      if (runLength >= MIN_GRID_ROWS) {
        const headerRow = gridLines[i];
        const dataRows = gridLines.slice(i + 1, runEnd + 1);
        const deltas = [];
        for (let r = 1; r < dataRows.length; r++) deltas.push(dataRows[r - 1].y - dataRows[r].y);
        const rowsKey = uniqueId("table", usedRowsKeys);
        usedRowsKeys.push(rowsKey);
        const columns = headerRow.items.map((it, colIdx) => {
          const label = it.str.trim();
          const next = headerRow.items[colIdx + 1];
          const width = Math.min(MAX_FIELD_WIDTH, next ? Math.max(MIN_FIELD_WIDTH, next.x - it.x - GAP_AFTER_LABEL) : MAX_FIELD_WIDTH);
          const key = uniqueId(slugify(label) || "col", usedKeys);
          usedKeys.push(key);
          return { key, label, x: it.x, width, fontSize: Math.min(12, Math.max(7, Math.round(it.height * 0.75))) };
        });
        tableCandidates.push({
          title: "Table", rowsKey, page: pageIndex,
          startY: dataRows[0].y,
          spacing: deltas.length ? deltas.reduce((a, b) => a + b, 0) / deltas.length : (headerRow.y - dataRows[0].y),
          rows: dataRows.length,
          columns,
        });
      }
      i = runEnd + 1;
    }
  }
  return { headerCandidates, tableCandidates };
}

// Classifies an uploaded PDF's bytes and extracts field candidates —
// shared by both "Upload PDF" (create a brand-new form type) and a custom
// form type's own per-row "Upload/Replace PDF" (attach or swap a template
// on an existing type) — see "Upload PDF workflow" in CLAUDE.md. Throws if
// the bytes aren't a readable PDF at all; callers handle that.
async function classifyAndExtractPdf(bytes) {
  const { PDFDocument } = PDFLib;
  const pdfDoc = await PDFDocument.load(bytes);

  const form = pdfDoc.getForm();
  if (form.getFields().length > 0) {
    const { headerCandidates, tableCandidates } = extractAcroFormCandidates(pdfDoc, form);
    // Flatten so the resulting template has zero live fields — this
    // folder's fill engine is coordinate-draw only (see "Fill engine" in
    // CLAUDE.md), so a leftover live AcroForm field would just be dead
    // weight sitting under the drawn text, not a second path.
    form.flatten();
    const finalBytes = await pdfDoc.save();
    return { kind: "acroform", headerCandidates, tableCandidates, finalBytes };
  }

  let totalItems = 0;
  const pageItems = [];
  const loadingTask = pdfjsLib.getDocument({ data: bytes.slice() });
  const pdf = await loadingTask.promise;
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    totalItems += content.items.length;
    pageItems.push({ pageIndex: i - 1, items: content.items });
  }
  if (totalItems > 0) {
    const { headerCandidates, tableCandidates } = extractVectorPdfCandidates(pageItems);
    return { kind: "vector", headerCandidates, tableCandidates, finalBytes: bytes };
  }
  return { kind: "image", headerCandidates: [], tableCandidates: [], finalBytes: bytes };
}

// Resolves a saved field style to the matching pdf-lib StandardFonts value.
// Helvetica/Times/Courier are the only fonts pdf-lib ships without needing a
// real font file embedded, each with the same four bold/italic variants.
function resolveStandardFont(style) {
  const { StandardFonts } = PDFLib;
  const table = {
    Helvetica:  { "": StandardFonts.Helvetica,  bold: StandardFonts.HelveticaBold,  italic: StandardFonts.HelveticaOblique,  boldItalic: StandardFonts.HelveticaBoldOblique },
    TimesRoman: { "": StandardFonts.TimesRoman, bold: StandardFonts.TimesRomanBold, italic: StandardFonts.TimesRomanItalic,  boldItalic: StandardFonts.TimesRomanBoldItalic },
    Courier:    { "": StandardFonts.Courier,    bold: StandardFonts.CourierBold,    italic: StandardFonts.CourierOblique,    boldItalic: StandardFonts.CourierBoldOblique },
  };
  const family = table[style.fontFamily] || table.Helvetica;
  const variant = style.bold && style.italic ? "boldItalic" : style.bold ? "bold" : style.italic ? "italic" : "";
  return family[variant] || family[""];
}

// One embedded-font cache per physical copy — a copy may use several
// distinct font/bold/italic combinations across its fields, but each
// combination only needs embedding once.
async function getEmbeddedFont(doc, fontCache, standardFontName) {
  if (!fontCache.has(standardFontName)) fontCache.set(standardFontName, await doc.embedFont(standardFontName));
  return fontCache.get(standardFontName);
}

// ---------------------------------------------------------------------------
// Output formatting for text/number/date fields (Form Type Editor's "Field
// type" controls — see PDF-gen/CLAUDE.md). Purely a fill-time/print concern:
// the stored value itself is never rewritten, matching this project's
// existing precedent for the native date input (§26 in history.md) — a
// field always keeps whatever string the user actually typed; only what
// gets DRAWN onto the PDF changes.
// ---------------------------------------------------------------------------

// Parses the same three lenient date shapes looksLikeDate() already accepts
// (army-style "15 MAR 26", ISO, slash) into a real Date, so a configured
// output format has something to reformat. Returns null for anything that
// doesn't match one of those shapes — formatting is then skipped and the
// raw value is drawn as-is, same as an unconfigured field always has.
const MONTH_ABBR = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
function parseLenientDate(str) {
  const s = String(str).trim();
  let m;
  if ((m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s))) return new Date(+m[1], +m[2] - 1, +m[3]);
  if ((m = /^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/.exec(s))) {
    let year = +m[3]; if (year < 100) year += 2000;
    return new Date(year, +m[1] - 1, +m[2]);
  }
  if ((m = /^(\d{1,2})\s*([A-Za-z]{3,9})\s*(\d{2,4})$/.exec(s))) {
    const monthIdx = MONTH_ABBR.indexOf(m[2].slice(0, 3).toUpperCase());
    if (monthIdx === -1) return null;
    let year = +m[3]; if (year < 100) year += 2000;
    return new Date(year, monthIdx, +m[1]);
  }
  return null;
}

// Renders a parsed date against a small token vocabulary (M/D/YY/YYYY/MMM —
// the presets the Form Type Editor's "Output format" select offers, plus
// anything else built from the same tokens). A single regex pass with
// longest-alternative-first ordering (YYYY before YY, MMM before MM before
// M, DD before D) — NOT sequential chained .replace() calls — because a
// month abbreviation can itself contain a letter a later token would also
// match (e.g. "MAR" has a bare M, "DEC" has a bare D); a chained replace
// would re-scan and corrupt text it had just substituted in an earlier
// step (caught by a real test: "DD MMM YY" produced "05 3AR 26" — the
// already-substituted "MAR"'s M got clobbered by the trailing bare-M
// replacement pass). One pass, each character consumed exactly once,
// can't recurse into its own output.
function formatDateForOutput(date, format) {
  const month = date.getMonth() + 1, day = date.getDate(), year = date.getFullYear();
  const pad = (n) => String(n).padStart(2, "0");
  return format.replace(/YYYY|YY|MMM|MM|DD|M|D/g, (token) => {
    switch (token) {
      case "YYYY": return String(year);
      case "YY": return String(year).slice(-2);
      case "MMM": return MONTH_ABBR[month - 1];
      case "MM": return pad(month);
      case "DD": return pad(day);
      case "M": return String(month);
      case "D": return String(day);
    }
  });
}

// The one place a field's stored value turns into what actually gets drawn.
// `validation` is the schema-level spec (type/maxLength/decimals/
// dateFormat) — absent for anything with no validation configured (an
// overlay, a layout-only "page"/"pageOf" stamp), in which case the value is
// drawn completely unchanged, same as before this existed.
function formatValueForType(value, validation) {
  if (value === undefined || value === null || value === "" || !validation) return value;
  if (validation.type === "number" && validation.decimals != null) {
    const n = Number(value);
    if (!isNaN(n)) return n.toFixed(validation.decimals);
  } else if (validation.type === "date" && validation.dateFormat && validation.dateFormat !== "asEntered") {
    const parsed = parseLenientDate(value);
    if (parsed) return formatDateForOutput(parsed, validation.dateFormat);
  } else if (validation.type === "text" && validation.maxLength) {
    // Defensive, not the primary guard — the data-entry input's own
    // `:maxlength` already keeps this from happening in the normal case;
    // this just makes sure the PDF never shows more than configured
    // regardless of how the value got there (sample data, a saved
    // Default, an import), matching this project's own AcroForm-path
    // precedent for the same guarantee (history.md §6).
    return String(value).slice(0, validation.maxLength);
  }
  return value;
}

// Draws one field's value at its configured coordinate onto the given page.
// allowOverflow: true draws a single unclipped line (may run past the box's
// width, hence "overflow"); false wraps within the box width instead,
// keeping it contained — exactly what pdfgen-vanilla's original 2408-20
// "remarks" field already did with wrap+lineHeight.
async function drawStyledField(doc, pages, fontCache, value, spec) {
  if (!value) return;
  const { rgb } = PDFLib;
  const font = await getEmbeddedFont(doc, fontCache, resolveStandardFont(spec));
  // Every layout assumes a 2-page (front/back) template, but a custom form
  // type's attached PDF may well be a single page (e.g. a blank/generic
  // background) — clamp rather than crash if a field/row's page index
  // doesn't actually exist, drawing onto the last real page instead.
  const page = pages[spec.page] || pages[pages.length - 1];
  const size = spec.fontSize > 0 ? spec.fontSize : 8;
  if (spec.allowOverflow) {
    page.drawText(String(value), { x: spec.x, y: spec.y, size, font, color: rgb(0, 0, 0) });
  } else {
    page.drawText(String(value), {
      x: spec.x, y: spec.y, size, font,
      maxWidth: spec.width, lineHeight: size + 3, color: rgb(0, 0, 0),
    });
  }
}

// Draws one overlay image (a fixed logo/stamp, or a per-instance
// signature filled into a placeholder — see "Form Type Editor overlays"
// in PDF-gen/CLAUDE.md) onto its configured page/box. `dataUrl` is a full
// `data:image/png;base64,...` or `data:image/jpeg;base64,...` string, as
// produced by FileReader.readAsDataURL — pdf-lib needs the mime-specific
// embed call, so the prefix is what tells embedPng vs embedJpg apart.
async function drawOverlayImage(doc, pages, dataUrl, spec) {
  if (!dataUrl) return;
  const match = /^data:(image\/\w+);base64,(.*)$/.exec(dataUrl);
  if (!match) return;
  const [, mime, b64] = match;
  const bytes = b64ToBytes(b64);
  const image = mime === "image/png" ? await doc.embedPng(bytes) : await doc.embedJpg(bytes);
  const page = pages[spec.page] || pages[pages.length - 1];
  page.drawImage(image, { x: spec.x, y: spec.y, width: spec.width, height: spec.height });
}

// Draws every overlay a form type's layout carries onto one physical copy
// — fixed overlays (mode: "fixed") use the image/text baked into the
// layout itself; placeholder overlays (mode: "placeholder", e.g. a
// "Signature" box the type only reserves space for) pull their actual
// content from this specific instance's own `overlayData`, keyed by
// overlay id. A placeholder with nothing filled in yet is simply skipped
// — signing is optional, not validated, per this feature's scope.
async function drawOverlays(doc, pages, fontCache, layout, form, copyIndex) {
  for (const ov of layout.overlays || []) {
    const filled = ov.mode === "placeholder" ? (form.overlayData && form.overlayData[ov.id]) : ov;
    if (!filled) continue;
    if (ov.kind === "image") {
      await drawOverlayImage(doc, pages, filled.imageB64, ov);
    } else if (ov.kind === "text") {
      await drawStyledField(doc, pages, fontCache, filled.text, ov);
    }
  }
}

// Returns an array of loaded, filled, NOT-yet-merged PDFDocuments — one per
// physical copy needed to fit all rows. Shared by every form type, driven
// purely by a schema's `templateB64` + field layout — nothing form-type-
// specific about this loop, so a schema loaded from the server needs no
// per-type wrapper the way pdfgen-vanilla-image's copies2408_XX() was.
async function buildCoordinateCopies(schema, form, layout) {
  const { PDFDocument } = PDFLib;
  const templateBytes = b64ToBytes(schema.templateB64);
  // Every table this schema declares — the primary (growable) table, whose
  // grid/columns live at the layout's own top level, plus every "extra"
  // (normally fixed-count) table — is treated uniformly here: each has its
  // own maxRows (the cap that decides when THAT table's data needs another
  // physical copy of the whole instance, header included) and its own
  // page1/page2 grid to split across. A table whose data never exceeds its
  // own cap simply has nothing left to draw on copies past the first — no
  // special-casing needed for a table that in practice never grows past
  // what it was seeded with (a Verification log, a Remarks list): every
  // copyIndex beyond 0 slices an empty chunk automatically. A header-only
  // form type (e.g. one created via "Upload PDF"/the manual builder with no
  // table at all) has no primary cols and no extraTables — always exactly
  // one physical copy, since there's no table to overflow.
  const allTables = [{ rowsKey: "rows", maxRows: layout.maxRows, page1: layout.page1, page2: layout.page2, cols: layout.cols }]
    .concat(layout.extraTables || [])
    .filter(t => Object.keys(t.cols).length);
  const tableCap = (t) => t.maxRows != null ? t.maxRows : ((t.page1.rows || 0) + (t.page2.rows || 0));
  const totalCopies = allTables.length
    ? Math.max(1, ...allTables.map(t => {
        const cap = tableCap(t);
        return cap > 0 ? Math.ceil((form[t.rowsKey] || []).length / cap) : 1;
      }))
    : 1;
  const exclude = layout.repeatingHeaderExclude || [];
  const docs = [];

  for (let copyIndex = 0; copyIndex < totalCopies; copyIndex++) {
    const templateDoc = await PDFDocument.load(templateBytes);
    const pages = templateDoc.getPages();
    const fontCache = new Map();

    // The running "Page X of Y" stamp only applies to schemas whose layout
    // actually declares those two header keys (every built-in type does) —
    // a header-only custom type (Upload PDF/manual builder, no table to
    // ever overflow into multiple physical copies) has neither, and
    // drawStyledField(..., undefined) would crash reading properties off
    // an undefined spec.
    // ...and only when `page`/`pageOf` are layout-only keys. A custom type
    // built from an uploaded PDF very often has a REAL extracted field
    // called "page" (every DA form has a "PAGE" box), which lives in
    // form.header as user-entered data — stamping the copy number into that
    // same spec drew the page number directly on top of the user's own
    // value. Every built-in type keeps these as layout-only keys, so their
    // running stamp is unchanged.
    if (layout.header.page && !("page" in form.header)) await drawStyledField(templateDoc, pages, fontCache, String(copyIndex + 1), layout.header.page);
    if (layout.header.pageOf && !("pageOf" in form.header)) await drawStyledField(templateDoc, pages, fontCache, String(totalCopies), layout.header.pageOf);
    for (const key of Object.keys(form.header)) {
      if (exclude.includes(key) && copyIndex > 0) continue; // e.g. remarks: copy 1 only
      if (layout.header[key]) {
        const validation = headerFieldSpec(schema, key)?.validation;
        await drawStyledField(templateDoc, pages, fontCache, formatValueForType(form.header[key], validation), layout.header[key]);
      }
    }

    for (const table of allTables) {
      const cap = tableCap(table);
      const allRows = form[table.rowsKey] || [];
      // cap === 0 (never configured) falls back to the pre-existing
      // "everything on copy 0 only" behavior rather than an empty window —
      // matches how a schema with no real per-page capacity yet behaved
      // before this table had any position at all.
      const chunk = cap > 0 ? allRows.slice(copyIndex * cap, copyIndex * cap + cap) : (copyIndex === 0 ? allRows : []);
      for (let i = 0; i < chunk.length; i++) {
        const row = chunk[i];
        const onPage1 = i < table.page1.rows;
        const grid = onPage1 ? table.page1 : table.page2;
        const rowIdx = onPage1 ? i : i - table.page1.rows;
        const y = grid.startY - rowIdx * grid.spacing;
        const pageIndex = onPage1 ? 0 : 1;
        for (const key of Object.keys(table.cols)) {
          // yOffset (default 0) lets a column sit on a second physical line
          // below the row's main baseline — e.g. DA 2408-17's 12 "check
          // number" columns print one line under that row's Item/Nomenclature/
          // Qty line, not beside them.
          const spec = { ...table.cols[key], page: pageIndex, y: y + (table.cols[key].yOffset || 0) };
          const validation = columnSpecByKey(schema, key)?.validation;
          await drawStyledField(templateDoc, pages, fontCache, formatValueForType(row[key], validation), spec);
        }
      }
    }

    await drawOverlays(templateDoc, pages, fontCache, layout, form, copyIndex);

    docs.push(templateDoc);
  }

  return docs;
}

// Generic per-form-type entry points, replacing the copies2408_XX()/
// buildFilledPdf2408_XX() wrappers pdfgen-vanilla-image attached to each
// schema object — a JSON-fetched schema carries no functions, so these take
// the schema as a plain argument instead. `layout` defaults to the schema's
// own `defaultLayout` (its fetched, un-overridden field positions/styling).
function buildCopiesGeneric(schema, form, layout) {
  return buildCoordinateCopies(schema, form, layout || schema.defaultLayout);
}

async function buildFilledPdfGeneric(schema, form, layout) {
  const outDoc = await mergeCoordinateDocs(await buildCopiesGeneric(schema, form, layout));
  return outDoc.save();
}

// Merges several independent, already-filled coordinate-drawn PDFDocuments
// into one output document. Unlike pdfgen-vanilla-multi's AcroForm merge,
// there are no field names to collide or re-attach to an /AcroForm here —
// the text is just drawn directly onto each page, so copyPages() alone is
// the entire merge.
async function mergeCoordinateDocs(sourceDocs) {
  const { PDFDocument } = PDFLib;
  const outDoc = await PDFDocument.create();
  for (const src of sourceDocs) {
    const pages = await outDoc.copyPages(src, src.getPageIndices());
    pages.forEach(p => outDoc.addPage(p));
  }
  return outDoc;
}

// "Export All" — every form instance in the logbook, merged into one PDF.
// Grouped by form type in the order assigned to this document's document
// type (see documentTypeForms / "assign & sort" in pdfgenApp()), each
// type's own instances in the order they appear in the sidebar. A form
// type with no PDF template yet (an admin-created "shape only" type — see
// the Form Types admin panel) has nothing to draw, so it's skipped here
// rather than crashing buildCoordinateCopies on a missing template.
async function buildCombinedPdf(logbook, fieldLayouts, formTypesList) {
  const allDocs = [];
  for (const ft of formTypesList) {
    if (!ft.templateB64) continue;
    const layout = getLayout(ft, fieldLayouts);
    for (const instance of (logbook[formTypeKey(ft.type)] || [])) {
      allDocs.push(...await buildCopiesGeneric(ft, instance, layout));
    }
  }
  if (!allDocs.length) return null;
  const outDoc = await mergeCoordinateDocs(allDocs);
  return outDoc.save();
}
