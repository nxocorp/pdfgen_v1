  // with no manual re-save needed. Only kicks in when there's a primary
  // table to place at all (`cols` non-empty) and it's still at the
  // unconfigured 0 — a real, deliberately-set page1 (from the position
  // editor's own "Row grid" panel) is never overridden.
  if (Object.keys(cols).length && !page1.rows) {
    page1.rows = 20;
    page1.startY = page1.startY || 700;
    page1.spacing = page1.spacing || 20;
  }
  // The primary table's own total-rows-per-instance cap — same concept as
  // an extra table's `maxRows` (see normalizeExtraTable), exposed here too
  // so the Structure Builder/Form Type Editor can show and edit "front +
  // back + total" uniformly for every table, not just the fixed-count ones.
  // Defaults to page1.rows + page2.rows (the sum IS the cap, absent an
  // explicit override) — this is also the number that decides when the
  // primary table's data needs another physical copy of the whole instance.
  const maxRowsSaved = saved.maxRows;
  const maxRowsBase = base.maxRows;
  const maxRows = maxRowsSaved != null ? maxRowsSaved : (maxRowsBase != null ? maxRowsBase : (page1.rows + page2.rows));
  // Overlays (user-added images/text boxes, see the Form Type Editor's
  // "+ Add image"/"+ Add text box") are whole user-authored objects, not
  // per-key style overrides like header/cols above — a save fully replaces
  // the overlay list rather than merging field-by-field, so removing an
  // overlay in the editor actually removes it instead of it reappearing
  // from defaultLayout.
  const overlays = saved.overlays !== undefined ? saved.overlays : (base.overlays || []);
  // Fixed-count "extra" tables (e.g. DA 2408-17's Verification log and
  // Remarks list — see "Multi-table support" in PDF-gen/CLAUDE.md) never
  // overflow onto extra physical copies, but CAN still span front-to-back —
  // each carries its own page1/page2 grid (normalized from either shape via
  // normalizeExtraTable). Per-column positions merge the same way as the
  // primary table's `cols`; page1/page2/maxRows merge at the table level so
  // an untouched extra table still renders exactly as its default.
  const extraTables = (base.extraTables || []).map(normalizeExtraTable).map(baseTable => {
    const savedRaw = (saved.extraTables || []).find(t => t.rowsKey === baseTable.rowsKey);
    const savedTable = savedRaw ? normalizeExtraTable(savedRaw) : null;
    const tableCols = {};
    for (const key of Object.keys(baseTable.cols)) {
      tableCols[key] = { ...baseTable.cols[key], ...((savedTable && savedTable.cols[key]) || {}) };
    }
    return {
      rowsKey: baseTable.rowsKey,
      maxRows: savedTable ? savedTable.maxRows : baseTable.maxRows,
      page1: { ...baseTable.page1, ...(savedTable ? savedTable.page1 : {}) },
      page2: { ...baseTable.page2, ...(savedTable ? savedTable.page2 : {}) },
      cols: tableCols,
    };
  });
  return { header, cols, page1, page2, maxRows, repeatingHeaderExclude: base.repeatingHeaderExclude || [], overlays, extraTables };
}

// ---------------------------------------------------------------------------
// Preview rendering. Mobile browsers (Chrome/Safari on Android/iOS in
// particular) do not render PDFs inline inside an <iframe> — they show a
// generic "open externally" card instead, which also breaks
// iframe.contentWindow.print(). Rendering each page to a <canvas> with
// pdf.js works identically on every platform, and printing is done by
// turning those canvases into images in a dedicated print window instead of
// relying on any browser's native PDF viewer.
// ---------------------------------------------------------------------------
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

// kept outside Alpine's reactive state — it's a large binary blob, not UI
// state, so there's no reason to pay for deep-proxying it on every change.
let lastPreviewBytes = null;

function openBytesInNewWindow(bytes) {
  const blob = new Blob([bytes], { type: "application/pdf" });
  const url = URL.createObjectURL(blob);
  const win = window.open(url, "_blank");
  if (!win) {
    alert("Your browser blocked the new window — please allow pop-ups for this page and try again.");
    URL.revokeObjectURL(url);
    return;
  }
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

async function renderPreviewPages(container, bytes) {
  container.innerHTML = "";
  const loadingTask = pdfjsLib.getDocument({ data: bytes.slice() });
  const pdf = await loadingTask.promise;
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const viewport = page.getViewport({ scale: 1.4 });
    const canvas = document.createElement("canvas");
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    container.appendChild(canvas);
    await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
  }
}


function pdfgenApp() {
  return {
    logbooks: [],
    defaults: [],
    fieldLayouts: {},
    currentId: null,
    generating: false,
    previewGenerated: false,

    // Undo/redo history, in-memory only (not persisted) — keyed by logbook
    // id so switching logbooks doesn't mix histories. Each entry is a full
    // deep-cloned snapshot of that logbook's state just before a change.
    undoStacks: {},
    redoStacks: {},

    sidebarOpen: true,
    previewPanelOpen: false,
    previewWidth: 380,
    resizingPreview: false,
    FORM_TYPES,                // same array reference module-level loadFormTypes() pushes into
    formTypesLoaded: false,
    bootstrapError: false,     // /api/bootstrap failed — server unreachable, no form types or saved data loaded
    saveStatus: "saved",       // "saved" | "pending" | "saving" | "error" — driven by the sync queue, see queueSync()
    activeFormType: null,      // set once the form-type registry loads, e.g. '2408-18'
    activeInstanceId: null,    // id of the specific instance being edited
    dragIndex: null,

    // Per-form-type collapse state for the "Forms in this document"
    // sidebar list — in-memory only (like undo/redo), keyed by form type.
    collapsedFormTypes: {},

    // Inline rename of a form instance's sidebar label — only one row can
    // be in edit mode at a time, so a single id/draft pair (rather than
    // per-row state) is enough.
    renamingInstanceId: null,
    renameDraft: "",

    // Registry: aircraft models, document types, and which form types each
    // document type contains and in what order — all admin-maintainable via
    // the app now (see "Admin mode" below), backed by the SQLite database
    // (server/) instead of hardcoded arrays. Seeded once on first boot
    // (server/db.js) from the same fake values this POC used to hardcode.
    aircraftModels: [],
    documentTypes: [],          // [{ id, name, models: string[] }]
    documentTypeForms: {},      // { [docTypeId]: string[] (ordered form-type keys) }
    formTypeOverrides: {},      // { [formType]: { label, bannerNote } } — admin edits to any type's metadata
    // Both start unpicked on every load — "Pick Model"/"Pick Document" are
    // real placeholder options in their <select>s, not just visual hints,
    // so nothing document-related renders (see isSupported) until an
    // admin/user has actually chosen both.
    selectedModel: "",
    selectedDocType: "",

    // ---- Admin mode ----
    // A checkbox in the header, simulating a role check — no real auth in
    // this POC. While checked, the sidebar exposes the three maintenance
    // panels below (aircraft models, document types, form types) plus
    // "assign & sort" and the manual form-type schema builder.
    isAdmin: false,

    showAdminModelsModal: false,
    newModelName: "",
    // Inline rename of one row in the Aircraft Models list — only one row
    // can be in edit mode at a time, same pattern as the sidebar's
    // instance rename (renamingInstanceId/renameDraft above).
    renamingModelName: null,
    renameModelDraft: "",

    showAdminDocTypesModal: false,
    newDocTypeName: "",
    renamingDocTypeId: null,
    renameDocTypeDraft: "",

    // "Assign & sort form types within a document type" — a separate modal
    // opened from the Document Types panel, working against a draft copy
    // (assignDraft, an ordered array of form-type keys) so Cancel doesn't
    // half-apply a reorder in progress.
    showAdminAssignModal: false,
    adminAssignDocTypeId: null,
    assignDraft: [],
    assignDragIndex: null,

    showAdminFormTypesModal: false,
    uploadingFormType: false,   // true while a just-uploaded PDF is being classified/extracted

    // Manual schema builder for a brand-new form type — see
    // confirmFormTypeBuilder(). Deliberately simple: one "fields" section
    // plus an optional single growable table, no fixed-row tables or
    // multi-table support (unlike the built-in DA 2408-17) — those are
    // reachable later once a real PDF template exists to derive them from.
    showFormTypeBuilder: false,
    builderDraft: null,

    showNewModal: false,
    newTailNumber: "",
    newSource: "blank",

    showSaveDefaultModal: false,
    newDefaultName: "",

    showAutomateModal: false,
    automateSteps: [],
    automateDone: false,

    showValidationModal: false,
    validationProblems: [],

    // ---- Form Type Editor state ----
    showEditorModal: false,
    editorFormType: null,
    editorPageIndex: 0,
    editorLabels: { header: {}, col: {} },
    editorDraft: null,          // deep clone of the layout being edited, per "getLayout" shape
    editorSelectedKind: null,   // 'header' | 'col'
    editorSelectedKey: null,
    editorScale: 1,
    editorDrag: null,           // { mode: 'move'|'resize', kind, key, startX, startY, origX, origY, origWidth }

    get current() {
      return this.logbooks.find(l => l.id === this.currentId) || null;
    },

    get selectedDocTypeObj() {
      return this.documentTypes.find(d => d.id === this.selectedDocType) || null;
    },

    // The document type dropdown only ever lists types enabled for the
    // currently-picked aircraft model (see the Document Types admin
    // panel's per-model checkboxes) — "Pick Document" itself when no
    // model is chosen yet, so a stray/unrelated document type never shows.
    availableDocumentTypes() {
      if (!this.selectedModel) return [];
      return this.documentTypes.filter(dt => dt.models.includes(this.selectedModel));
    },

    // Both a model and a document type need to be explicitly picked
    // (neither starts pre-selected — see selectedModel/selectedDocType
    // above) — and since the dropdown itself only ever offers document
    // types enabled for the picked model, a non-empty selectedDocType is
    // already guaranteed valid for it.
    get isSupported() {
      return !!this.selectedModel && !!this.selectedDocType;
    },

    documentTypeName(id) {
      const dt = this.documentTypes.find(d => d.id === id);
      return dt ? dt.name : id;
    },

    // The document type's assigned form types, in admin-sorted order,
    // resolved from keys (documentTypeForms) to schema objects (FORM_TYPES)
    // — the one place "which form types does this document contain"
    // actually gets answered, used by every logbook-shaped operation below
    // instead of iterating the whole FORM_TYPES registry.
    formTypesFor(docTypeId) {
      const keys = this.documentTypeForms[docTypeId] || [];
      return keys.map(k => this.FORM_TYPES.find(f => f.type === k)).filter(Boolean);
    },

    formTypeLabel(type) {
      const f = this.FORM_TYPES.find(f => f.type === type);
      return f ? f.label : type;
    },

    hasTemplate(schema) {
      return !!(schema && schema.templateB64);
    },

    get activeSchema() {
      return FORM_TYPES.find(f => f.type === this.activeFormType) || null;
    },

    get editorSchema() {
      return FORM_TYPES.find(f => f.type === this.editorFormType) || null;
    },

    get editorFieldList() {
      const list = [];
      for (const key of Object.keys(this.editorLabels.header)) list.push({ kind: "header", key, label: this.editorLabels.header[key] });
      for (const key of Object.keys(this.editorLabels.col)) list.push({ kind: "col", key, label: this.editorLabels.col[key] });
      return list;
    },

    // Table columns grouped by their owning table, for the field list's
    // per-table sub-groups (see "+ Add table" in the toolbar above). The
    // primary (growable) table's group only appears once it actually has
    // columns/a title — a fresh custom type with no primary table at all
    // (the common case before any table exists) shows neither.
    editorTableGroups() {
      if (!this.editorDraft) return [];
      const groups = [];
      if (Object.keys(this.editorDraft.cols).length || this.editorLabels.table.rows) {
        groups.push({
          rowsKey: "rows",
          title: this.editorLabels.table.rows || "Table",
          columns: Object.keys(this.editorDraft.cols).map(key => ({ key, label: this.editorLabels.col[key] || key })),
          removable: false,
        });
      }
      for (const table of this.editorDraft.extraTables || []) {
        groups.push({
          rowsKey: table.rowsKey,
          title: this.editorLabels.table[table.rowsKey] || table.rowsKey,
          columns: Object.keys(table.cols).map(key => ({ key, label: this.editorLabels.col[key] || key })),
          // "removable" here really means "this is an extra (non-primary)
          // table" — add/remove-column and remove-table only work against
          // editorDraft.extraTables (addEditorTableColumn/removeEditorTable
          // below), not the primary table's own `cols`, regardless of
          // which type owns it (built-in or custom — see "+ Add table"'s
          // own scope note: a new table is always a fixed-row extra table,
          // never the primary growable one).
          removable: true,
        });
      }
      return groups;
    },

    // the currently-open logbook's instances of a given form type
    instancesOf(type) {
      return this.current ? (this.current[formTypeKey(type)] || []) : [];
    },

    // this document's assigned form types, in admin-sorted order — what
    // the sidebar's "Forms in this document" list and Export All both walk.
    formTypesInCurrent() {
      return this.current ? this.formTypesFor(this.current.documentTypeId) : [];
    },

    toggleFormTypeCollapsed(type) {
      this.collapsedFormTypes[type] = !this.collapsedFormTypes[type];
    },

    isFormTypeCollapsed(type) {
      return !!this.collapsedFormTypes[type];
    },

    // A custom name wins if set; otherwise falls back to the original
    // auto-generated "<type> — Instance N" label, unchanged from before
    // renaming existed.
    instanceLabel(ft, inst, idx) {
      const name = inst.name && inst.name.trim();
      return name || (ft.type + " — Instance " + (idx + 1));
    },

    startRenameInstance(ft, inst, idx) {
      this.renamingInstanceId = inst.id;
      this.renameDraft = (inst.name && inst.name.trim()) || this.instanceLabel(ft, inst, idx);
      this.$nextTick(() => this.$refs.renameInput && this.$refs.renameInput.select());
    },

    commitRename(inst) {
      if (this.renamingInstanceId !== inst.id) return; // already committed/cancelled (blur firing after Enter)
      const oldName = inst.name;
      inst.name = this.renameDraft.trim();
      this.renamingInstanceId = null;
      if (this.current) this.current.updatedAt = new Date().toISOString();
      logAction("FORM", "Renamed instance", (oldName || "(unnamed)") + " -> " + (inst.name || "(unnamed)"));
    },

    cancelRename() {
      this.renamingInstanceId = null;
    },

    get activeInstance() {
      if (!this.current || !this.activeFormType) return null;
      const list = this.current[formTypeKey(this.activeFormType)] || [];
      return list.find(i => i.id === this.activeInstanceId) || null;
    },

    activeInstanceIndex() {
      if (!this.current || !this.activeFormType) return "";
      const list = this.current[formTypeKey(this.activeFormType)] || [];
      const idx = list.findIndex(i => i.id === this.activeInstanceId);
      return idx === -1 ? "" : idx + 1;
    },

    // Front/back/total row capacity for one table section, straight off the
    // active schema's real layout (getLayout) — not the schema/section
    // definition alone, since a saved Form Type Editor override can change
    // these without touching `sections`. Shown at the top-right of the
    // table's own header in the document view (see "Database backend..."
    // in PDF-gen/CLAUDE.md) so a user filling in a table can see, at a
    // glance, when they're about to trigger a new physical copy.
    tableCapacityLabel(section) {
      if (!this.activeSchema) return "";
      const layout = getLayout(this.activeSchema, this.fieldLayouts);
      const isPrimary = section.rowsKey === "rows";
      const table = isPrimary ? layout : (layout.extraTables || []).find(t => t.rowsKey === section.rowsKey);
      if (!table) return "";
      const front = table.page1.rows || 0;
      const back = table.page2.rows || 0;
      const total = table.maxRows != null ? table.maxRows : (front + back);
      return "Front " + front + " · Back " + back + " · Total " + total + "/instance";
    },

    // ---- field/form validation (see validateFieldValue/validateInstance) ----
    headerFieldErrors(key) {
      if (!this.activeInstance || !this.activeSchema) return [];
      const spec = headerFieldSpec(this.activeSchema, key);
      return validateFieldValue(this.activeInstance.header[key], spec && spec.validation);
    },

    rowFieldErrors(section, row, key) {
      const spec = columnSpec(section, key);
      return validateFieldValue(row[key], spec && spec.validation);
    },

    // Count of currently-invalid fields across the whole active instance —
    // drives the toolbar's validation-summary banner. Recomputed on every
    // render (cheap at this form's scale), so it always reflects the latest
    // edit without a separate dirty-tracking mechanism.
    activeInstanceErrorCount() {
      if (!this.activeInstance || !this.activeSchema) return 0;
      return validateInstance(this.activeSchema, this.activeInstance).length;
    },

    // Toggles the active instance's complete/incomplete state. Marking
    // complete runs full-instance validation first and refuses if anything
    // fails; unmarking (going back to incomplete) is always allowed, no
    // validation required.
    toggleComplete() {
      const instance = this.activeInstance;
      if (!instance) return;
      if (instance.complete) {
        this.snapshotBeforeChange();
        instance.complete = false;
        this.current.updatedAt = new Date().toISOString();
        logAction("FORM", "Marked incomplete", this.activeFormType);
        return;
      }
      const problems = validateInstance(this.activeSchema, instance);
      if (problems.length) {
        this.validationProblems = problems;
        this.showValidationModal = true;
        logAction("FORM", "Mark-complete BLOCKED", problems.length + " problem(s), first: " + problems[0].label + ": " + problems[0].message);
        return;
      }
      this.snapshotBeforeChange();
      instance.complete = true;
      this.current.updatedAt = new Date().toISOString();
      logAction("FORM", "Marked complete", this.activeFormType);
    },

    layoutFor(type) {
      const schema = FORM_TYPES.find(f => f.type === type);
      return schema ? getLayout(schema, this.fieldLayouts) : null;
    },

    // ---- per-instance overlay content ("Signature & attachments") ----
    // Only overlays the Form Type Editor marked "Fill per document" show
    // up here — a "fixed" overlay (a baked-in logo/boilerplate note) is
    // type-level and never needs instance input.
    placeholderOverlays() {
      if (!this.activeFormType) return [];
      const layout = this.layoutFor(this.activeFormType);
      return layout ? layout.overlays.filter(o => o.mode === "placeholder") : [];
    },

    // `overlayData` may be missing on an instance saved before this
    // feature existed — guarded here rather than via a migration step,
    // same precedent as `complete` in "Mark complete" (see
    // PDF-gen/CLAUDE.md).
    overlayValue(overlayId) {
      const data = this.activeInstance && this.activeInstance.overlayData;
      return (data && data[overlayId]) || {};
    },

    async setInstanceOverlayImage(overlayId, file) {
      if (!file || !this.activeInstance || this.activeInstance.complete) return;
      const dataUrl = await this.readFileAsDataURL(file);
      this.snapshotBeforeChange();
      if (!this.activeInstance.overlayData) this.activeInstance.overlayData = {};
      this.activeInstance.overlayData[overlayId] = { imageB64: dataUrl };
      this.current.updatedAt = new Date().toISOString();
    },

    removeInstanceOverlayImage(overlayId) {
      if (!this.activeInstance || this.activeInstance.complete) return;
      this.snapshotBeforeChange();
      if (this.activeInstance.overlayData) delete this.activeInstance.overlayData[overlayId];
      this.current.updatedAt = new Date().toISOString();
    },

    setInstanceOverlayText(overlayId, value) {
      if (!this.activeInstance || this.activeInstance.complete) return;
      if (!this.activeInstance.overlayData) this.activeInstance.overlayData = {};
      this.activeInstance.overlayData[overlayId] = { text: value };
      this.current.updatedAt = new Date().toISOString();
    },

    async init() {
      logAction("APP", "App init started", "");
      let boot = null;
      try {
        const res = await fetch("/api/bootstrap");
        if (!res.ok) throw new Error("HTTP " + res.status);
        boot = await res.json();
      } catch (e) {
        console.error("Could not load app data from the server", e);
        this.bootstrapError = true;
        logAction("APP", "Bootstrap FAILED", e.message);
      }
      this.loadFormTypes(boot);
      this.loadRegistry(boot);
      this.load(boot);
      if (boot) logAction("APP", "Bootstrap loaded", (boot.documents ? boot.documents.length : 0) + " document(s), " + (boot.formTypes ? boot.formTypes.length : 0) + " form type(s)");
      onSyncStatus = (status) => { this.saveStatus = status; };
      window.addEventListener("beforeunload", flushAllSyncsNow);
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") flushAllSyncsNow();
      });
      this.$watch("logbooks", () => this.persistLogbooks(), { deep: true });
      this.$watch("defaults", () => this.persistDefaults(), { deep: true });
      this.$watch("fieldLayouts", () => this.persistFieldLayouts(), { deep: true });
      this.$watch("aircraftModels", () => this.persistAircraftModels(), { deep: true });
      this.$watch("documentTypes", () => this.persistDocumentTypes(), { deep: true });
      this.$watch("documentTypeForms", () => this.persistDocumentTypeForms(), { deep: true });
      this.$watch("formTypeOverrides", () => this.persistFormTypeOverrides(), { deep: true });
      this.$watch("FORM_TYPES", () => { this.persistFormTypes(); this.persistCustomFormTypes(); }, { deep: true });
      // Switching aircraft models can strand the currently-picked document
      // type (it may not be enabled for the new model at all) — back to
      // "Pick Document" rather than silently keeping a selection the
      // dropdown itself no longer offers.
      this.$watch("selectedModel", () => {
        if (!this.availableDocumentTypes().find(d => d.id === this.selectedDocType)) this.selectedDocType = "";
      });

      // Global Ctrl/Cmd+Z (undo) and Ctrl/Cmd+Shift+Z or Ctrl+Y (redo) —
      // skipped while a text input/textarea/select has focus so it doesn't
      // fight with the browser's own per-field undo while actively typing.
      window.addEventListener("keydown", (e) => {
        const tag = (e.target && e.target.tagName) || "";
        if (["INPUT", "TEXTAREA", "SELECT"].includes(tag)) return;
        if (!(e.ctrlKey || e.metaKey)) return;
        const key = e.key.toLowerCase();
        if (key === "z") {
          e.preventDefault();
          if (e.shiftKey) this.redo(); else this.undo();
        } else if (key === "y") {
          e.preventDefault();
          this.redo();
        }
      });
    },

    // Populates the built-in form-type registry from the server's
    // /api/bootstrap response (`boot.formTypes` — a real `form_types` table
    // now, see server/db.js). Failure is reported via bootstrapError
    // (init() already caught the fetch itself), so there's nothing this
    // function needs to catch on its own.
    loadFormTypes(boot) {
      if (this.FORM_TYPES.length) return; // guard against a duplicate init() call re-populating this
      // must push through the reactive `this.FORM_TYPES`, not the bare
      // module-level FORM_TYPES — Alpine (like the Vue reactivity it's
      // built on) only re-renders on mutations that go through its
      // reactive proxy; mutating the raw backing array bypasses that,
      // so the sidebar would never show the newly-loaded form types even
      // though the underlying array technically had them.
      this.FORM_TYPES.push(...((boot && boot.formTypes) || []));
      this.activeFormType = FORM_TYPES[0] ? FORM_TYPES[0].type : null;
      this.formTypesLoaded = this.FORM_TYPES.length > 0;
    },

    load(boot) {
      try {
        this.logbooks = ((boot && boot.documents) || []).map(documentFromWire);
        // Old data (saved before document types were admin-maintained)
        // carried a display string on `documentType` instead of an id on
        // `documentTypeId` — same graceful-degradation precedent as
        // `overlayData` elsewhere in this file, rather than a hard
        // migration step.
        for (const lb of this.logbooks) {
          if (!lb.documentTypeId) lb.documentTypeId = lb.documentType === "Logbook" || !lb.documentType ? "logbook" : slugify(lb.documentType);
        }
      } catch { this.logbooks = []; }
      try {
        this.defaults = ((boot && boot.defaults) || []).map(defaultFromWire);
        for (const d of this.defaults) {
          if (!d.documentTypeId) d.documentTypeId = "logbook";
          if (!d.aircraftModel) d.aircraftModel = "UH-60R";
        }
      } catch { this.defaults = []; }
      try {
        this.fieldLayouts = (boot && boot.fieldLayouts) || {};
      } catch { this.fieldLayouts = {}; }
    },

    persistLogbooks() {
      logAction("SYNC", "queue-logbooks", this.logbooks.length + " document(s)");
      queueSync("documents", "/api/documents", this.logbooks.map(documentToWire));
    },

    persistDefaults() {
      logAction("SYNC", "queue-defaults", this.defaults.length + " default(s)");
      queueSync("defaults", "/api/defaults", this.defaults.map(defaultToWire));
    },

    persistFieldLayouts() {
      logAction("SYNC", "queue-field-layouts", Object.keys(this.fieldLayouts).length + " form type(s)");
      queueSync("field-layouts", "/api/field-layouts", this.fieldLayouts);
    },

    // Seeds the admin-maintainable registry (aircraft models, document
    // types, which form types each contains and in what order, and any
    // admin-created form types/metadata overrides) from the server's
    // /api/bootstrap response (`boot`), or from this POC's original
    // hardcoded fake values if the server couldn't be reached at all.
    // Must run after loadFormTypes() resolves — the "Logbook" document
    // type's seed form-type list is read straight off FORM_TYPES so it
    // matches today's real registry order exactly instead of a second,
    // possibly-drifting hardcoded list.
    loadRegistry(boot) {
      this.aircraftModels = (boot && boot.aircraftModels && boot.aircraftModels.length)
        ? boot.aircraftModels : ["UH-60R", "UH-60M", "MH-60R", "MH-60M", "AH-64D", "AH-64E"];

      this.documentTypes = (boot && boot.documentTypes && boot.documentTypes.length) ? boot.documentTypes : [
        { id: "logbook", name: "Logbook", models: ["UH-60R"] },
        { id: "sn-book", name: "SN Book", models: [] },
        { id: "maintenance-record", name: "Maintenance Record", models: [] },
        { id: "historical-record", name: "Historical Record", models: [] },
      ];

      // Admin-created form types (schema builder — see confirmFormTypeBuilder)
      // persist to their own custom_form_types table, separate from the
      // built-in form_types table (server/db.js), which stays
      // read-only/unwritten-to from the app's side.
      try {
        const custom = (boot && boot.customFormTypes) || [];
        for (const ft of custom) if (!this.FORM_TYPES.find(f => f.type === ft.type)) this.FORM_TYPES.push(ft);
      } catch (e) { console.warn("Could not load custom form types", e); }

      this.documentTypeForms = (boot && boot.documentTypeForms) || {};
      if (!this.documentTypeForms.logbook) this.documentTypeForms.logbook = this.FORM_TYPES.map(f => f.type);

      this.formTypeOverrides = (boot && boot.formTypeOverrides) || {};
      for (const key of Object.keys(this.formTypeOverrides)) {
        const ft = this.FORM_TYPES.find(f => f.type === key);
        if (ft) Object.assign(ft, this.formTypeOverrides[key]);
      }

      // selectedDocType starts "" (Pick Document) deliberately — only heal
      // a *stale* non-empty reference (e.g. a document type deleted from
      // under an in-progress selection), never force-pick one on its own.
      if (this.selectedDocType && !this.documentTypes.find(d => d.id === this.selectedDocType)) {
        this.selectedDocType = "";
      }
    },

    persistAircraftModels() {
      logAction("SYNC", "queue-aircraft-models", this.aircraftModels.length + " model(s)");
      queueSync("aircraft-models", "/api/registry/aircraft-models", this.aircraftModels);
    },

    persistDocumentTypes() {
      logAction("SYNC", "queue-document-types", this.documentTypes.length + " type(s)");
      queueSync("document-types", "/api/registry/document-types", this.documentTypes);
    },

    persistDocumentTypeForms() {
      logAction("SYNC", "queue-document-type-forms", Object.keys(this.documentTypeForms).length + " doc type(s)");
      queueSync("document-type-forms", "/api/registry/document-type-forms", this.documentTypeForms);
    },

    persistFormTypeOverrides() {
      logAction("SYNC", "queue-form-type-overrides", Object.keys(this.formTypeOverrides).length + " override(s)");
      queueSync("form-type-overrides", "/api/registry/form-type-overrides", this.formTypeOverrides);
    },

    persistCustomFormTypes() {
      logAction("SYNC", "queue-custom-form-types", this.FORM_TYPES.filter(f => f.custom).length + " type(s)");
      queueSync("custom-form-types", "/api/registry/custom-form-types", this.FORM_TYPES.filter(f => f.custom));
    },

    // Built-in types can now also be structurally edited (Structure
    // Builder, Form Type Editor "+ Add field"/"+ Add table") — this is the
    // write side of that, syncing to the same form_types table server/db.js
    // seeded once from form-types.json. Same deep FORM_TYPES watch as
    // persistCustomFormTypes above, just the complementary filter.
    persistFormTypes() {
      logAction("SYNC", "queue-form-types", this.FORM_TYPES.filter(f => !f.custom).length + " type(s)");
      queueSync("form-types", "/api/registry/form-types", this.FORM_TYPES.filter(f => !f.custom));
    },

    // Only documents matching the currently-selected aircraft model +
    // document type — needed now that `logbooks` can hold documents of
    // more than one document type at once (e.g. a UH-60R Logbook and a
    // UH-60R Blades record shouldn't appear mixed in the same list).
    documentsForSelection() {
      return this.logbooks.filter(l => l.aircraftModel === this.selectedModel && l.documentTypeId === this.selectedDocType);
    },

    defaultsForSelection() {
      return this.defaults.filter(d => d.aircraftModel === this.selectedModel && d.documentTypeId === this.selectedDocType);
    },

    sortedLogbooks() {
      return this.documentsForSelection().slice().sort((a, b) => b.updatedAt.localeCompare(a.updatedAt));
    },

    // A logbook is complete only once every form instance of every form
    // type it contains has been individually marked complete — matches
    // "Mark complete" being an instance-level action (see toggleComplete).
    // A document type with zero form types assigned yet (e.g. a freshly
    // created one, before "assign & sort" runs) has nothing to complete.
    isLogbookComplete(lb) {
      const types = this.formTypesFor(lb.documentTypeId);
      return types.length > 0 && types.every(ft => (lb[formTypeKey(ft.type)] || []).every(inst => inst.complete));
    },

    formatDate(iso) {
      try { return new Date(iso).toLocaleString(); } catch { return iso; }
    },

    defaultSummary(d) {
      return this.formTypesFor(d.documentTypeId)
        .map(ft => (d.forms[formTypeKey(ft.type)] || []).length + ' × ' + ft.type)
        .join(', ');
    },

    clearPreview() {
      lastPreviewBytes = null;
      this.previewGenerated = false;
      if (this.$refs.previewPages) this.$refs.previewPages.innerHTML = "";
    },

    // ---- new logbook modal ----
    openNewModal() {
      this.newTailNumber = "";
      this.newSource = "blank";
      this.showNewModal = true;
      this.$nextTick(() => this.$refs.tailInput && this.$refs.tailInput.focus());
    },

    confirmCreateLogbook() {
      const tail = this.newTailNumber.trim();
      if (!tail) return;
      const docTypeId = this.selectedDocType;
      const types = this.formTypesFor(docTypeId);
      let forms;
      if (this.newSource === "blank") {
        forms = emptyLogbookForms(types);
      } else {
        const d = this.defaults.find(x => x.id === this.newSource);
        forms = d ? cloneLogbookForms(d.forms, types) : emptyLogbookForms(types);
        if (d) logAction("DEFAULT", "Applied default", d.name);
      }
      const lb = emptyLogbook(tail, forms, docTypeId, this.selectedModel, types);
      this.logbooks.push(lb);
      this.showNewModal = false;
      logAction("DOC", "Created document", lb.tailNumber + " (" + lb.id + ")");
      this.openLogbook(lb.id);
    },

    // ---- save as default modal ----
    openSaveDefaultModal() {
      this.newDefaultName = "";
      this.showSaveDefaultModal = true;
      this.$nextTick(() => this.$refs.defaultNameInput && this.$refs.defaultNameInput.focus());
    },

    confirmSaveDefault() {
      const name = this.newDefaultName.trim();
      if (!name || !this.current) return;
      this.defaults.push({
        id: uid(),
        name,
        documentTypeId: this.current.documentTypeId,
        aircraftModel: this.current.aircraftModel,
        createdAt: new Date().toISOString(),
        forms: cloneLogbookForms(this.current, this.formTypesFor(this.current.documentTypeId)),
      });
      this.showSaveDefaultModal = false;
      logAction("DEFAULT", "Saved default", name);
    },

    // ---- automate form entry modal ----
    openAutomateModal() {
      if (!this.activeInstance || this.activeInstance.complete) return;
      this.automateSteps = [
        { key: "request", label: "Sending request to external data source", status: "pending" },
        { key: "response", label: "Waiting for response", status: "pending" },
        { key: "parsing", label: "Parsing response data", status: "pending" },
        { key: "entry", label: "Populating form fields", status: "pending" },
      ];
      this.automateDone = false;
      this.showAutomateModal = true;
      logAction("AUTOFILL", "Automate-entry modal opened", this.activeFormType);
      this.runAutomateWorkflow();
    },

    async runAutomateWorkflow() {
      logAction("AUTOFILL", "Auto-fill started", this.activeFormType);
      const delays = [650, 550, 500, 450];
      for (let i = 0; i < this.automateSteps.length; i++) {
        this.automateSteps[i].status = "active";
        await new Promise(resolve => setTimeout(resolve, delays[i]));
        this.automateSteps[i].status = "done";
      }

      const schema = this.activeSchema;
      const instance = this.activeInstance;
      if (schema && instance && schema.sampleData) {
        this.snapshotBeforeChange();
        const data = schema.sampleData; // plain data loaded from the server, not a function
        Object.assign(instance.header, data.header);
        // Only tables sampleData actually supplies rows for get replaced —
        // a fixed-count table like a verification/signature log isn't
        // something a real external data source would ever populate, so
        // sampleData simply omits it and the empty slots stay as-is.
        for (const table of tableSectionsOf(schema)) {
          const rowsData = data[table.rowsKey];
          if (rowsData) instance[table.rowsKey] = rowsData.map(r => ({ ...r, id: uid() }));
        }
        this.current.updatedAt = new Date().toISOString();
      }
      this.automateDone = true;
      logAction("AUTOFILL", "Auto-fill completed", this.activeFormType);
    },

    closeAutomateModal() {
      this.showAutomateModal = false;
    },

    deleteDefault(id) {
      if (!confirm("Delete this default? This cannot be undone.")) return;
      const d = this.defaults.find(x => x.id === id);
      this.defaults = this.defaults.filter(d => d.id !== id);
      if (this.newSource === id) this.newSource = "blank";
      logAction("DEFAULT", "Deleted default", d ? d.name : id);
    },

    // ---- logbook selection ----
    openLogbook(id) {
      this.currentId = id;
      const lb = this.logbooks.find(l => l.id === id);
      const types = lb ? this.formTypesFor(lb.documentTypeId) : [];
      this.activeFormType = types[0] ? types[0].type : null;
      this.activeInstanceId = (lb && this.activeFormType) ? ((lb[formTypeKey(this.activeFormType)] || [])[0]?.id ?? null) : null;
      this.previewPanelOpen = false;
      this.clearPreview();
      if (lb) logAction("DOC", "Opened document", lb.tailNumber + " (" + lb.id + ")");
    },

    // ---- form instance selection (sidebar "Forms in this document") ----
    openFormInstance(type, instanceId) {
      if (this.activeFormType === type && this.activeInstanceId === instanceId) return;
      logAction("FORM", "Opened form instance", type + " (" + instanceId + ")");
      this.activeFormType = type;
      this.activeInstanceId = instanceId;
      this.previewPanelOpen = false;
      this.clearPreview();
    },

    addFormInstance(type) {
      if (!this.current) return;
      this.snapshotBeforeChange();
      const ft = FORM_TYPES.find(f => f.type === type);
      const key = formTypeKey(type);
      // A form type assigned to this document type *after* an existing
      // document was created never got this key seeded (emptyLogbookForms
      // only initializes an array per form type at document-creation time)
      // — "Forms in this document" still lists it (formTypesInCurrent()
      // reads the document type's current assignment, not the document's
      // own data), so "+" here needs to lazily create the array on first
      // use rather than assume it already exists.
      if (!this.current[key]) this.current[key] = [];
      const list = this.current[key];
      const instance = emptyInstance(ft);
      list.push(instance);
      this.current.updatedAt = new Date().toISOString();
      logAction("FORM", "Added form instance", type + " (now " + list.length + ")");
      this.openFormInstance(type, instance.id);
    },

    deleteFormInstance(type, instanceId) {
      if (!this.current) return;
      const list = this.current[formTypeKey(type)] || [];
      if (list.length <= 1) {
        alert("A logbook needs at least one instance of each form type.");
        return;
      }
      if (!confirm("Delete this form instance? This cannot be undone.")) return;
      this.snapshotBeforeChange();
      const idx = list.findIndex(i => i.id === instanceId);
      if (idx === -1) return;
      list.splice(idx, 1);
      this.current.updatedAt = new Date().toISOString();
      logAction("FORM", "Deleted form instance", type + " (" + instanceId + ")");
      if (this.activeFormType === type && this.activeInstanceId === instanceId) {
        this.openFormInstance(type, list[0].id);
      }
    },

    deleteLogbook(id) {
      if (!confirm("Delete this logbook? This cannot be undone.")) return;
      const lb = this.logbooks.find(l => l.id === id);
      this.logbooks = this.logbooks.filter(l => l.id !== id);
      delete this.undoStacks[id];
      delete this.redoStacks[id];
      if (this.currentId === id) {
        this.currentId = null;
        this.previewPanelOpen = false;
        this.clearPreview();
      }
      logAction("DOC", "Deleted document", (lb ? lb.tailNumber : "") + " (" + id + ")");
    },

    // ---- undo/redo, scoped to the currently open logbook ----
    snapshotBeforeChange() {
      if (!this.current) return;
      const id = this.currentId;
      const stack = this.undoStacks[id] || (this.undoStacks[id] = []);
      stack.push(JSON.parse(JSON.stringify(this.current)));
      if (stack.length > 100) stack.shift();
      this.redoStacks[id] = [];
      logAction("UNDO", "Snapshot saved", id);
    },

    canUndo() {
      const stack = this.undoStacks[this.currentId];
      return !!(stack && stack.length);
    },

    canRedo() {
      const stack = this.redoStacks[this.currentId];
      return !!(stack && stack.length);
    },

    undo() {
      if (!this.canUndo()) return;
      const id = this.currentId;
      const prev = this.undoStacks[id].pop();
      (this.redoStacks[id] || (this.redoStacks[id] = [])).push(JSON.parse(JSON.stringify(this.current)));
      this.applyRestoredLogbook(prev);
      logAction("UNDO", "Undo", id);
    },

    redo() {
      if (!this.canRedo()) return;
      const id = this.currentId;
      const next = this.redoStacks[id].pop();
      (this.undoStacks[id] || (this.undoStacks[id] = [])).push(JSON.parse(JSON.stringify(this.current)));
      this.applyRestoredLogbook(next);
      logAction("UNDO", "Redo", id);
    },

    applyRestoredLogbook(snapshot) {
      const idx = this.logbooks.findIndex(l => l.id === this.currentId);
      if (idx === -1) return;
      this.logbooks[idx] = snapshot;
      const list = snapshot[formTypeKey(this.activeFormType)] || [];
      if (!list.find(i => i.id === this.activeInstanceId)) {
        this.activeInstanceId = list[0] ? list[0].id : null;
      }
      this.clearPreview();
    },

    // opens the right-hand panel and (re)generates the preview into it —
    // the panel is only ever shown via this action, per the "only display
    // the right panel on Print Preview" requirement.
    async showPrintPreview() {
      this.previewPanelOpen = true;
      await this.regeneratePreview();
    },

    addRow(section) {
      const form = this.activeInstance;
      if (!form || form.complete || section.fixedRows) return;
      this.snapshotBeforeChange();
      // A table added to this form type's structure *after* this instance
      // already existed (see the admin Form Type Builder's structure
      // editor) won't have this rowsKey seeded yet — lazily initialize
      // rather than crash. Every other row mutator only ever fires from a
      // rendered row/drag target, which can't exist yet in that same case.
      (form[section.rowsKey] || (form[section.rowsKey] = [])).push(emptyRowFor(section));
      this.current.updatedAt = new Date().toISOString();
      logAction("ROW", "Added row", section.rowsKey + " (now " + form[section.rowsKey].length + ")");
    },

    removeRow(section, idx) {
      const form = this.activeInstance;
      if (!form || form.complete || section.fixedRows) return;
      this.snapshotBeforeChange();
      const rows = form[section.rowsKey];
      rows.splice(idx, 1);
      if (rows.length === 0) rows.push(emptyRowFor(section));
      this.current.updatedAt = new Date().toISOString();
      logAction("ROW", "Removed row", section.rowsKey + " #" + idx);
    },

    duplicateRow(section, idx) {
      const form = this.activeInstance;
      if (!form || form.complete || section.fixedRows) return;
      this.snapshotBeforeChange();
      const rows = form[section.rowsKey];
      const copy = { ...rows[idx], id: uid() };
      rows.splice(idx + 1, 0, copy);
      this.current.updatedAt = new Date().toISOString();
      logAction("ROW", "Duplicated row", section.rowsKey + " #" + idx);
    },

    dragStart(idx) {
      this.dragIndex = idx;
    },

    dropRow(section, targetIdx) {
      if (this.dragIndex === null || this.dragIndex === targetIdx) { this.dragIndex = null; return; }
      const form = this.activeInstance;
      if (!form || form.complete || section.fixedRows) { this.dragIndex = null; return; }
      this.snapshotBeforeChange();
      const rows = form[section.rowsKey];
      const fromIdx = this.dragIndex;
      const [moved] = rows.splice(this.dragIndex, 1);
      rows.splice(targetIdx, 0, moved);
      this.dragIndex = null;
      this.current.updatedAt = new Date().toISOString();
      logAction("ROW", "Reordered row", section.rowsKey + " " + fromIdx + " -> " + targetIdx);
    },

    async regeneratePreview() {
      if (!this.activeInstance) return;
      if (!this.hasTemplate(this.activeSchema)) {
        alert("This form type has no PDF template yet — data entry works, but PDF preview/export isn't available until a template is uploaded (a later phase).");
        return;
      }
      this.generating = true;
      logAction("EXPORT", "Generating preview", this.activeFormType);
      try {
        const bytes = await buildFilledPdfGeneric(this.activeSchema, this.activeInstance, this.layoutFor(this.activeFormType));
        lastPreviewBytes = bytes;
        await renderPreviewPages(this.$refs.previewPages, bytes);
        this.previewGenerated = true;
        logAction("EXPORT", "Generated preview", this.activeFormType);
      } catch (e) {
        console.error(e);
        alert("Could not generate the PDF preview — see console for details.");
        logAction("EXPORT", "Preview FAILED", this.activeFormType + ": " + e.message);
      } finally {
        this.generating = false;
      }
    },

    openPreviewPdf() {
      if (!lastPreviewBytes) return;
      openBytesInNewWindow(lastPreviewBytes);
      logAction("EXPORT", "Opened PDF in new tab", this.activeFormType);
    },

    // drag-to-resize the preview panel from its left edge — dragging left
    // (mouse moving toward smaller clientX) widens the panel, since it's
    // anchored to the right side of the window.
    startPreviewResize(e) {
      e.preventDefault();
      const startX = e.clientX;
      const startWidth = this.previewWidth;
      this.resizingPreview = true;
      const prevUserSelect = document.body.style.userSelect;
      document.body.style.userSelect = "none";

      const onMove = (ev) => {
        const delta = startX - ev.clientX;
        this.previewWidth = Math.min(900, Math.max(260, startWidth + delta));
      };
      const onUp = () => {
        this.resizingPreview = false;
        document.body.style.userSelect = prevUserSelect;
        document.removeEventListener("mousemove", onMove);
        document.removeEventListener("mouseup", onUp);
      };
      document.addEventListener("mousemove", onMove);
      document.addEventListener("mouseup", onUp);
    },

    // "Export All" — every form instance in this logbook, merged into one
    // PDF, rendered into the preview panel and then immediately opened in a
    // new tab (the same action "Open PDF" performs for a single instance),
    // so exporting the whole document is one click instead of two.
    async exportAll() {
      if (!this.current) return;
      const types = this.formTypesFor(this.current.documentTypeId);
      if (!types.length) {
        alert("This document type has no form types assigned yet — nothing to export.");
        return;
      }
      if (!types.some(ft => ft.templateB64)) {
        alert("No form type in this document has a PDF template yet — nothing to export.");
        return;
      }
      logAction("EXPORT", "Export All started", this.current.tailNumber);
      this.previewPanelOpen = true;
      this.generating = true;
      try {
        const bytes = await buildCombinedPdf(this.current, this.fieldLayouts, types);
        lastPreviewBytes = bytes;
        await renderPreviewPages(this.$refs.previewPages, bytes);
        this.previewGenerated = true;
        this.openPreviewPdf();
        const instanceCount = types.reduce((sum, ft) => sum + (this.current[formTypeKey(ft.type)] || []).length, 0);
        logAction("EXPORT", "Export All completed", instanceCount + " instance(s) merged");
      } catch (e) {
        console.error(e);
        alert("Could not generate the combined PDF — see console for details.");
        logAction("EXPORT", "Export All FAILED", this.current.tailNumber + ": " + e.message);
      } finally {
        this.generating = false;
      }
    },

    // ================= Form Type Editor =================

    cloneLayout(layout) {
      return JSON.parse(JSON.stringify(layout));
    },

    openEditorModal(type) {
      const schema = FORM_TYPES.find(f => f.type === type);
      if (!schema) return;
      this.editorFormType = type;
      this.editorPageIndex = 0;
      this.editorLabels = { header: {}, col: {}, table: {} };
      // Field type + type-specific options (max characters / decimal
      // places / date output format) — same round-trip pattern as
      // editorLabels: seeded from the schema's current `validation` here,
      // edited in the properties panel, reconciled back into
      // schema.sections on Save (see reconcileFormTypeFields/Tables and
      // the new reconcilePrimaryTableColumns).
      this.editorValidation = { header: {}, col: {} };
      // No section-title prefix baked into editorLabels, for ANY type —
      // every type's table columns are already visually grouped by table in
      // the field list (see editorTableGroups), so a baked-in text prefix
      // would be redundant on screen and, worse, permanently written back
      // into the schema's own field/column labels next Save
      // (reconcileFormTypeFields/Tables round-trip this same map back
      // into schema.sections for every type now — see confirmSaveEditor).
      // This used to be built-in-type-only text (e.g. DA 2408-17's
      // "Verification — Sig 1"); removed once reconciliation itself became
      // universal, to avoid re-baking a stale prefix into a built-in type's
      // real labels the same way this project already fixed for tables
      // (see history.md).
      for (const section of schema.sections) {
        if (section.kind === "fields") {
          for (const f of section.fields) {
            this.editorLabels.header[f.key] = f.label || f.key;
            this.editorValidation.header[f.key] = { ...(f.validation || {}) };
          }
        } else if (section.kind === "table") {
          this.editorLabels.table[section.rowsKey] = section.title || section.rowsKey;
          for (const c of section.columns) {
            this.editorLabels.col[c.key] = c.label;
            this.editorValidation.col[c.key] = { ...(c.validation || {}) };
          }
        }
      }
      this.editorDraft = this.cloneLayout(getLayout(schema, this.fieldLayouts));
      this.editorSelectedKind = null;
      this.editorSelectedKey = null;
      this.showEditorModal = true;
      this.$nextTick(() => this.renderEditorPage());
    },

    switchEditorPage(idx) {
      this.editorPageIndex = idx;
      this.$nextTick(() => this.renderEditorPage());
    },

    // Add/remove a header field box directly in the editor — works for any
    // form type, built-in or custom (see reconcileFormTypeFields below
    // for how this feeds back into the schema's own `sections` on Save,
    // and confirmSaveEditor for why every type reconciles this way now).
    addEditorHeaderField() {
      if (!this.editorDraft || !this.editorSchema) return;
      const key = uniqueId("field", Object.keys(this.editorDraft.header));
      this.editorDraft.header[key] = placeholderFieldSpec(this.editorPageIndex);
      this.editorLabels.header[key] = "New field";
      this.editorValidation.header[key] = {};
      this.selectEditorField("header", key);
    },

    removeEditorHeaderField(key) {
      if (!this.editorDraft || !this.editorSchema) return;
      delete this.editorDraft.header[key];
      delete this.editorLabels.header[key];
      delete this.editorValidation.header[key];
      if (this.editorSelectedKind === "header" && this.editorSelectedKey === key) {
        this.editorSelectedKind = null;
        this.editorSelectedKey = null;
      }
    },

    // Add/remove a whole table (or one of its columns) directly in the
    // editor — works for any form type, same as the header field add/remove
    // above. A table added here is always a fixed-row
    // "extra" table (the shape DA 2408-17's Verification/Remarks lists
    // already use, see "Multi-table support" in PDF-gen/CLAUDE.md), never
    // the primary growable table — that stays special-cased throughout the
    // fill engine (row-overflow onto extra physical copies), and the
    // Structure Builder ("+ New form type" / "Edit") already handles
    // starting one from nothing. `reconcileFormTypeTables` (see
    // confirmSaveEditor) syncs these back into the schema's own `sections`
    // on Save, same as reconcileFormTypeFields does for header keys.
    addEditorTable() {
      if (!this.editorDraft || !this.editorSchema) return;
      const existingKeys = (this.editorDraft.extraTables || []).map(t => t.rowsKey);
      const rowsKey = uniqueId("table", existingKeys);
      // Title must be unique against every other table's title, not just
      // rowsKey — the main document view's schema-section renderer keys its
      // x-for on section.title (see tableCandidatesToLayout's comment for
      // the real incident this caused: two same-titled tables crash Alpine's
      // reactivity for the whole page, not just this form type).
      const existingTitles = Object.values(this.editorLabels.table);
      let title = "New table", n = 2;
      while (existingTitles.includes(title)) title = "New table " + (n++);
      const table = {
        rowsKey, title, maxRows: 5,
        page1: this.editorPageIndex === 0 ? { rows: 5, startY: 700, spacing: 20 } : { rows: 0, startY: 700, spacing: 20 },
        page2: this.editorPageIndex === 1 ? { rows: 5, startY: 700, spacing: 20 } : { rows: 0, startY: 700, spacing: 20 },
        cols: {},
      };
      if (!this.editorDraft.extraTables) this.editorDraft.extraTables = [];
      this.editorDraft.extraTables.push(table);
      this.editorLabels.table[rowsKey] = table.title;
      this.addEditorTableColumn(rowsKey);
    },

    removeEditorTable(rowsKey) {
      if (!this.editorDraft || !this.editorSchema) return;
      if (!confirm('Remove this table and all its columns?')) return;
      const table = (this.editorDraft.extraTables || []).find(t => t.rowsKey === rowsKey);
      this.editorDraft.extraTables = (this.editorDraft.extraTables || []).filter(t => t.rowsKey !== rowsKey);
      delete this.editorLabels.table[rowsKey];
      if (table) for (const key of Object.keys(table.cols)) { delete this.editorLabels.col[key]; delete this.editorValidation.col[key]; }
      if (this.editorSelectedKind === "col" && table && table.cols[this.editorSelectedKey]) {
        this.editorSelectedKind = null;
        this.editorSelectedKey = null;
      }
    },

    addEditorTableColumn(rowsKey) {
      if (!this.editorDraft || !this.editorSchema) return;
      const table = (this.editorDraft.extraTables || []).find(t => t.rowsKey === rowsKey);
      if (!table) return;
      const key = uniqueId("col", Object.keys(this.editorDraft.cols).concat(Object.keys(table.cols)));
      table.cols[key] = placeholderColumnSpec();
      this.editorLabels.col[key] = "New column";
      this.editorValidation.col[key] = {};
      this.selectEditorField("col", key);
    },

    removeEditorTableColumn(rowsKey, key) {
      if (!this.editorDraft || !this.editorSchema) return;
      const table = (this.editorDraft.extraTables || []).find(t => t.rowsKey === rowsKey);
      if (!table) return;
      delete table.cols[key];
      delete this.editorLabels.col[key];
      delete this.editorValidation.col[key];
      if (this.editorSelectedKind === "col" && this.editorSelectedKey === key) {
        this.editorSelectedKind = null;
        this.editorSelectedKey = null;
      }
    },

    async renderEditorPage() {
      const schema = this.editorSchema;
      const canvas = this.$refs.editorCanvas;
      if (!schema || !canvas) return;
      const bytes = b64ToBytes(schema.templateB64);
      const loadingTask = pdfjsLib.getDocument({ data: bytes.slice() });
      const pdf = await loadingTask.promise;
      // The "Front page"/"Back page" tabs are always offered regardless of
      // how many pages the attached template actually has — a custom
      // type's template is very often a single page (a blank background,
      // or one uploaded page) — clamp rather than let pdf.js throw on an
      // out-of-range page number.
      const pageNum = Math.min(this.editorPageIndex + 1, pdf.numPages);
      const page = await pdf.getPage(pageNum);
      const viewport = page.getViewport({ scale: this.editorScale });
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
    },

    // Finds the object holding a table column's spec by key — either the
    // primary (growable, page1/page2) table's `cols`, or one of the
    // fixed-count `extraTables`' own `cols`. Column keys are unique across
    // a schema's table sections by convention, so a flat key lookup is
    // enough; this is what lets a fixed-count extra table (e.g. DA
    // 2408-17's Verification log) reuse every existing 'col'-kind editor
    // interaction (select/drag/resize) with no separate box kind.
    findColBucket(draft, key) {
      if (draft.cols[key]) return draft.cols;
      for (const table of draft.extraTables || []) if (table.cols[key]) return table.cols;
      return null;
    },

    findExtraTableForColKey(draft, key) {
      return (draft.extraTables || []).find(t => t.cols[key]) || null;
    },

    editorBoxesForCurrentPage() {
      const draft = this.editorDraft;
      if (!draft) return [];
      const boxes = [];
      for (const key of Object.keys(draft.header)) {
        const spec = draft.header[key];
        if (spec.page !== this.editorPageIndex) continue;
        boxes.push({ kind: "header", key, label: this.editorLabels.header[key] || key, x: spec.x, y: spec.y, width: spec.width, fontSize: spec.fontSize, fontFamily: spec.fontFamily, bold: spec.bold, italic: spec.italic });
      }
      const grid = this.editorPageIndex === 0 ? draft.page1 : draft.page2;
      for (const key of Object.keys(draft.cols)) {
        const spec = draft.cols[key];
        boxes.push({ kind: "col", key, label: this.editorLabels.col[key] || key, x: spec.x, y: grid.startY + (spec.yOffset || 0), width: spec.width, fontSize: spec.fontSize, fontFamily: spec.fontFamily, bold: spec.bold, italic: spec.italic });
      }
      for (const table of draft.extraTables || []) {
        const tableGrid = this.editorPageIndex === 0 ? table.page1 : table.page2;
        for (const key of Object.keys(table.cols)) {
          const spec = table.cols[key];
          boxes.push({ kind: "col", key, label: this.editorLabels.col[key] || key, x: spec.x, y: tableGrid.startY + (spec.yOffset || 0), width: spec.width, fontSize: spec.fontSize, fontFamily: spec.fontFamily, bold: spec.bold, italic: spec.italic });
        }
      }
      for (const ov of draft.overlays || []) {
        if (ov.page !== this.editorPageIndex) continue;
        boxes.push({
          kind: "overlay", key: ov.id, overlayKind: ov.kind,
          label: ov.label || (ov.kind === "image" ? "Image" : "Text box"),
          x: ov.x, y: ov.y, width: ov.width, height: ov.height, fontSize: ov.fontSize,
          fontFamily: ov.fontFamily, bold: ov.bold, italic: ov.italic,
        });
      }
      return boxes;
    },

    // Converts a field's PDF-point box into on-canvas CSS pixels. PDF's
    // origin is bottom-left; the canvas/DOM origin is top-left, so the
    // vertical axis is flipped here — this is the one piece of math the
    // whole drag/resize interaction depends on getting right. An image
    // overlay's (x, y) is pdf-lib drawImage's bottom-left corner, so its
    // on-canvas top is offset by its own full height; every other box
    // kind (text-based) keeps the original fontSize-derived offset.
    // Maps a field's real fill-engine font (see the "Font" select's own
    // options — Helvetica/TimesRoman/Courier, pdf-lib's StandardFonts names)
    // to a CSS font stack, so the editor's on-canvas label reads in
    // something close to the actual family it will print in, not just a
    // generic UI font.
    editorCssFontFamily(fontFamily) {
      if (fontFamily === "TimesRoman") return "'Times New Roman', Times, serif";
      if (fontFamily === "Courier") return "'Courier New', Courier, monospace";
      return "Helvetica, Arial, sans-serif";
    },

    editorBoxStyle(box) {
      const scale = this.editorScale;
      const isImage = box.kind === "overlay" && box.overlayKind === "image";
      const fontSize = box.fontSize || 8;
      const boxHeight = isImage ? (box.height || 40) : fontSize * 1.6;
      const topOffset = isImage ? boxHeight : fontSize * 1.2;
      const left = box.x * scale;
      const top = (792 - box.y - topOffset) * scale;
      const width = (box.width || 40) * scale;
      const height = boxHeight * scale;
      const cssFontSize = Math.max(9, fontSize * scale * 0.85);
      const fontFamily = this.editorCssFontFamily(box.fontFamily);
      const fontWeight = box.bold ? "700" : "400";
      const fontStyle = box.italic ? "italic" : "normal";
      return `left:${left}px; top:${top}px; width:${width}px; height:${height}px; `
        + `font-size:${cssFontSize}px; font-family:${fontFamily}; font-weight:${fontWeight}; font-style:${fontStyle};`;
    },

    selectEditorField(kind, key) {
      this.editorSelectedKind = kind;
      this.editorSelectedKey = key;
      if (kind === "header" && this.editorDraft) {
        const page = this.editorDraft.header[key].page;
        if (page !== this.editorPageIndex) this.switchEditorPage(page);
      } else if (kind === "overlay" && this.editorDraft) {
        const ov = this.overlayByKey(key);
        if (ov && ov.page !== this.editorPageIndex) this.switchEditorPage(ov.page);
      }
    },

    overlayByKey(id) {
      return this.editorDraft ? (this.editorDraft.overlays || []).find(o => o.id === id) || null : null;
    },

    editorSelectedSpec() {
      if (!this.editorDraft || !this.editorSelectedKind || !this.editorSelectedKey) return null;
      if (this.editorSelectedKind === "overlay") return this.overlayByKey(this.editorSelectedKey);
      const bucket = this.editorSelectedKind === "header" ? this.editorDraft.header : this.findColBucket(this.editorDraft, this.editorSelectedKey);
      return (bucket && bucket[this.editorSelectedKey]) || null;
    },

    // The selected field's data-type spec (type/maxLength/decimals/
    // dateFormat) — null for anything that isn't a real schema field
    // (an overlay has no validation concept). Mutating the object this
    // returns updates editorValidation.header/col in place, same pattern
    // as editorSelectedSpec for position/style.
    editorSelectedValidation() {
      if (!this.editorSelectedKind || !this.editorSelectedKey) return null;
      if (this.editorSelectedKind !== "header" && this.editorSelectedKind !== "col") return null;
      const bucket = this.editorValidation[this.editorSelectedKind];
      if (!bucket[this.editorSelectedKey]) bucket[this.editorSelectedKey] = {};
      return bucket[this.editorSelectedKey];
    },

    editorSelectedLabel() {
      if (!this.editorSelectedKind || !this.editorSelectedKey) return "";
      if (this.editorSelectedKind === "overlay") {
        const ov = this.overlayByKey(this.editorSelectedKey);
        return (ov && ov.label) || (ov && ov.kind === "image" ? "Image" : "Text box") || "";
      }
      return this.editorLabels[this.editorSelectedKind][this.editorSelectedKey] || this.editorSelectedKey;
    },

    // The whole table object backing whichever 'col' box is selected — its
    // own extraTables entry for a fixed-count table, or editorDraft itself
    // for the primary table (both carry page1/page2/maxRows in the same
    // shape — see getLayout/normalizeExtraTable — so editorDraft doubles as
    // "the primary table's own record" with no separate wrapper needed;
    // mutating .page1.rows/.page2.rows/.maxRows here writes straight back
    // into whichever one it is). Null when nothing 'col'-shaped is selected.
    editorCurrentTable() {
      if (!this.editorDraft || this.editorSelectedKind !== "col" || !this.editorSelectedKey) return null;
      const extra = this.findExtraTableForColKey(this.editorDraft, this.editorSelectedKey);
      if (extra) return extra;
      if (this.editorDraft.cols[this.editorSelectedKey]) return this.editorDraft;
      return null;
    },

    // Whether the selected column belongs to the primary (growable) table
    // rather than a fixed-count extra one — drives which explanation the
    // properties panel shows under "Total rows per instance".
    editorSelectedIsPrimaryTable() {
      return !!(this.editorDraft && this.editorSelectedKind === "col" && this.editorSelectedKey
        && this.editorDraft.cols[this.editorSelectedKey] && !this.findExtraTableForColKey(this.editorDraft, this.editorSelectedKey));
    },

    // The row grid backing whichever 'col' box is selected, for the CURRENT
    // page tab — the primary table's page1/page2, or a fixed-count extra
    // table's own page1/page2 (mutating it here mutates
    // editorDraft.extraTables[i].page1/page2 in place, same as the
    // schema-level page1/page2). Each table carries its own page1/page2
    // pair (see normalizeExtraTable) so its rows can split front-to-back,
    // instead of being confined to whichever single page it was first
    // placed on.
    editorCurrentGrid() {
      if (!this.editorDraft) return { startY: 0, spacing: 0, rows: 0 };
      const pageKey = this.editorPageIndex === 0 ? "page1" : "page2";
      const table = this.editorCurrentTable();
      return table ? table[pageKey] : this.editorDraft[pageKey];
    },

    startBoxDrag(e, box) {
      e.preventDefault();
      const startX = e.clientX, startY = e.clientY;
      const origX = box.x, origY = box.y;
      const colBucket = box.kind === "col" ? this.findColBucket(this.editorDraft, box.key) : null;
      const origYOffset = colBucket ? (colBucket[box.key].yOffset || 0) : 0;
      const scale = this.editorScale;
      const onMove = (ev) => {
        const dx = (ev.clientX - startX) / scale;
        const dy = (ev.clientY - startY) / scale; // canvas-down is positive; PDF-up is positive, so flip below
        if (box.kind === "header" || box.kind === "overlay") {
          const spec = box.kind === "header" ? this.editorDraft.header[box.key] : this.overlayByKey(box.key);
          spec.x = Math.round((origX + dx) * 10) / 10;
          spec.y = Math.round((origY - dy) * 10) / 10;
        } else {
          const bucket = this.findColBucket(this.editorDraft, box.key);
          const spec = bucket[box.key];
          spec.x = Math.round((origX + dx) * 10) / 10;
          if (spec.independentY) {
            // This column opted out of following its table's shared row
            // grid (see "Move independently" below) — vertical drag
            // adjusts its own yOffset instead of the whole table's
            // startY, so it can sit on a different line than the rest of
            // the row (e.g. DA 2408-17's Item No./Nomenclature sitting
            // above that row's 12 check-number columns).
            spec.yOffset = Math.round((origYOffset - dy) * 10) / 10;
          } else {
            const pageKey = this.editorPageIndex === 0 ? "page1" : "page2";
            const extra = this.findExtraTableForColKey(this.editorDraft, box.key);
            const grid = extra ? extra[pageKey] : this.editorDraft[pageKey];
            grid.startY = Math.round((origY - dy) * 10) / 10;
          }
        }
      };
      const onUp = () => {
        document.removeEventListener("mousemove", onMove);
        document.removeEventListener("mouseup", onUp);
      };
      document.addEventListener("mousemove", onMove);
      document.addEventListener("mouseup", onUp);
    },

    startBoxResize(e, box) {
      e.preventDefault();
      const startX = e.clientX;
      const origWidth = box.width || 40;
      const scale = this.editorScale;
      const bucket = box.kind === "header" ? this.editorDraft.header : box.kind === "col" ? this.findColBucket(this.editorDraft, box.key) : null;
      const onMove = (ev) => {
        const dx = (ev.clientX - startX) / scale;
        const newWidth = Math.max(8, Math.round((origWidth + dx) * 10) / 10);
        if (box.kind === "overlay") this.overlayByKey(box.key).width = newWidth;
        else bucket[box.key].width = newWidth;
      };
      const onUp = () => {
        document.removeEventListener("mousemove", onMove);
        document.removeEventListener("mouseup", onUp);
      };
      document.addEventListener("mousemove", onMove);
      document.addEventListener("mouseup", onUp);
    },

    // Bottom-edge drag, image overlays only — adjusts height, the one
    // dimension a text-based box never needs (its height is always
    // derived from font size).
    startBoxResizeHeight(e, box) {
      e.preventDefault();
      const startY = e.clientY;
      const origHeight = box.height || 40;
      const scale = this.editorScale;
      const spec = this.overlayByKey(box.key);
      const onMove = (ev) => {
        const dy = (ev.clientY - startY) / scale;
        spec.height = Math.max(8, Math.round((origHeight + dy) * 10) / 10);
      };
      const onUp = () => {
        document.removeEventListener("mousemove", onMove);
        document.removeEventListener("mouseup", onUp);
      };
      document.addEventListener("mousemove", onMove);
      document.addEventListener("mouseup", onUp);
    },

    // Reads a File as a data URL (e.g. "data:image/png;base64,...") — the
    // form pdf-lib's embedPng/embedJpg and an <img src> preview both want.
    readFileAsDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(file);
      });
    },

    async addImageOverlay(file) {
      if (!file || !this.editorDraft) return;
      const imageB64 = await this.readFileAsDataURL(file);
      const overlay = {
        id: uid(), kind: "image", mode: "fixed", page: this.editorPageIndex,
        x: 40, y: 40, width: 120, height: 50, label: "Image", imageB64,
      };
      this.editorDraft.overlays.push(overlay);
      this.selectEditorField("overlay", overlay.id);
    },

    addTextOverlay() {
      if (!this.editorDraft) return;
      const overlay = {
        id: uid(), kind: "text", mode: "fixed", page: this.editorPageIndex,
        x: 40, y: 40, width: 150, fontSize: 10, fontFamily: "Helvetica",
        bold: false, italic: false, allowOverflow: true, label: "Text box", text: "New text",
      };
      this.editorDraft.overlays.push(overlay);
      this.selectEditorField("overlay", overlay.id);
    },

    removeOverlay(id) {
      if (!this.editorDraft) return;
      this.editorDraft.overlays = this.editorDraft.overlays.filter(o => o.id !== id);
      if (this.editorSelectedKind === "overlay" && this.editorSelectedKey === id) {
        this.editorSelectedKind = null;
        this.editorSelectedKey = null;
      }
    },

    async replaceOverlayImage(overlay, file) {
      if (!file || !overlay) return;
      overlay.imageB64 = await this.readFileAsDataURL(file);
    },

    // Toggling "Fill per document" clears whatever fixed content the
    // overlay was carrying (image or text) — switching to a placeholder
    // means every instance supplies its own, so a stale baked-in value
    // left behind would be confusing (and would leak into instances that
    // never touch this box, since drawOverlays only reads instance data
    // for placeholder-mode overlays in the first place).
    setOverlayPlaceholder(overlay, isPlaceholder) {
      if (!overlay) return;
      overlay.mode = isPlaceholder ? "placeholder" : "fixed";
      if (isPlaceholder) {
        delete overlay.imageB64;
        delete overlay.text;
      }
    },

    // Toggling a column off "independent" snaps its yOffset back to 0 —
    // otherwise a hidden nonzero offset would keep silently shifting the
    // column even after the checkbox no longer shows any way to see or
    // edit it, which would look like the position "randomly" reverted the
    // next time this column happened to get selected.
    toggleIndependentY(spec, isIndependent) {
      if (!spec) return;
      spec.independentY = isIndependent;
      if (!isIndependent) spec.yOffset = 0;
    },

    resetEditorAll() {
      const schema = this.editorSchema;
      if (!schema) return;
      if (!confirm("Reset every field in this form type back to its default position and styling? This also removes any images/text boxes added here.")) return;
      this.editorDraft = this.cloneLayout(schema.defaultLayout);
      this.editorSelectedKind = null;
      this.editorSelectedKey = null;
    },

    // For any form type (built-in or custom), the editor can add/remove
    // header fields directly (addEditorHeaderField/removeEditorHeaderField
    // above, plus whatever the "Upload PDF" extraction pre-populated) — this
    // syncs editorDraft.header's current key set, and any label edits, back
    // into the schema's own `sections` (used for data entry/validation) so
    // the two stay in sync. Only ever touches the schema's "fields" section
    // (creating one if none exists yet); table sections are reconciled
    // separately by reconcileFormTypeTables below.
    reconcileFormTypeFields(schema) {
      const keys = Object.keys(this.editorDraft.header);
      let fieldsSection = schema.sections.find(s => s.kind === "fields");
      if (!fieldsSection) {
        fieldsSection = { kind: "fields", title: "Extracted fields", columns: 2, fields: [] };
        schema.sections.push(fieldsSection);
      }
      const existingByKey = new Map(fieldsSection.fields.map(f => [f.key, f]));
      // "page"/"pageOf" are the running "Page X of Y" stamp's layout-only
      // keys (see buildCoordinateCopies) for every built-in type and most
      // custom ones — always present in editorDraft.header (the stamp
      // needs a position) but never real schema.sections fields to begin
      // with. Only carry one of these two names through as a real field if
      // it already WAS one (e.g. a type extracted from an uploaded PDF
      // that happens to have a genuine "page" field of its own) — a real
      // bug found by testing this exact path: without this guard, every
      // Save here promoted both into real fields regardless, which then
      // makes emptyInstance() seed form.header.page/.pageOf with real
      // (empty-string) data — and buildCoordinateCopies only draws the
      // automatic stamp when the key is ABSENT from form.header, so doing
      // that silently disables the stamp for every instance created after
      // the very next Save.
      const realKeys = keys.filter(key => !(["page", "pageOf"].includes(key) && !existingByKey.has(key)));
      fieldsSection.fields = realKeys.map(key => {
        const prior = existingByKey.get(key) || { key, textarea: false, validation: {} };
        return { ...prior, key, label: this.editorLabels.header[key] || prior.label || key, validation: this.editorValidation.header[key] || prior.validation || {} };
      });
    },

    // Mirrors reconcileFormTypeFields above, but for tables added via
    // addEditorTable/addEditorTableColumn: syncs editorDraft.extraTables'
    // current rowsKey/column-key set, and any label edits, back into the
    // schema's own "table" sections (creating/removing sections to match).
    // Never touches the primary table section (rowsKey "rows") — that one
    // isn't addable/removable from this editor (see addEditorTable).
    reconcileFormTypeTables(schema) {
      const draftTables = this.editorDraft.extraTables || [];
      const existingTableSections = new Map(
        schema.sections.filter(s => s.kind === "table" && s.rowsKey !== "rows").map(s => [s.rowsKey, s])
      );
      const newTableSections = draftTables.map(table => {
        const prior = existingTableSections.get(table.rowsKey);
        const existingColsByKey = new Map((prior ? prior.columns : []).map(c => [c.key, c]));
        const columns = Object.keys(table.cols).map(key => {
          const priorCol = existingColsByKey.get(key) || { key, validation: {} };
          return { ...priorCol, key, label: this.editorLabels.col[key] || priorCol.label || key, validation: this.editorValidation.col[key] || priorCol.validation || {} };
        });
        return { kind: "table", title: this.editorLabels.table[table.rowsKey] || prior?.title || "Table", rowsKey: table.rowsKey, fixedRows: table.maxRows || 5, columns };
      });
      schema.sections = schema.sections.filter(s => !(s.kind === "table" && s.rowsKey !== "rows")).concat(newTableSections);
    },

    // The primary (growable) table's columns can't be added/removed from
    // this editor (see addEditorTable's own note — a new table here is
    // always a fixed-row extra one), so there's no key-set reconciliation
    // to do for it the way reconcileFormTypeTables does for extras — just
    // label/validation edits on whichever columns already exist, synced
    // back the same way. Without this, a label or field-type change made
    // here for a primary-table column had nothing writing it back into
    // schema.sections at all (editorLabels/editorValidation would silently
    // hold an edit the document view never picked up).
    reconcilePrimaryTableColumns(schema) {
      const primary = schema.sections.find(s => s.kind === "table" && s.rowsKey === "rows");
      if (!primary) return;
      primary.columns = primary.columns.map(c => ({
        ...c,
        label: this.editorLabels.col[c.key] || c.label,
        validation: this.editorValidation.col[c.key] || c.validation || {},
      }));
    },

    confirmSaveEditor() {
      if (!this.editorFormType) return;
      const schema = this.editorSchema;
      if (schema) {
        this.reconcileFormTypeFields(schema);
        this.reconcileFormTypeTables(schema);
        this.reconcilePrimaryTableColumns(schema);
        // getLayout() only ever merges keys that already exist in
        // schema.defaultLayout.header/.cols — a key added purely in
        // editorDraft (via "+ Add field") would otherwise silently vanish
        // the next time this editor opens (dropped by that merge), while
        // still lingering in `sections`/editorLabels, which is exactly the
        // header/col-list vs. editorDraft mismatch that crashed
