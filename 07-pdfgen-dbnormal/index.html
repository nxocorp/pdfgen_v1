          <template x-if="isSupported">
            <div style="display:flex; flex-direction:column; min-height:0; flex:1;">
              <div class="sidebar-section" style="padding-top:14px;">
                <div class="sidebar-label" x-text="(selectedDocTypeObj ? selectedDocTypeObj.name : 'Documents') + ' (' + documentsForSelection().length + ')'"></div>
              </div>
              <div class="sidebar-list" style="flex:0 1 auto; max-height:220px;">
                <template x-if="documentsForSelection().length === 0">
                  <div class="sidebar-empty">None yet.</div>
                </template>
                <template x-for="lb in sortedLogbooks()" :key="lb.id">
                  <div class="sidebar-item" :class="{ active: lb.id === currentId }" @click="openLogbook(lb.id)">
                    <div style="flex:1;min-width:0;">
                      <div class="tail" x-text="lb.tailNumber"></div>
                      <div class="meta" x-text="formatDate(lb.updatedAt)"></div>
                    </div>
                    <span class="status-pill" :class="isLogbookComplete(lb) ? 'status-complete' : 'status-incomplete'"
                          style="margin-left:0;"
                          x-text="isLogbookComplete(lb) ? 'Complete' : 'Incomplete'"></span>
                    <button class="del" title="Delete logbook" @click.stop="deleteLogbook(lb.id)">&times;</button>
                  </div>
                </template>
              </div>
              <div class="sidebar-footer">
                <button class="btn btn-primary" :disabled="!formTypesLoaded" @click="openNewModal()">
                  + New <span x-text="selectedDocTypeObj ? selectedDocTypeObj.name : 'document'"></span>
                </button>
              </div>

              <template x-if="current">
                <div style="display:flex; flex-direction:column; min-height:0; flex:1; border-top:1px solid var(--border);">
                  <div class="sidebar-section" style="padding-top:12px;">
                    <div class="sidebar-label">Forms in this document</div>
                  </div>
                  <div class="sidebar-list">
                    <template x-if="formTypesInCurrent().length === 0">
                      <div class="sidebar-empty">
                        No form types assigned to this document type yet.
                        <span x-show="isAdmin">Use "Document types&hellip;" &rarr; "Form types&hellip;" in Admin above to assign some.</span>
                      </div>
                    </template>
                    <template x-for="ft in formTypesInCurrent()" :key="ft.type">
                      <div class="form-type-group">
                        <div class="form-type-header">
                          <button class="form-type-collapse" @click.stop="toggleFormTypeCollapsed(ft.type)"
                                  :title="isFormTypeCollapsed(ft.type) ? 'Expand instances' : 'Collapse instances'">
                            <span x-text="isFormTypeCollapsed(ft.type) ? '▸' : '▾'"></span>
                          </button>
                          <span x-text="ft.label"></span>
                          <span class="form-type-count" x-text="'(' + instancesOf(ft.type).length + ')'"></span>
                          <span class="form-type-actions">
                            <button class="form-type-gear" x-show="hasTemplate(ft)" title="Form Type Editor — field placement & styling" @click.stop="openEditorModal(ft.type)">
                              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                            </button>
                            <button class="form-type-add" :title="'New ' + ft.type" @click="addFormInstance(ft.type)">+</button>
                          </span>
                        </div>
                        <template x-if="!isFormTypeCollapsed(ft.type)">
                          <template x-for="(inst, i) in instancesOf(ft.type)" :key="inst.id">
                            <div class="sidebar-item form-instance-item"
                                 :class="{ active: activeFormType === ft.type && activeInstanceId === inst.id }"
                                 @click="renamingInstanceId !== inst.id && openFormInstance(ft.type, inst.id)">
                              <template x-if="renamingInstanceId === inst.id">
                                <input type="text" class="instance-rename-input" :id="'renameInstance_' + inst.id" x-ref="renameInput" x-model="renameDraft"
                                       @click.stop
                                       @keydown.enter="commitRename(inst)"
                                       @keydown.escape="cancelRename()"
                                       @blur="commitRename(inst)">
                              </template>
                              <template x-if="renamingInstanceId !== inst.id">
                                <div style="flex:1;min-width:0;" x-text="instanceLabel(ft, inst, i)"></div>
                              </template>
                              <span x-show="inst.complete" title="Marked complete" style="color:#1a7f4b;font-size:12px;">&#10003;</span>
                              <button class="instance-rename-btn" title="Rename" x-show="renamingInstanceId !== inst.id"
                                      @click.stop="startRenameInstance(ft, inst, i)">&#9998;</button>
                              <button class="del" title="Delete this form instance" @click.stop="deleteFormInstance(ft.type, inst.id)">&times;</button>
                            </div>
                          </template>
                        </template>
                      </div>
                    </template>
                  </div>
                </div>
              </template>
            </div>
          </template>
        </div>
      </template>
    </aside>

    <!-- ============ CENTER ============ -->
    <main class="center">

      <template x-if="!current">
        <div class="placeholder">
          Select a logbook from the sidebar, or create a new one to get started.
        </div>
      </template>

      <template x-if="current && activeSchema && activeInstance">
        <div>
          <div class="toolbar">
            <div class="titles">
              <h1 x-text="documentTypeName(current.documentTypeId) + ' — ' + current.tailNumber"></h1>
              <span class="status-pill" :class="activeInstance.complete ? 'status-complete' : 'status-incomplete'"
                    x-text="activeInstance.complete ? 'Complete' : 'Incomplete'"></span>
              <div class="cap" x-text="activeSchema.label + ' — ' + (activeInstance.name && activeInstance.name.trim() ? activeInstance.name : 'Instance ' + activeInstanceIndex())"></div>
            </div>
            <div class="actions">
              <button class="btn btn-sm" title="Undo (Ctrl+Z)" :disabled="!canUndo()" @click="undo()">↶ Undo</button>
              <button class="btn btn-sm" title="Redo (Ctrl+Shift+Z)" :disabled="!canRedo()" @click="redo()">↷ Redo</button>
              <button class="btn" :disabled="activeInstance.complete" @click="openAutomateModal()">Auto-fill from source</button>
              <button class="btn btn-primary" @click="showPrintPreview()" :disabled="generating || !hasTemplate(activeSchema)"
                      :title="hasTemplate(activeSchema) ? '' : 'No PDF template uploaded yet for this form type'">
                <span x-text="generating ? 'Generating…' : 'Print Preview'"></span>
              </button>
            </div>
          </div>

          <div class="banner-note" x-show="activeSchema.bannerNote" x-text="activeSchema.bannerNote"></div>
          <div class="banner-note" x-show="!hasTemplate(activeSchema)">
            No PDF template uploaded yet for this form type — data entry works normally; PDF preview/export
            will be available once a template is uploaded (a later phase).
          </div>
          <div class="validation-summary" x-show="activeInstanceErrorCount() > 0"
               x-text="activeInstanceErrorCount() + ' field' + (activeInstanceErrorCount() === 1 ? '' : 's') + ' need attention before this form can be marked complete.'"></div>

          <!-- ===== Generic, schema-driven form renderer ===== -->
          <div class="card">
            <!-- Key must be unique WITHIN a schema and different ACROSS
                 schemas. `section.title` alone (the original) is neither: two
                 auto-detected tables can share a title, and a duplicate :key
                 crashes Alpine's diffing for the whole page. A bare index is
                 unique but *too* stable — switching form types then makes
                 Alpine reuse the DOM node at index N for a completely
                 different section (a table section's node reused for a fields
                 section), which corrupts the nested column x-for the same
                 way. Prefixing with the active form type forces a clean
                 teardown/rebuild on every schema switch. -->
            <template x-for="(section, sIdx) in activeSchema.sections" :key="activeFormType + ':' + sIdx">
              <div>

                <!-- a labeled field group (header-level data) -->
                <template x-if="section.kind === 'fields'">
                  <div>
                    <div class="section-title" x-text="section.title"></div>
                    <div class="field-grid" :style="'grid-template-columns: repeat(' + (section.columns || 3) + ', 1fr)'">
                      <template x-for="field in section.fields" :key="field.key">
                        <div>
                          <label>
                            <span x-text="field.label"></span>
                            <span class="req-star" x-show="field.validation && field.validation.required">*</span>
                          </label>
                          <template x-if="field.textarea">
                            <textarea :id="'headerField_' + activeFormType + '_' + field.key" :value="activeInstance.header[field.key]" @focus="snapshotBeforeChange()"
                                      :readonly="activeInstance.complete"
                                      :maxlength="(field.validation && field.validation.maxLength) || null"
                                      :class="{ 'input-invalid': headerFieldErrors(field.key).length }"
                                      :title="headerFieldErrors(field.key).join('; ')"
                                      @input="activeInstance.header[field.key] = $event.target.value"></textarea>
                          </template>
                          <template x-if="!field.textarea && (!field.validation || field.validation.type !== 'date')">
                            <input type="text" :id="'headerField_' + activeFormType + '_' + field.key" :value="activeInstance.header[field.key]" @focus="snapshotBeforeChange()"
                                   :readonly="activeInstance.complete"
                                   :maxlength="(field.validation && field.validation.maxLength) || null"
                                   :class="{ 'input-invalid': headerFieldErrors(field.key).length }"
                                   :title="headerFieldErrors(field.key).join('; ')"
                                   @input="activeInstance.header[field.key] = $event.target.value">
                          </template>
                          <!-- A date-typed field (validation.type === 'date') gets a native date
                               picker instead of free text. Only reliably populates the picker UI
                               for a value already in yyyy-mm-dd form — an existing non-ISO value
                               (this project's own sample data also uses "15 MAR 26" style dates,
                               which looksLikeDate() deliberately still accepts) shows blank here
                               until re-entered through the picker, though the stored string is
                               untouched until then. -->
                          <template x-if="!field.textarea && field.validation && field.validation.type === 'date'">
                            <input type="date" :id="'headerField_' + activeFormType + '_' + field.key" :value="activeInstance.header[field.key]" @focus="snapshotBeforeChange()"
                                   :readonly="activeInstance.complete"
                                   :class="{ 'input-invalid': headerFieldErrors(field.key).length }"
                                   :title="headerFieldErrors(field.key).join('; ')"
                                   @input="activeInstance.header[field.key] = $event.target.value">
                          </template>
                        </div>
                      </template>
                    </div>
                  </div>
                </template>

                <!-- a repeating row table (e.g. sample rows, inspection items).
                     activeInstance[section.rowsKey] falls back to [] here and
                     below — switching form types changes activeFormType and
                     activeInstanceId in two separate reactive writes, so
                     Alpine can briefly re-evaluate an outgoing schema's
                     section against the new instance before the DOM settles;
                     harmless once every schema shared one "rows" key, but
                     a form type with its own rowsKey (verifRows, remarksRows)
                     needs the guard. -->
                <template x-if="section.kind === 'table'">
                  <div>
                    <div class="section-title">
                      <span x-text="section.title + ' (' + (activeInstance[section.rowsKey] || []).length + ')'"></span>
                      <span class="section-title-capacity" x-show="tableCapacityLabel(section)" x-text="tableCapacityLabel(section)"></span>
                    </div>
                    <div class="table-wrap">
                      <table class="rows">
                        <thead>
                          <tr>
                            <th style="width:18px" x-show="!section.fixedRows"></th>
                            <th style="width:26px"></th>
                            <template x-for="col in section.columns" :key="col.key">
                              <th>
                                <span x-text="col.label"></span>
                                <span class="req-star" x-show="col.validation && col.validation.required">*</span>
                              </th>
                            </template>
                            <th style="width:44px" x-show="!section.fixedRows"></th>
                          </tr>
                        </thead>
                        <tbody>
                          <template x-for="(row, idx) in (activeInstance[section.rowsKey] || [])" :key="row.id">
                            <tr :class="{ dragging: dragIndex === idx }"
                                @dragover.prevent @drop="dropRow(section, idx)">
                              <td class="drag-handle" x-show="!section.fixedRows" :draggable="!activeInstance.complete"
                                  @dragstart="dragStart(idx)" @dragend="dragIndex = null" title="Drag to reorder">&#8942;&#8942;</td>
                              <td class="row-num" x-text="idx + 1"></td>
                              <template x-for="col in section.columns" :key="col.key">
                                <td>
                                  <template x-if="!col.validation || col.validation.type !== 'date'">
                                    <input type="text" :id="'rowField_' + section.rowsKey + '_' + row.id + '_' + col.key" :value="row[col.key]"
                                           :maxlength="(col.validation && col.validation.maxLength) || null"
                                           :readonly="activeInstance.complete"
                                           :class="{ 'input-invalid': rowFieldErrors(section, row, col.key).length }"
                                           :title="rowFieldErrors(section, row, col.key).join('; ')"
                                           @focus="snapshotBeforeChange()" @input="row[col.key] = $event.target.value">
                                  </template>
                                  <template x-if="col.validation && col.validation.type === 'date'">
                                    <input type="date" :id="'rowField_' + section.rowsKey + '_' + row.id + '_' + col.key" :value="row[col.key]"
                                           :readonly="activeInstance.complete"
                                           :class="{ 'input-invalid': rowFieldErrors(section, row, col.key).length }"
                                           :title="rowFieldErrors(section, row, col.key).join('; ')"
                                           @focus="snapshotBeforeChange()" @input="row[col.key] = $event.target.value">
                                  </template>
                                </td>
                              </template>
                              <td class="row-actions" x-show="!section.fixedRows">
                                <button title="Duplicate row" :disabled="activeInstance.complete" @click="duplicateRow(section, idx)">
                                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="13" height="13" rx="1.5"/><path d="M4 16V5a1 1 0 0 1 1-1h11"/></svg>
                                </button>
                                <button class="danger" title="Remove row" :disabled="activeInstance.complete" @click="removeRow(section, idx)">
                                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
                                </button>
                              </td>
                            </tr>
                          </template>
                        </tbody>
                      </table>
                    </div>
                    <div class="table-actions" x-show="!section.fixedRows">
                      <button class="btn btn-sm" :disabled="activeInstance.complete" @click="addRow(section)">+ Add row</button>
                    </div>
                  </div>
                </template>

              </div>
            </template>
          </div>
          <!-- ===== /generic renderer ===== -->

          <!-- ===== Signature & attachments — per-instance content for any -->
          <!-- overlay the Form Type Editor marked "Fill per document" ===== -->
          <template x-if="placeholderOverlays().length">
            <div class="card" style="margin-top:16px;">
              <div class="section-title">Signature &amp; attachments</div>
              <div class="field-grid" style="grid-template-columns: 1fr;">
                <template x-for="ov in placeholderOverlays()" :key="ov.id">
                  <div>
                    <label x-text="ov.label || (ov.kind === 'image' ? 'Image' : 'Text')"></label>

                    <template x-if="ov.kind === 'image'">
                      <div>
                        <img :src="overlayValue(ov.id).imageB64" class="editor-overlay-preview"
                             style="margin-bottom:8px;" x-show="overlayValue(ov.id).imageB64">
                        <div style="display:flex; gap:8px; align-items:center;">
                          <label class="btn btn-sm" :for="'overlayUpload_' + ov.id" :class="{ 'btn-label-disabled': activeInstance.complete }">
                            <span x-text="overlayValue(ov.id).imageB64 ? 'Replace image' : 'Upload image'"></span>
                          </label>
                          <input type="file" accept="image/png,image/jpeg" :id="'overlayUpload_' + ov.id"
                                 :disabled="activeInstance.complete" style="display:none;"
                                 @change="setInstanceOverlayImage(ov.id, $event.target.files[0]); $event.target.value = ''">
                          <button class="btn btn-sm" :disabled="activeInstance.complete" x-show="overlayValue(ov.id).imageB64"
                                  @click="removeInstanceOverlayImage(ov.id)">Remove</button>
                        </div>
                      </div>
                    </template>

                    <template x-if="ov.kind === 'text'">
                      <textarea :id="'overlayText_' + ov.id" :value="overlayValue(ov.id).text" :readonly="activeInstance.complete"
                                @focus="snapshotBeforeChange()"
                                @input="setInstanceOverlayText(ov.id, $event.target.value)"></textarea>
                    </template>
                  </div>
                </template>
              </div>
            </div>
          </template>

        </div>
      </template>

    </main>

    <!-- ============ RIGHT PREVIEW PANEL ============ -->
    <div class="preview-resizer" x-show="current && previewPanelOpen"
         :class="{ resizing: resizingPreview }" @mousedown="startPreviewResize($event)"
         title="Drag to resize"></div>
    <aside class="preview" x-show="current && previewPanelOpen" :style="'width:' + previewWidth + 'px'">
      <div class="preview-toolbar">
        <span class="label">PDF preview</span>
        <div style="display:flex; gap:6px;">
          <button class="btn btn-sm" @click="regeneratePreview()" :disabled="generating">Refresh</button>
          <button class="btn btn-sm btn-primary" @click="openPreviewPdf()" :disabled="!previewGenerated"
                  title="Open the rendered PDF in a new tab">Open PDF</button>
          <button class="sidebar-toggle" title="Close preview" @click="previewPanelOpen = false">&times;</button>
        </div>
      </div>
      <div class="preview-frame-wrap">
        <div class="preview-pages" x-ref="previewPages" x-show="previewGenerated"></div>
        <template x-if="!previewGenerated">
          <div class="preview-empty">
            <span x-text="generating ? 'Generating preview…' : 'Click \'Print Preview\' to render this logbook.'"></span>
          </div>
        </template>
      </div>
      <div class="preview-footer">Preview reflects unsaved changes as of the last refresh</div>
    </aside>

  </div>

  <!-- ============ NEW LOGBOOK MODAL ============ -->
  <template x-if="showNewModal">
    <div class="modal-backdrop" @click.self="showNewModal = false">
      <div class="modal">
        <h2>New <span x-text="selectedDocTypeObj ? selectedDocTypeObj.name : 'document'"></span></h2>
        <div class="cap" x-text="selectedModel + ' · ' + (selectedDocTypeObj ? selectedDocTypeObj.name : '')"></div>

        <div class="field">
          <label>Aircraft tail number</label>
          <input type="text" id="newTailNumberInput" x-model="newTailNumber" placeholder="e.g. 16-04578" x-ref="tailInput">
        </div>

        <div class="field">
          <label>Start from</label>
          <div class="source-option" :class="{ selected: newSource === 'blank' }" @click="newSource = 'blank'">
            <input type="radio" id="newSourceBlank" name="newSource" :checked="newSource === 'blank'" @click.stop="newSource = 'blank'">
            <span class="name">Blank</span>
          </div>
          <template x-for="d in defaultsForSelection()" :key="d.id">
            <div class="source-option" :class="{ selected: newSource === d.id }" @click="newSource = d.id">
              <input type="radio" :id="'newSourceDefault_' + d.id" name="newSource" :checked="newSource === d.id" @click.stop="newSource = d.id">
              <span class="name" x-text="d.name"></span>
              <span style="font-size:10.5px;color:var(--muted);" x-text="defaultSummary(d)"></span>
              <button class="del" title="Delete this default" @click.stop="deleteDefault(d.id)">&times;</button>
            </div>
          </template>
          <div class="cap" x-show="defaultsForSelection().length === 0" style="margin:6px 0 0;">
            No saved defaults yet for this model/document type — open one and use "Save as default" to create one.
          </div>
        </div>

        <div class="modal-actions">
          <button class="btn" @click="showNewModal = false">Cancel</button>
          <button class="btn btn-primary" @click="confirmCreateLogbook()" :disabled="!newTailNumber.trim()">Create</button>
        </div>
      </div>
    </div>
  </template>

  <!-- ============ SAVE AS DEFAULT MODAL ============ -->
  <template x-if="showSaveDefaultModal">
    <div class="modal-backdrop" @click.self="showSaveDefaultModal = false">
      <div class="modal">
        <h2>Save as default</h2>
        <div class="cap">
          Stores this logbook's forms as a reusable starting point for new logbooks.
          This logbook stays independent — editing it later won't change the saved default.
        </div>
        <div class="field">
          <label>Default name</label>
          <input type="text" id="newDefaultNameInput" x-model="newDefaultName" placeholder="e.g. Standard UH-60R logbook" x-ref="defaultNameInput">
        </div>
        <div class="modal-actions">
          <button class="btn" @click="showSaveDefaultModal = false">Cancel</button>
          <button class="btn btn-primary" @click="confirmSaveDefault()" :disabled="!newDefaultName.trim()">Save</button>
        </div>
      </div>
    </div>
  </template>

  <!-- ============ ADMIN: AIRCRAFT MODELS MODAL ============ -->
  <template x-if="showAdminModelsModal">
    <div class="modal-backdrop">
      <div class="modal">
        <h2>Aircraft models</h2>
        <div class="cap">Models available across every document type.</div>
        <div class="field">
          <template x-for="m in aircraftModels" :key="m">
            <div class="source-option" style="cursor:default;">
              <template x-if="renamingModelName !== m">
                <span class="name" x-text="m"></span>
              </template>
              <template x-if="renamingModelName === m">
                <input type="text" id="renameModelInputField" class="instance-rename-input" style="flex:1;" x-ref="renameModelInput" x-model="renameModelDraft"
                       @keydown.enter="commitRenameAircraftModel()"
                       @keydown.escape="cancelRenameAircraftModel()"
                       @blur="commitRenameAircraftModel()">
              </template>
              <button class="btn btn-sm" x-show="renamingModelName !== m" @click="startRenameAircraftModel(m)">Rename</button>
              <button class="del" title="Delete" x-show="renamingModelName !== m" @click="deleteAircraftModel(m)">&times;</button>
            </div>
          </template>
          <div class="cap" x-show="aircraftModels.length === 0" style="margin:6px 0 0;">No models yet.</div>
        </div>
        <div class="field" style="display:flex; gap:8px;">
          <input type="text" id="newModelNameInput" x-model="newModelName" placeholder="e.g. AH-64E" @keydown.enter="addAircraftModel()">
          <button class="btn btn-primary btn-sm" @click="addAircraftModel()">Add</button>
        </div>
        <div class="modal-actions">
          <button class="btn" @click="showAdminModelsModal = false">Close</button>
        </div>
      </div>
    </div>
  </template>

  <!-- ============ ADMIN: DOCUMENT TYPES MODAL ============ -->
  <template x-if="showAdminDocTypesModal">
    <div class="modal-backdrop">
      <div class="modal">
        <h2>Document types</h2>
        <div class="cap">
          Which aircraft models each document type applies to, and (via "Form types&hellip;")
          which form types it contains and in what order.
        </div>
        <div class="field">
          <template x-for="dt in documentTypes" :key="dt.id">
            <div style="border:1px solid var(--border-strong); border-radius:6px; padding:8px 10px; margin-bottom:8px;">
              <div style="display:flex; align-items:center; gap:8px;">
                <template x-if="renamingDocTypeId !== dt.id">
                  <span class="name" style="font-weight:600; flex:1;" x-text="dt.name"></span>
                </template>
                <template x-if="renamingDocTypeId === dt.id">
                  <input type="text" id="renameDocTypeInputField" class="instance-rename-input" style="flex:1;" x-ref="renameDocTypeInput" x-model="renameDocTypeDraft"
                         @keydown.enter="commitRenameDocumentType(dt)"
                         @keydown.escape="cancelRenameDocumentType()"
                         @blur="commitRenameDocumentType(dt)">
                </template>
                <button class="btn btn-sm" x-show="renamingDocTypeId !== dt.id" @click="startRenameDocumentType(dt)">Rename</button>
                <button class="btn btn-sm" @click="openAssignModal(dt)">Form types&hellip;</button>
                <button class="del" title="Delete" @click="deleteDocumentType(dt)">&times;</button>
              </div>
              <div style="margin-top:6px; display:flex; flex-wrap:wrap; gap:10px;">
                <template x-for="m in aircraftModels" :key="m">
                  <label class="editor-check">
                    <input type="checkbox" :id="'docTypeModel_' + dt.id + '_' + m" :checked="dt.models.includes(m)" @change="toggleDocTypeModel(dt, m)">
                    <span x-text="m"></span>
                  </label>
                </template>
                <span class="cap" x-show="aircraftModels.length === 0" style="margin:0;">No aircraft models yet — add one first.</span>
              </div>
            </div>
          </template>
        </div>
        <div class="field" style="display:flex; gap:8px;">
          <input type="text" id="newDocTypeNameInput" x-model="newDocTypeName" placeholder="e.g. Blades" @keydown.enter="addDocumentType()">
          <button class="btn btn-primary btn-sm" @click="addDocumentType()">Add</button>
        </div>
        <div class="modal-actions">
          <button class="btn" @click="showAdminDocTypesModal = false">Close</button>
        </div>
      </div>
    </div>
  </template>

  <!-- ============ ADMIN: ASSIGN & SORT FORM TYPES MODAL ============ -->
  <template x-if="showAdminAssignModal">
    <div class="modal-backdrop">
      <div class="modal">
        <h2 x-text="'Form types — ' + (assignDocType ? assignDocType.name : '')"></h2>
        <div class="cap">Click a form type to include/exclude it; drag items in "Assigned" to reorder.</div>
        <div style="display:flex; gap:16px;">
          <div style="flex:1; min-width:0;">
            <div class="sidebar-label" style="margin-bottom:6px;">Available</div>
            <template x-for="ft in FORM_TYPES.filter(f => !assignDraft.includes(f.type))" :key="ft.type">
              <div class="source-option" @click="toggleAssigned(ft.type)">
                <span class="name" x-text="ft.label"></span>
              </div>
            </template>
            <div class="cap" x-show="FORM_TYPES.filter(f => !assignDraft.includes(f.type)).length === 0" style="margin:4px 0 0;">
              All form types assigned.
            </div>
          </div>
          <div style="flex:1; min-width:0;">
            <div class="sidebar-label" style="margin-bottom:6px;">Assigned (drag to reorder)</div>
            <template x-for="(type, idx) in assignDraft" :key="type">
              <div class="source-option" draggable="true"
                   @dragstart="assignDragStart(idx)" @dragover.prevent @drop="assignDrop(idx)">
                <span style="cursor:grab;">&#8942;&#8942;</span>
                <span class="name" x-text="formTypeLabel(type)"></span>
                <button class="del" @click.stop="toggleAssigned(type)">&times;</button>
              </div>
            </template>
            <div class="cap" x-show="assignDraft.length === 0" style="margin:4px 0 0;">No form types assigned yet.</div>
          </div>
        </div>
        <div class="modal-actions">
          <button class="btn" @click="showAdminAssignModal = false">Cancel</button>
          <button class="btn btn-primary" @click="saveAssignModal()">Save</button>
        </div>
      </div>
    </div>
  </template>

  <!-- ============ ADMIN: FORM TYPES MODAL ============ -->
  <template x-if="showAdminFormTypesModal">
    <div class="modal-backdrop">
      <div class="modal" style="width:560px; max-width:calc(100vw - 40px);">
        <h2>Form types</h2>
        <div class="cap">
          A form type with no PDF template yet supports data entry but not PDF generation —
          attaching a template is a later phase. "Edit" opens the full structure builder (fields
          and tables) for any type, built-in or admin-created — see the builder's own note about
          what editing an already-templated type can affect.
        </div>
        <div class="field">
          <template x-for="ft in FORM_TYPES" :key="ft.type">
            <div class="source-option" style="cursor:default;">
              <span class="name" x-text="ft.label"></span>
              <span style="font-size:10.5px; color:var(--muted);"
                    x-text="hasTemplate(ft) ? 'PDF template' : 'Shape only — no template'"></span>
              <button class="btn btn-sm" @click="openFormTypeBuilderForEdit(ft)">Edit</button>
              <template x-if="ft.custom">
                <div style="display:inline-flex;">
                  <label class="btn btn-sm" :for="'uploadPdfFor_' + ft.type" :class="{ 'btn-label-disabled': uploadingFormType }" style="margin:0;">
                    <span x-text="uploadingFormType ? 'Analyzing…' : (hasTemplate(ft) ? 'Replace PDF' : 'Upload PDF')"></span>
                  </label>
                  <input type="file" accept="application/pdf" :id="'uploadPdfFor_' + ft.type" :disabled="uploadingFormType" style="display:none;"
                         @change="handleUploadPdfForExistingType(ft, $event.target.files[0]); $event.target.value = ''">
                </div>
              </template>
              <button class="del" title="Delete" x-show="ft.custom" @click="deleteFormType(ft)">&times;</button>
            </div>
          </template>
        </div>
        <div class="modal-actions" style="justify-content:space-between;">
          <div style="display:flex; gap:8px;">
            <button class="btn btn-primary btn-sm" @click="openFormTypeBuilder()">+ New form type</button>
            <button class="btn btn-sm" :disabled="uploadingFormType" @click="$refs.uploadFormTypePdfInput.click()">
              <span x-text="uploadingFormType ? 'Analyzing…' : 'Upload PDF…'"></span>
            </button>
            <input type="file" id="uploadFormTypePdfInput" accept="application/pdf" x-ref="uploadFormTypePdfInput" style="display:none;"
                   @change="handleUploadFormTypePdf($event.target.files[0]); $event.target.value = ''">
          </div>
          <button class="btn" @click="showAdminFormTypesModal = false">Close</button>
        </div>
      </div>
    </div>
  </template>

  <!-- ============ ADMIN: NEW FORM TYPE — MANUAL SCHEMA BUILDER ============ -->
  <template x-if="showFormTypeBuilder">
    <div class="modal-backdrop">
      <div class="modal modal-wide" style="height:auto; max-height:88vh;">
        <h2 x-text="builderDraft.editingType ? 'Edit form type' : 'New form type'"></h2>
        <div class="cap">
          Manual schema builder — add as many field groups and tables as this form type needs. The
          first table with any columns becomes the primary, growable table (rows overflow onto extra
          physical copies once a PDF template is attached); any table after that is a fixed row count
          instead (like a signature/verification log).
          <template x-if="!builderEditingHasTemplate()">
            <span>No PDF template yet; a future phase will let you upload one and auto-suggest this
            shape instead.</span>
          </template>
          <template x-if="builderEditingHasTemplate()">
            <span>This type already has a real PDF template — an existing field/column keeps its
            current position; a newly-added one starts at a placeholder position you'll need to place
            in the Form Type Editor afterward. Changing structure here (renaming/removing a field or
            column) can affect any document already saved with this form type, since its stored data
            is keyed by these same field/column keys.</span>
          </template>
        </div>

        <div style="overflow-y:auto; flex:1; padding-right:4px;">
          <div class="editor-prop-row">
            <div class="full">
              <label>Label</label>
              <input type="text" id="formTypeBuilderLabelInput" x-model="builderDraft.label" placeholder="e.g. Main Blades">
            </div>
          </div>
          <div class="editor-prop-row">
            <div class="full">
              <label>Banner note (optional)</label>
              <input type="text" id="formTypeBuilderBannerNoteInput" x-model="builderDraft.bannerNote" placeholder="e.g. Coordinate-based fill, once a template is uploaded">
            </div>
          </div>

          <hr class="editor-props-divider">
          <h3 style="font-size:13px; margin:0 0 10px;">Field groups</h3>
          <template x-for="(fs, sIdx) in builderDraft.fieldSections" :key="sIdx">
            <div style="border:1px solid var(--border); border-radius:6px; padding:10px; margin-bottom:10px;">
              <div style="display:flex; gap:8px; align-items:center; margin-bottom:8px;">
                <input type="text" :id="'builderFieldGroupTitle_' + sIdx" x-model="fs.title" placeholder="Section title" style="flex:1;">
                <button class="del" title="Remove this field group" @click="removeBuilderFieldSection(sIdx)">&times;</button>
              </div>
              <template x-for="(f, idx) in fs.fields" :key="idx">
                <div style="display:flex; gap:6px; align-items:center; margin-bottom:8px;">
                  <input type="text" :id="'builderField_' + sIdx + '_' + idx + '_label'" x-model="f.label" placeholder="Label" style="flex:2;">
                  <select :id="'builderField_' + sIdx + '_' + idx + '_type'" x-model="f.type" style="flex:1;">
                    <option value="text">Text</option>
                    <option value="number">Number</option>
                    <option value="date">Date</option>
                  </select>
                  <label class="editor-check"><input type="checkbox" :id="'builderField_' + sIdx + '_' + idx + '_required'" x-model="f.required"> Req'd</label>
                  <label class="editor-check"><input type="checkbox" :id="'builderField_' + sIdx + '_' + idx + '_multiline'" x-model="f.textarea"> Multiline</label>
                  <button class="del" @click="removeBuilderField(sIdx, idx)">&times;</button>
                </div>
              </template>
              <button class="btn btn-sm" @click="addBuilderField(sIdx)">+ Add field</button>
            </div>
          </template>
          <button class="btn btn-sm" @click="addBuilderFieldSection()">+ Add field group</button>

          <hr class="editor-props-divider">
          <h3 style="font-size:13px; margin:0 0 10px;">Tables</h3>
          <template x-for="(ts, tIdx) in builderDraft.tableSections" :key="tIdx">
            <div style="border:1px solid var(--border); border-radius:6px; padding:10px; margin-bottom:10px;">
              <div style="display:flex; gap:8px; align-items:center; margin-bottom:8px;">
                <input type="text" :id="'builderTableTitle_' + tIdx" x-model="ts.title" placeholder="Table title" style="flex:1;">
                <span class="cap" style="margin:0; white-space:nowrap;"
                      x-text="firstNonEmptyTableIndex() === tIdx ? 'Primary (growable)' : 'Fixed rows'"></span>
                <button class="del" title="Remove this table" @click="removeBuilderTableSection(tIdx)">&times;</button>
              </div>
              <div style="display:flex; gap:8px; align-items:center; margin-bottom:8px; flex-wrap:wrap;">
                <div style="display:flex; align-items:center; gap:4px;">
                  <label style="font-size:11px; color:var(--muted);">Table shows on</label>
                  <select :id="'builderTablePlacement_' + tIdx" :value="ts.placement"
                          @change="setBuilderTablePlacement(ts, $event.target.value)" style="font-size:12px;">
                    <option value="front">Front page</option>
                    <option value="back">Back page</option>
                    <option value="both">Both pages</option>
                  </select>
                </div>
                <div style="display:flex; align-items:center; gap:4px;">
                  <label style="font-size:11px; color:var(--muted);">Max rows — front</label>
                  <input type="number" :id="'builderTableMaxRowsFront_' + tIdx" min="0" step="1" style="width:60px;"
                         x-model.number="ts.maxRowsFront">
                </div>
                <div style="display:flex; align-items:center; gap:4px;">
                  <label style="font-size:11px; color:var(--muted);">Max rows — back</label>
                  <input type="number" :id="'builderTableMaxRowsBack_' + tIdx" min="0" step="1" style="width:60px;"
                         x-model.number="ts.maxRowsBack">
                </div>
                <div style="display:flex; align-items:center; gap:4px;">
                  <label style="font-size:11px; color:var(--muted);">Total rows per instance</label>
                  <input type="number" :id="'builderTableMaxRowsTotal_' + tIdx" min="0" step="1" style="width:60px;"
                         x-model.number="ts.maxRowsTotal">
                </div>
              </div>
              <div class="cap" style="margin:0 0 8px;">
                <span x-show="firstNonEmptyTableIndex() === tIdx">
                  If more rows are entered than fit here, a new physical copy of this whole form is
                  generated (header repeated) to hold the rest.
                </span>
                <span x-show="firstNonEmptyTableIndex() !== tIdx">
                  A fixed-count table like this always has exactly this many rows — front/back just
                  decide where each one prints. Fine-tune exact position/spacing per page afterward in
                  the Form Type Editor.
                </span>
              </div>
              <template x-for="(c, idx) in ts.columns" :key="idx">
                <div style="display:flex; gap:6px; align-items:center; margin-bottom:8px;">
                  <input type="text" :id="'builderColumn_' + tIdx + '_' + idx + '_label'" x-model="c.label" placeholder="Column label" style="flex:2;">
                  <select :id="'builderColumn_' + tIdx + '_' + idx + '_type'" x-model="c.type" style="flex:1;">
                    <option value="text">Text</option>
                    <option value="number">Number</option>
                    <option value="date">Date</option>
                  </select>
                  <label class="editor-check"><input type="checkbox" :id="'builderColumn_' + tIdx + '_' + idx + '_required'" x-model="c.required"> Req'd</label>
                  <button class="del" @click="removeBuilderColumn(tIdx, idx)">&times;</button>
                </div>
              </template>
              <button class="btn btn-sm" @click="addBuilderColumn(tIdx)">+ Add column</button>
            </div>
          </template>
          <button class="btn btn-sm" @click="addBuilderTableSection()">+ Add table</button>
        </div>

        <div class="modal-actions">
          <button class="btn" @click="showFormTypeBuilder = false">Cancel</button>
          <button class="btn btn-primary" @click="confirmFormTypeBuilder()"
                  x-text="builderDraft.editingType ? 'Save changes' : 'Create form type'"></button>
        </div>
      </div>
    </div>
  </template>

  <!-- ============ FORM TYPE EDITOR MODAL ============ -->
  <template x-if="showEditorModal">
    <div class="modal-backdrop" @click.self="closeEditorModal()">
      <div class="modal modal-wide">
        <h2 x-text="'Form Type Editor — ' + (editorSchema ? editorSchema.label : '')"></h2>
        <div class="cap">
          Drag a field to reposition it, drag its right edge to resize. Header fields move freely;
          a table column's box represents that column's first row — dragging it up/down adjusts the
          whole column grid's starting row for this page (see "Row grid" below once a column is selected).
        </div>

        <div class="editor-body">
          <div class="editor-canvas-pane">
            <div class="editor-page-tabs">
              <button :class="{ active: editorPageIndex === 0 }" @click="switchEditorPage(0)">Front page</button>
              <button :class="{ active: editorPageIndex === 1 }" @click="switchEditorPage(1)">Back page</button>
              <span style="flex:1;"></span>
              <button class="btn btn-sm" x-show="editorSchema" @click="addEditorHeaderField()">+ Add field</button>
              <button class="btn btn-sm" x-show="editorSchema" @click="addEditorTable()">+ Add table</button>
              <button class="btn btn-sm" @click="$refs.overlayImageInput.click()">+ Add image</button>
              <input type="file" id="overlayImageFileInput" accept="image/png,image/jpeg" x-ref="overlayImageInput" style="display:none;"
                     @change="addImageOverlay($event.target.files[0]); $event.target.value = ''">
              <button class="btn btn-sm" @click="addTextOverlay()">+ Add text box</button>
            </div>
            <div class="editor-canvas-wrap" x-ref="editorCanvasWrap">
              <canvas x-ref="editorCanvas"></canvas>
              <template x-for="box in editorBoxesForCurrentPage()" :key="box.kind + ':' + box.key">
                <div class="editor-box" :class="{ selected: editorSelectedKind === box.kind && editorSelectedKey === box.key }"
                     :style="editorBoxStyle(box)"
                     @mousedown="selectEditorField(box.kind, box.key); startBoxDrag($event, box)">
                  <span class="editor-box-label" x-text="box.label"></span>
                  <div class="editor-box-resize" @mousedown.stop="selectEditorField(box.kind, box.key); startBoxResize($event, box)"></div>
                  <div class="editor-box-resize-v" x-show="box.kind === 'overlay' && box.overlayKind === 'image'"
                       @mousedown.stop="selectEditorField(box.kind, box.key); startBoxResizeHeight($event, box)"></div>
                </div>
              </template>
            </div>
          </div>

          <div class="editor-props-pane">
            <div class="editor-field-list">
              <div class="editor-field-list-group-label">Header fields</div>
              <template x-if="editorSchema && editorFieldList.filter(f => f.kind === 'header').length === 0">
                <div class="editor-field-list-empty">None yet — use "+ Add field" above.</div>
              </template>
              <template x-for="f in editorFieldList.filter(f => f.kind === 'header')" :key="f.key">
                <div class="editor-field-list-item editor-field-list-item-overlay"
                     :class="{ selected: editorSelectedKind === 'header' && editorSelectedKey === f.key }"
                     @click="selectEditorField('header', f.key)">
                  <span x-text="f.label"></span>
                  <button class="editor-overlay-remove"
                          title="Remove this field" @click.stop="removeEditorHeaderField(f.key)">&times;</button>
                </div>
              </template>
              <template x-if="editorSchema && editorTableGroups().length === 0">
                <div>
                  <div class="editor-field-list-group-label">Table columns</div>
                  <div class="editor-field-list-empty">None yet — use "+ Add table" above.</div>
                </div>
              </template>
              <template x-for="group in editorTableGroups()" :key="group.rowsKey">
                <div>
                  <div class="editor-field-list-group-label" style="display:flex; align-items:center; gap:6px;">
                    <input type="text" :id="'editorTableGroupTitle_' + group.rowsKey" :value="group.title" style="flex:1; min-width:0;"
                           @input="editorLabels.table[group.rowsKey] = $event.target.value">
                    <button class="editor-overlay-remove" x-show="group.removable"
                            title="Remove this table" @click.stop="removeEditorTable(group.rowsKey)">&times;</button>
                  </div>
                  <template x-for="f in group.columns" :key="f.key">
                    <div class="editor-field-list-item"
                         :class="{ selected: editorSelectedKind === 'col' && editorSelectedKey === f.key, 'editor-field-list-item-overlay': group.removable }"
                         @click="selectEditorField('col', f.key)">
                      <span x-text="f.label"></span>
                      <button class="editor-overlay-remove" x-show="group.removable"
                              title="Remove this column" @click.stop="removeEditorTableColumn(group.rowsKey, f.key)">&times;</button>
                    </div>
                  </template>
                  <button class="btn btn-sm" x-show="group.removable" style="margin:4px 0 8px;"
                          @click="addEditorTableColumn(group.rowsKey)">+ Add column</button>
                </div>
              </template>
              <div class="editor-field-list-group-label">Overlays (images &amp; text boxes)</div>
              <template x-if="editorDraft && editorDraft.overlays.length === 0">
                <div class="editor-field-list-empty">None yet — use "+ Add image" or "+ Add text box" above.</div>
              </template>
              <template x-for="ov in (editorDraft ? editorDraft.overlays : [])" :key="ov.id">
                <div class="editor-field-list-item editor-field-list-item-overlay"
                     :class="{ selected: editorSelectedKind === 'overlay' && editorSelectedKey === ov.id }"
                     @click="selectEditorField('overlay', ov.id)">
                  <span x-text="(ov.kind === 'image' ? '🖼 ' : '𝑇 ') + (ov.label || (ov.kind === 'image' ? 'Image' : 'Text box'))"></span>
                  <button class="editor-overlay-remove" title="Remove this overlay" @click.stop="removeOverlay(ov.id)">&times;</button>
                </div>
              </template>
            </div>

            <div class="editor-props-card">
              <template x-if="!editorSelectedSpec()">
                <div class="editor-props-empty">Select a field on the canvas or in the list to edit its position and styling.</div>
              </template>
              <template x-if="editorSelectedSpec()">
                <div>
                  <h3 x-text="editorSelectedLabel()"></h3>

                  <template x-if="editorSelectedKind === 'overlay'">
                    <div class="editor-prop-row">
                      <div class="full">
                        <label>Label</label>
                        <input type="text" id="editorOverlayLabelInput" :value="editorSelectedSpec()?.label"
                               @input="editorSelectedSpec().label = $event.target.value">
                      </div>
                    </div>
                  </template>

                  <template x-if="(editorSelectedKind === 'header' || editorSelectedKind === 'col') && editorSchema">
                    <div class="editor-prop-row">
                      <div class="full">
                        <label>Label</label>
                        <input type="text" id="editorFieldLabelInput" :value="editorLabels[editorSelectedKind]?.[editorSelectedKey]"
                               @input="editorLabels[editorSelectedKind][editorSelectedKey] = $event.target.value">
                      </div>
                    </div>
                  </template>

                  <!-- Field type + type-specific output options — a real
                       schema field/column only (not an overlay, which has no
                       data-validation concept). Changing "Field type" here
                       also changes how this field renders in the actual
                       data-entry view (a date-typed field gets a native date
                       picker, etc.) once saved, same as the admin Structure
                       Builder's own Type select already does. -->
                  <template x-if="(editorSelectedKind === 'header' || editorSelectedKind === 'col') && editorSchema">
                    <div>
                      <div class="editor-prop-row">
                        <div class="full">
                          <label>Field type</label>
                          <select id="editorPropFieldType" :value="editorSelectedValidation()?.type || 'text'"
                                  @change="editorSelectedValidation().type = $event.target.value">
                            <option value="text">Text</option>
                            <option value="number">Number</option>
                            <option value="date">Date</option>
                          </select>
                        </div>
                      </div>
                      <template x-if="(editorSelectedValidation()?.type || 'text') === 'text'">
                        <div class="editor-prop-row">
                          <div class="full">
                            <label>Max characters</label>
                            <input type="number" id="editorPropMaxLength" min="0" step="1"
                                   :value="editorSelectedValidation()?.maxLength ?? ''"
                                   @input="editorSelectedValidation().maxLength = $event.target.value !== '' ? Number($event.target.value) : undefined">
                          </div>
                        </div>
                      </template>
                      <template x-if="editorSelectedValidation()?.type === 'number'">
                        <div class="editor-prop-row">
                          <div class="full">
                            <label>Decimal places</label>
                            <input type="number" id="editorPropDecimals" min="0" max="10" step="1"
                                   :value="editorSelectedValidation()?.decimals ?? ''"
                                   @input="editorSelectedValidation().decimals = $event.target.value !== '' ? Number($event.target.value) : undefined">
                          </div>
                        </div>
                      </template>
                      <template x-if="editorSelectedValidation()?.type === 'date'">
                        <div class="editor-prop-row">
                          <div class="full">
                            <label>Output format</label>
                            <select id="editorPropDateFormat" :value="editorSelectedValidation()?.dateFormat || 'asEntered'"
                                    @change="editorSelectedValidation().dateFormat = $event.target.value">
                              <option value="asEntered">As entered (no reformat)</option>
                              <option value="M-D-YY">M-D-YY</option>
                              <option value="MM/DD/YYYY">MM/DD/YYYY</option>
                              <option value="YYYY-MM-DD">YYYY-MM-DD</option>
                              <option value="DD MMM YY">DD MMM YY</option>
                            </select>
                          </div>
                        </div>
                      </template>
                      <hr class="editor-props-divider">
                    </div>
                  </template>

                  <div class="editor-prop-row">
                    <div>
                      <label>X (pt)</label>
                      <input type="number" id="editorPropX" step="0.5" :value="editorSelectedSpec()?.x"
                             @input="editorSelectedSpec().x = Number($event.target.value)">
                    </div>
                    <div x-show="editorSelectedKind === 'header' || editorSelectedKind === 'overlay'">
                      <label>Y (pt)</label>

                            Drag this box vertically on the canvas, or set the offset here — e.g. a

                      <h3 x-text="'Row grid — ' + (editorPageIndex === 0 ? 'front page' : 'back page')"></h3>
                      <div class="editor-prop-row">

                          <label>Start Y (pt)</label>

                      <!-- Front/back/total row capacity — same 3 properties for every table,

  <!-- ============ AUTOMATE FORM ENTRY MODAL ============ -->

  <!-- ============ MARK-COMPLETE VALIDATION MODAL ============ -->
  <template x-if="showValidationModal">

          need attention before this form can be marked complete.

                    x-text="p.kind === 'pending' ? 'Pending' : 'Incorrect'"></span>

<script>
// ---------------------------------------------------------------------------
// Workflow logging — every user-facing action (and the sync traffic it
// triggers) writes one aligned-column, timestamped line to the browser
// console, so the full data-entry workflow can be traced/debugged without
// opening the network tab or setting breakpoints. Columns are fixed-width
// (padEnd), which lines up like a table in a monospace console font.
// Categories: DOC (document/logbook lifecycle), FORM (form instance
// lifecycle), ROW (table row edits), UNDO (undo/redo), EXPORT
// (preview/export/open PDF), DEFAULT (save/apply/delete default), AUTOFILL
// (simulated automated data entry), EDITOR (Form Type Editor saves), ADMIN
// (registry CRUD — models/doc types/form types), SYNC (server persistence),
// APP (boot/init).
// ---------------------------------------------------------------------------
const LOG_COL = { category: 10, action: 34 };
function logAction(category, action, details) {
  const ts = new Date().toISOString();
  const cat = String(category).toUpperCase().padEnd(LOG_COL.category);
  const act = String(action).padEnd(LOG_COL.action);
  const det = details == null || details === "" ? "" : (typeof details === "string" ? details : JSON.stringify(details));
  console.log(
    "%c%s  %c%s%c%s%c%s",
    "color:#888888;font-weight:normal", ts,
    "color:#0a84ff;font-weight:bold", cat,
    "color:#1a7f37;font-weight:bold", act,
    "color:#333333;font-weight:normal", det
  );
}

// ---------------------------------------------------------------------------
// Form-type registry. Unlike pdfgen-vanilla-multi/-image (which hardcode
// each form type as a schema object exported by its own js/form-XXXX.js),
// here the registry starts empty and is populated from the server's
// /api/bootstrap response — a real `form_types` table (server/db.js),
// seeded once from form-types.json on first boot and never read from that
// file again after (see db.js's seed comment). A schema loaded this way is
// pure JSON — no functions — so the model factories (empty/clone/newRow)
// and fill-engine entry points that pdfgen-vanilla-image attached directly
// to each schema object are generic top-level functions here instead,
// parameterized by whichever schema they're given. index.html renders
// whatever's in FORM_TYPES, generically, via the "fields"/"table" section
// renderers and the Form Type Editor below.
// ---------------------------------------------------------------------------
let FORM_TYPES = []; // populated in place (push, never reassigned) by loadFormTypes()

// Turns a label into a stable id/key: "Main Blades" -> "main-blades". Used
// for admin-created document types and form types alike (see "Admin mode"
// below) so ids stay short and readable instead of random uids.
function slugify(name) {
  return (name || "").trim().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "") || "item";
}

function uniqueId(base, existingIds) {
  let id = base, n = 2;
  while (existingIds.includes(id)) id = base + "-" + (n++);
  return id;
}

function formTypeKey(type) {
  return "forms" + type.replace("-", "_"); // '2408-20' -> 'forms2408_20'
}

function uid() {
  return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
}

// ---------------------------------------------------------------------------
// Wire-format helpers for the /api backend (server.js). A logbook/default
// keeps its in-memory `forms<Type>: instance[]` keys (per formTypeKey())
// throughout the app — these only reshape at the sync boundary, into a flat
// `instances: [{id, formType, name, complete, data}]` list the server can
// store generically without knowing how any particular type's key was
// spelled (custom types are user-named via slugify(), not just the three
// built-in DA types formTypeKey() was written against).
// ---------------------------------------------------------------------------
function serializeInstance(formType, inst) {
  const { id, name, complete, header, overlayData, ...rows } = inst;
  return { id, formType, name: name || "", complete: !!complete, data: { header, overlayData, ...rows } };
}

function deserializeInstance(wire) {
  return { id: wire.id, name: wire.name || "", complete: !!wire.complete, ...wire.data };
}

function groupInstancesByFormKey(instances) {
  const out = {};
  for (const wire of instances || []) {
    const key = formTypeKey(wire.formType);
    (out[key] || (out[key] = [])).push(deserializeInstance(wire));
  }
  return out;
}

function flattenFormsToInstances(forms) {
  const out = [];
  for (const key of Object.keys(forms)) {
    if (!Array.isArray(forms[key])) continue;
    const ft = FORM_TYPES.find((f) => formTypeKey(f.type) === key);
    if (!ft) continue; // a form type removed from the registry after data was created
    for (const inst of forms[key]) out.push(serializeInstance(ft.type, inst));
  }
  return out;
}

function documentToWire(lb) {
  const { id, tailNumber, aircraftModel, documentTypeId, createdAt, updatedAt, ...forms } = lb;
  return { id, tailNumber, aircraftModel, documentTypeId, createdAt, updatedAt, instances: flattenFormsToInstances(forms) };
}

function documentFromWire(doc) {
  return {
    id: doc.id, tailNumber: doc.tailNumber, aircraftModel: doc.aircraftModel,
    documentTypeId: doc.documentTypeId, createdAt: doc.createdAt, updatedAt: doc.updatedAt,
    ...groupInstancesByFormKey(doc.instances),
  };
}

function defaultToWire(d) {
  const { id, name, aircraftModel, documentTypeId, createdAt, forms } = d;
  return { id, name, aircraftModel, documentTypeId, createdAt, instances: flattenFormsToInstances(forms || {}) };
}

function defaultFromWire(d) {
  return {
    id: d.id, name: d.name, aircraftModel: d.aircraftModel, documentTypeId: d.documentTypeId,
    createdAt: d.createdAt, forms: groupInstancesByFormKey(d.instances),
  };
}

// ---------------------------------------------------------------------------
// Sync queue — replaces the old synchronous localStorage.setItem() calls.
// The frontend still edits its in-memory state instantly (Alpine's own
// $watch triggers a persist*() call on every change, unchanged); persist*()
// now calls queueSync() instead of writing localStorage directly, which
// debounces and PUTs the latest value to the server in the background. A
// module-level (not Alpine-reactive) queue, since it only needs to track
// in-flight network state, not drive re-renders directly — it reports status
// back through a callback the Alpine root registers once in init().
// ---------------------------------------------------------------------------
const SYNC_DEBOUNCE_MS = 800;
const syncTimers = {};
const syncPayloads = {};
let onSyncStatus = null;

function queueSync(key, endpoint, payload) {
  syncPayloads[key] = { endpoint, payload };
  if (onSyncStatus) onSyncStatus("pending");
  logAction("SYNC", "Queued sync: " + key, endpoint);
  clearTimeout(syncTimers[key]);
  syncTimers[key] = setTimeout(() => flushSync(key), SYNC_DEBOUNCE_MS);
}

async function flushSync(key) {
  const entry = syncPayloads[key];
  if (!entry) return;
  clearTimeout(syncTimers[key]);
  delete syncTimers[key];
  if (onSyncStatus) onSyncStatus("saving");
  logAction("SYNC", "Syncing to server: " + key, entry.endpoint);
  try {
    const res = await fetch(entry.endpoint, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(entry.payload),
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    delete syncPayloads[key];
    if (onSyncStatus) onSyncStatus(Object.keys(syncTimers).length ? "pending" : "saved");
    logAction("SYNC", "Sync succeeded: " + key, entry.endpoint);
  } catch (e) {
    console.warn("Could not save " + key + " to the server", e);
    if (onSyncStatus) onSyncStatus("error");
    logAction("SYNC", "Sync FAILED: " + key, String(e));
  }
}

// Best-effort flush for a closing/hidden tab — a debounced write still
// pending in setTimeout would otherwise be lost. `keepalive` lets the
// request outlive the page unload (subject to the browser's ~64KB keepalive
// body limit — best-effort, not guaranteed, same as the plan called for).
function flushAllSyncsNow() {
  for (const key of Object.keys(syncTimers)) clearTimeout(syncTimers[key]);
  for (const key of Object.keys(syncPayloads)) {
    const { endpoint, payload } = syncPayloads[key];
    try {
      fetch(endpoint, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
        keepalive: true,
      });
    } catch (e) { /* best-effort */ }
  }
}

// ---------------------------------------------------------------------------
// Generic model factories, driven entirely by a schema's own `sections` —
// replace the per-form-type empty()/clone()/newRow() functions that
// pdfgen-vanilla-image attached to each schema object. A fetched JSON
// schema has no functions on it at all, so these read `sections` instead:
// one header key per "fields" section field, one row-column key per
// "table" section column. A schema can carry more than one "table" section
// (e.g. DA 2408-17's growable Equipment Checklist alongside its fixed-count
// Verification and Remarks tables) — each gets its own `rowsKey` array on
// the instance, so nothing here assumes exactly one.
// ---------------------------------------------------------------------------
function headerKeysOf(schema) {
  const keys = [];
  for (const s of schema.sections) if (s.kind === "fields") for (const f of s.fields) keys.push(f.key);
  return keys;
}

function tableSectionsOf(schema) {
  return schema.sections.filter(s => s.kind === "table");
}

// A table section's `fixedRows` (if set) marks it as a fixed physical row
// count that never grows/shrinks (e.g. a 6-slot verification log) — as
// opposed to the default growable table (starts with 1 row, add/remove/
// reorder freely, overflows onto extra physical copies when it outgrows
// its page capacity).
function emptyRowFor(table) {
  const row = { id: uid() };
  for (const col of table.columns) row[col.key] = "";
  return row;
}

// Default position/style for a brand-new header field or table column with
// no real position yet — used wherever one gets added without a PDF to
// derive a real position from (the Form Type Editor's own "+ Add field",
// and the admin Form Type Builder's structure editor). Centralized so both
// paths produce an identical starting box, adjustable afterward in the
// position editor.
function placeholderFieldSpec(page) {
  return { page: page || 0, x: 40, y: 700, width: 120, fontSize: 10, allowOverflow: false };
}

function placeholderColumnSpec() {
  return { x: 40, width: 80, fontSize: 9, allowOverflow: false };
}

// ---------------------------------------------------------------------------
// Field/form validation. Rules (required, type, min/maxLength) travel with
// the schema itself — loaded from the server's `form_types` table alongside
// `sections`, per-field via a `validation` object — the same registry row
// that already carries sections/defaultLayout/sampleData/templateB64 (see
// "Form-type registry as data" / "Database backend..." in PDF-gen/CLAUDE.md).
// A Postgres-backed `form_types` table would carry this the same way (a
// `field_map`-adjacent jsonb column), not as a separate mechanism.
// ---------------------------------------------------------------------------
function isEmptyValue(v) {
  return v === undefined || v === null || String(v).trim() === "";
}

// Lenient on purpose: this project's real sample data mixes army-style
// dates ("15 MAR 26"), ISO ("2026-03-05"), and slash dates — a strict
// Date.parse() would flag legitimate values as invalid.
const DATE_LIKE = /^\d{1,2}\s*[A-Za-z]{3,9}\s*\d{2,4}$/;
const DATE_ISO = /^\d{4}-\d{2}-\d{2}$/;
const DATE_SLASH = /^\d{1,2}\/\d{1,2}\/\d{2,4}$/;

function looksLikeDate(str) {
  return DATE_LIKE.test(str) || DATE_ISO.test(str) || DATE_SLASH.test(str);
}

// Validates one value against its field/column's `validation` spec.
// Returns an array of human-readable problem strings (empty = valid).
function validateFieldValue(value, validation) {
  if (!validation) return [];
  const empty = isEmptyValue(value);
  if (validation.required && empty) return ["Required"];
  if (empty) return []; // optional and empty — nothing further to check

  const str = String(value);
  const errors = [];
  if (validation.type === "number" && isNaN(Number(str))) errors.push("Must be a number");
  if (validation.type === "date" && !looksLikeDate(str)) errors.push("Must be a valid date");
  if (validation.minLength && str.length < validation.minLength) errors.push(`Must be at least ${validation.minLength} characters`);
  if (validation.maxLength && str.length > validation.maxLength) errors.push(`Must be at most ${validation.maxLength} characters`);
  return errors;
}

// Looks up a schema's header field / table column definition (which
// carries the `validation` spec) by key.
function headerFieldSpec(schema, key) {
  for (const s of schema.sections) if (s.kind === "fields") {
    const f = s.fields.find(f => f.key === key);
    if (f) return f;
  }
  return null;
}

function columnSpec(section, key) {
  return (section.columns || []).find(c => c.key === key) || null;
}

// Same lookup, but across every table section a schema declares (primary
// plus every extra table) — column keys are unique across a schema's
// tables by convention (the same assumption the Form Type Editor's
// findColBucket already relies on), so a flat search by key is enough.
// Used at fill time to find a column's validation (type/decimals/
// dateFormat/maxLength) without the fill engine needing to know which
// table a given column belongs to.
function columnSpecByKey(schema, key) {
  for (const section of tableSectionsOf(schema)) {
    const c = columnSpec(section, key);
    if (c) return c;
  }
  return null;
}

// Full-instance validation, used by "Mark complete" — every header field
// and every row's columns, against the active schema's validation specs.
// Returns a flat list of "Label: problem" strings (empty = the instance is
// clean enough to mark complete).
// Returns one entry per failed check: { location, label, message, kind }.
// kind is "pending" for a required-but-empty field, "invalid" for anything
// that has a value but fails a format/length check — the distinction the
// "Mark complete" review dialog uses to separate "still needs data" from
// "has a wrong value".
function validateInstance(schema, instance) {
  const problems = [];
  const collect = (location, label, errors) => {
    for (const message of errors) problems.push({ location, label, message, kind: message === "Required" ? "pending" : "invalid" });
  };
  for (const key of headerKeysOf(schema)) {
    const spec = headerFieldSpec(schema, key);
    collect("Header", (spec && spec.label) || key, validateFieldValue(instance.header[key], spec && spec.validation));
  }
  const tables = tableSectionsOf(schema);
  // Only disambiguate the location with the table's own title when a
  // schema has more than one table section — keeps every existing
  // single-table form's "Row N" wording exactly as it was.
  for (const table of tables) {
    const prefix = tables.length > 1 ? (table.title || table.rowsKey) + " — " : "";
    instance[table.rowsKey].forEach((row, idx) => {
      for (const col of table.columns) {
        collect(`${prefix}Row ${idx + 1}`, col.label || col.key, validateFieldValue(row[col.key], col.validation));
      }
    });
  }
  return problems;
}

function emptyInstance(schema) {
  const header = {};
  for (const key of headerKeysOf(schema)) header[key] = "";
  const instance = { id: uid(), header, complete: false, overlayData: {}, name: "" };
  for (const table of tableSectionsOf(schema)) {
    const count = table.fixedRows || 1;
    instance[table.rowsKey] = Array.from({ length: count }, () => emptyRowFor(table));
  }
  return instance;
}

// A clone always starts incomplete, with no carried-over overlay data
// (signature images, placeholder text), even if the source instance (e.g.
// a saved Default) had either set — both track this specific instance's
// own review/signing, not whatever state the source happened to be in.
// `name` is the one thing that DOES carry over — it's an organizational
// label (e.g. "Left engine" vs "Right engine"), not review/signing state,
// so a document created from a Default keeps the same instance names.
// Row arrays are found by duck-typing (any own array-valued property) —
// header/overlayData are always plain objects, so this needs no schema
// and generalizes automatically to however many table sections a schema
// declares.
function cloneInstance(instance) {
  const out = { id: uid(), header: { ...instance.header }, complete: false, overlayData: {}, name: instance.name || "" };
  for (const key of Object.keys(instance)) {
    if (Array.isArray(instance[key])) out[key] = instance[key].map(r => ({ ...r, id: uid() }));
  }
  return out;
}

// A logbook document bundles every form type *assigned to its document
// type* (per the "Document = collection of Forms" model, and the admin
// "assign & sort form types within a document type" feature — see
// documentTypeForms in pdfgenApp()), each as an *array* of instances — a
// logbook can contain more than one of a given form type. `formTypesList`
// is that document type's ordered, resolved schema list (a subset of the
// global FORM_TYPES registry) — passed in explicitly rather than read off
// a module-level global, since which form types apply now depends on which
// document type this logbook is.
function emptyLogbookForms(formTypesList) {
  const forms = {};
  for (const ft of formTypesList) forms[formTypeKey(ft.type)] = [emptyInstance(ft)];
  return forms;
}

function cloneLogbookForms(forms, formTypesList) {
  const out = {};
  for (const ft of formTypesList) out[formTypeKey(ft.type)] = (forms[formTypeKey(ft.type)] || []).map(cloneInstance);
  return out;
}

function emptyLogbook(tailNumber, forms, documentTypeId, aircraftModel, formTypesList) {
  const now = new Date().toISOString();
  const f = forms || emptyLogbookForms(formTypesList);
  const lb = {
    id: uid(), tailNumber, aircraftModel, documentTypeId,
    createdAt: now, updatedAt: now,
  };
  for (const ft of formTypesList) lb[formTypeKey(ft.type)] = f[formTypeKey(ft.type)];
  return lb;
}

// A fixed-count "extra" table's on-page position used to be one flat
// {page, startY, spacing, rows} — a single physical page only. Real forms
// routinely run a fixed-count table (a verification log, a remarks list)
// from the front page onto the back, so this became a page1/page2 pair —
// same shape the primary growable table already used — plus an explicit
// `maxRows` (the table's total row count, kept in sync with the schema's
// own `section.fixedRows` at Save time, see reconcileFormTypeTables)
// distinct from how many of those rows print on each page. Normalizes old
// flat-shape data (every table saved before this existed, in the database
// as-is — not migrated) to the new shape at read time, same precedent as
// the primary table's own page1/page2 self-heal just below.
function normalizeExtraTable(t) {
  const cols = t.cols || {};
  if (t.page1 || t.page2) {
    const page1 = { rows: 0, startY: 700, spacing: 20, ...(t.page1 || {}) };
    const page2 = { rows: 0, startY: 700, spacing: 20, ...(t.page2 || {}) };
    return {
      rowsKey: t.rowsKey,
      maxRows: t.maxRows != null ? t.maxRows : (page1.rows + page2.rows),
      page1, page2, cols,
    };
  }
  const legacyOnPage2 = t.page === 1;
  const rows = t.rows || 0;
  const startY = t.startY != null ? t.startY : 700;
  const spacing = t.spacing || 20;
  return {
    rowsKey: t.rowsKey,
    maxRows: rows,
    page1: legacyOnPage2 ? { rows: 0, startY: 700, spacing: 20 } : { rows, startY, spacing },
    page2: legacyOnPage2 ? { rows, startY, spacing } : { rows: 0, startY: 700, spacing: 20 },
    cols,
  };
}

// Merges a form type's default field layout with any saved per-field
// overrides (Form Type Editor). Overrides are shallow per-field (a saved
// header/col entry replaces only the properties it sets... in practice the
// editor always writes a full spec object per field, but merging keeps a
// partial hand-edited saved layout from crashing the fill engine).
function getLayout(schema, savedLayouts) {
  const saved = (savedLayouts && savedLayouts[schema.type]) || {};
  const base = schema.defaultLayout;
  const header = {};
  for (const key of Object.keys(base.header)) header[key] = { ...base.header[key], ...((saved.header && saved.header[key]) || {}) };
  const cols = {};
  for (const key of Object.keys(base.cols)) cols[key] = { ...base.cols[key], ...((saved.cols && saved.cols[key]) || {}) };
  const page1 = { ...base.page1, ...(saved.page1 || {}) };
  const page2 = { ...base.page2, ...(saved.page2 || {}) };
  // A primary table with zero page-1 row capacity was never given a real
  // position — every custom form type starts this way (the admin Form
  // Type Builder / "Upload PDF" have no template yet to derive a real
  // per-page row count from). With rowsPerCopy === 0, buildCoordinateCopies'
  // row-chunking math produces an always-empty slice window, so *every*
  // row silently goes undrawn regardless of how much data was entered —
  // defaulting it here (read time, not just at creation) means an
  // already-existing type self-heals the moment its layout is next read,
