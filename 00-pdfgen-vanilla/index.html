<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF-gen POC — UH-60R Logbook</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>

<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --border: #d7dae0; --border-strong: #b9bec8;
    --text: #1d222b; --muted: #6b7280; --accent: #3454d1; --accent-bg: #eaeefc;
    --danger: #b42318;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; }

  header.topbar {
    height: 52px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    padding: 0 18px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  header.topbar .brand { font-weight: 700; font-size: 14px; letter-spacing: -0.01em; }
  header.topbar .sub { font-size: 12px; color: var(--muted); margin-left: 10px; }

  .app-body { flex: 1; display: flex; min-height: 0; }

  /* ---------- Sidebar ---------- */
  aside.sidebar {
    width: 260px; flex-shrink: 0; display: flex; flex-direction: column;
    background: #fbfbfc; border-right: 1px solid var(--border);
  }
  aside.sidebar.collapsed { width: 44px; align-items: center; }
  .sidebar-toggle {
    width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--border-strong); border-radius: 5px; background: #fff; color: var(--muted);
    cursor: pointer; flex-shrink: 0;
  }
  .sidebar-toggle:hover { background: #f0f1f3; }
  .sidebar-collapsed-strip { padding: 12px 0; display: flex; justify-content: center; }
  .sidebar-header-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 0; }
  .sidebar-section { padding: 12px 14px 4px; }
  .sidebar-label { font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
  .model-pill {
    display: inline-block; margin-top: 6px; font-size: 12px; font-weight: 600; padding: 4px 10px;
    border-radius: 12px; background: var(--accent-bg); color: var(--accent);
  }
  .doctype-line { font-size: 11.5px; color: var(--muted); margin-top: 6px; }
  .sidebar-list { flex: 1; overflow-y: auto; padding: 4px 8px 8px; }
  .sidebar-item {
    display: flex; align-items: center; gap: 8px; padding: 8px 8px; border-radius: 6px; cursor: pointer;
    font-size: 12.5px;
  }
  .sidebar-item:hover { background: #f0f1f3; }
  .sidebar-item.active { background: var(--accent-bg); }
  .sidebar-item .tail { font-family: ui-monospace, Menlo, monospace; font-weight: 600; flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sidebar-item .meta { font-size: 10px; color: var(--muted); }
  .sidebar-item .del { opacity: 0; color: var(--danger); font-size: 15px; line-height: 1; background: none; border: none; cursor: pointer; }
  .sidebar-item:hover .del { opacity: 1; }
  .sidebar-empty { padding: 14px 8px; font-size: 12px; color: var(--muted); }
  .sidebar-footer { padding: 12px 14px; border-top: 1px solid var(--border); }
  .sidebar-footer .btn { width: 100%; justify-content: center; }

  .form-type-group { margin-bottom: 4px; }
  .form-type-header {
    display: flex; align-items: center; gap: 6px; padding: 8px 8px 4px;
    font-size: 11px; font-weight: 700; color: var(--text);
  }
  .form-type-header .form-type-count { color: var(--muted); font-weight: 600; }
  .form-type-add {
    margin-left: auto; width: 18px; height: 18px; line-height: 1; display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--border-strong); border-radius: 4px; background: #fff; color: var(--muted); font-size: 13px;
    cursor: pointer; padding: 0;
  }
  .form-type-add:hover { background: #f0f1f3; color: var(--text); }
  .form-instance-item { padding-left: 18px; font-size: 12px; }

  /* ---------- Center ---------- */
  main.center { flex: 1; min-width: 0; overflow-y: auto; padding: 22px 26px 60px; }
  .placeholder { max-width: 420px; margin: 60px auto 0; text-align: center; color: var(--muted); font-size: 13px; }

  .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 12px; }
  .toolbar .titles h1 { font-size: 18px; margin: 0 0 2px; }
  .toolbar .titles .cap { font-size: 12px; color: var(--muted); }
  .toolbar .actions { display: flex; gap: 8px; flex-shrink: 0; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; font-size: 13px; font-weight: 600;
    border-radius: 6px; border: 1px solid var(--border-strong); background: #fff; color: var(--text); cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover { background: #f0f1f3; }
  .btn-primary { border-color: var(--accent); background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #2a44b8; }
  .btn-sm { padding: 5px 10px; font-size: 12px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; }
  .section-title {
    font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
    color: var(--muted); padding: 14px 16px 8px;
  }
  .field-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 0 16px 16px; }
  .field-grid.wide { grid-template-columns: 1fr; }
  label { display: block; font-size: 10.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; margin-bottom: 4px; }
  input[type=text], textarea, select {
    width: 100%; padding: 7px 9px; font-size: 13px; border: 1px solid var(--border-strong); border-radius: 5px;
    font-family: inherit; background: #fff; color: var(--text);
  }
  textarea { resize: vertical; min-height: 60px; }

  table.rows { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.rows th {
    text-align: left; font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase;
    padding: 6px 6px; border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  table.rows td { padding: 4px 4px; border-bottom: 1px solid #eef0f2; vertical-align: top; }
  table.rows input[type=text] { font-size: 12px; padding: 5px 6px; }
  .row-num { font-family: ui-monospace, Menlo, monospace; color: var(--muted); font-size: 11px; padding-top: 8px; }
  .drag-handle { cursor: grab; color: var(--muted); text-align: center; padding-top: 7px; user-select: none; font-size: 13px; }
  .drag-handle:active { cursor: grabbing; }
  table.rows tr.dragging { opacity: .4; }
  .row-actions { display: flex; gap: 2px; padding-top: 4px; }
  .row-actions button {
    display: flex; align-items: center; justify-content: center;
    background: none; border: none; cursor: pointer; padding: 4px;
    color: var(--muted); border-radius: 4px;
  }
  .row-actions button:hover { background: #f0f1f3; }
  .row-actions button.danger:hover { color: var(--danger); }
  .table-wrap { overflow-x: auto; padding: 0 16px 8px; }
  .table-actions { padding: 4px 16px 16px; }

  .banner-note {
    font-size: 12px; color: #7a5200; background: #fff6e5; border: 1px solid #f0dca6; border-radius: 6px;
    padding: 8px 12px; margin-bottom: 14px;
  }

  /* ---------- Right preview panel ---------- */
  aside.preview {
    width: 380px; flex-shrink: 0; display: flex; flex-direction: column;
    border-left: 1px solid var(--border); background: #fff;
  }
  .preview-toolbar {
    height: 46px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    padding: 0 12px; border-bottom: 1px solid var(--border);
  }
  .preview-toolbar .label { font-size: 12px; font-weight: 600; color: var(--muted); }
  .preview-frame-wrap { flex: 1; background: #e9eaec; overflow: auto; }
  .preview-pages { padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .preview-pages canvas { max-width: 100%; height: auto; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
  .preview-empty { height: 100%; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 12.5px; text-align: center; padding: 20px; }
  .preview-footer { padding: 8px 12px; border-top: 1px solid var(--border); font-size: 11px; color: var(--muted); text-align: center; }

  /* ---------- Modal ---------- */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(20,22,28,.45); display: flex; align-items: center; justify-content: center; z-index: 50;
  }
  .modal {
    width: 440px; max-width: calc(100vw - 40px); background: #fff; border-radius: 10px; box-shadow: 0 20px 48px rgba(0,0,0,.28);
    padding: 20px 22px;
  }
  .modal h2 { font-size: 15.5px; margin: 0 0 4px; }
  .modal .cap { font-size: 12px; color: var(--muted); margin-bottom: 16px; }
  .modal .field { margin-bottom: 14px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 6px; }
  .source-option {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--border-strong);
    border-radius: 6px; margin-bottom: 6px; cursor: pointer; font-size: 12.5px;
  }
  .source-option.selected { border-color: var(--accent); background: var(--accent-bg); }
  .source-option .name { flex: 1; font-weight: 600; }
  .source-option .del { color: var(--danger); background: none; border: none; cursor: pointer; font-size: 14px; }

  .select-field { margin-bottom: 10px; }
  .not-supported-note {
    margin: 8px 8px 0; padding: 10px 10px; font-size: 11.5px; line-height: 1.5; color: #7a5200;
    background: #fff6e5; border: 1px solid #f0dca6; border-radius: 6px;
  }
</style>
</head>
<body x-data="pdfgenApp()" x-init="init()">

  <header class="topbar">
    <div>
      <span class="brand">PDF-gen</span>
      <span class="sub">POC &middot; UH-60R &middot; Logbook &middot; DA Form 2408-20</span>
    </div>
    <div style="display:flex; align-items:center; gap:10px;">
      <button class="btn btn-sm" x-show="current" @click="printAllPreview()" :disabled="generating">
        <span x-text="generating ? 'Generating…' : 'Print All'"></span>
      </button>
      <span style="font-size:11px;color:#1a7f4b;background:#e7f7ee;padding:4px 10px;border-radius:10px;">Saved to this browser</span>
    </div>
  </header>

  <div class="app-body">

    <!-- ============ LEFT SIDEBAR ============ -->
    <aside class="sidebar" :class="{ collapsed: !sidebarOpen }">

      <template x-if="!sidebarOpen">
        <div class="sidebar-collapsed-strip">
          <button class="sidebar-toggle" title="Expand sidebar" @click="sidebarOpen = true">&raquo;</button>
        </div>
      </template>

      <template x-if="sidebarOpen">
        <div style="display:flex; flex-direction:column; min-height:0; flex:1;">
          <div class="sidebar-header-row">
            <div class="sidebar-label">Selection</div>
            <button class="sidebar-toggle" title="Collapse sidebar" @click="sidebarOpen = false">&laquo;</button>
          </div>

          <div class="sidebar-section" style="padding-top:6px;">
            <div class="select-field">
              <label>Aircraft model</label>
              <select x-model="selectedModel">
                <template x-for="m in AIRCRAFT_MODELS" :key="m">
                  <option :value="m" x-text="m"></option>
                </template>
              </select>
            </div>
            <div class="select-field" style="margin-bottom:0;">
              <label>Document type</label>
              <select x-model="selectedDocType">
                <template x-for="t in DOCUMENT_TYPES" :key="t">
                  <option :value="t" x-text="t"></option>
                </template>
              </select>
            </div>
          </div>

          <template x-if="!isSupported">
            <div class="not-supported-note">
              This POC only implements <strong>UH-60R &middot; Logbook</strong> (DA Form 2408-20).
              Pick that combination to create or view logbooks — the other options are here
              for testing the selector only.
            </div>
          </template>

          <template x-if="isSupported">
            <div style="display:flex; flex-direction:column; min-height:0; flex:1;">
              <div class="sidebar-section" style="padding-top:14px;">
                <div class="sidebar-label">Logbooks (<span x-text="logbooks.length"></span>)</div>
              </div>
              <div class="sidebar-list" style="flex:0 1 auto; max-height:220px;">
                <template x-if="logbooks.length === 0">
                  <div class="sidebar-empty">No logbooks yet.</div>
                </template>
                <template x-for="lb in sortedLogbooks()" :key="lb.id">
                  <div class="sidebar-item" :class="{ active: lb.id === currentId }" @click="openLogbook(lb.id)">
                    <div style="flex:1;min-width:0;">
                      <div class="tail" x-text="lb.tailNumber"></div>
                      <div class="meta" x-text="formatDate(lb.updatedAt)"></div>
                    </div>
                    <button class="del" title="Delete logbook" @click.stop="deleteLogbook(lb.id)">&times;</button>
                  </div>
                </template>
              </div>
              <div class="sidebar-footer">
                <button class="btn btn-primary" @click="openNewModal()">+ New logbook</button>
              </div>

              <template x-if="current">
                <div style="display:flex; flex-direction:column; min-height:0; flex:1; border-top:1px solid var(--border);">
                  <div class="sidebar-section" style="padding-top:12px;">
                    <div class="sidebar-label">Forms in this document</div>
                  </div>
                  <div class="sidebar-list">
                    <template x-for="ft in FORM_TYPES" :key="ft.type">
                      <div class="form-type-group">
                        <div class="form-type-header">
                          <span x-text="ft.label"></span>
                          <span class="form-type-count" x-text="'(' + instancesOf(ft.type).length + ')'"></span>
                          <button class="form-type-add" :title="'New ' + ft.type" @click="addFormInstance(ft.type)">+</button>
                        </div>
                        <template x-for="(inst, i) in instancesOf(ft.type)" :key="inst.id">
                          <div class="sidebar-item form-instance-item"
                               :class="{ active: activeFormType === ft.type && activeInstanceId === inst.id }"
                               @click="openFormInstance(ft.type, inst.id)">
                            <div style="flex:1;min-width:0;" x-text="ft.type + ' — Instance ' + (i + 1)"></div>
                            <button class="del" title="Delete this form instance" @click.stop="deleteFormInstance(ft.type, inst.id)">&times;</button>
                          </div>
                        </template>
                      </div>
                    </template>
                  </div>
                </div>
              </template>
            </div>
          </template>
        </div>
      </template>
    </aside>

    <!-- ============ CENTER ============ -->
    <main class="center">

      <template x-if="!current">
        <div class="placeholder">
          Select a logbook from the sidebar, or create a new one to get started.
        </div>
      </template>

      <template x-if="current">
        <div>
          <div class="toolbar">
            <div class="titles">
              <h1 x-text="'Logbook — ' + current.tailNumber"></h1>
              <div class="cap" x-text="activeFormLabel() + ' — Instance ' + activeInstanceIndex()"></div>
            </div>
            <div class="actions">
              <button class="btn" @click="openSaveDefaultModal()">Save as default</button>
              <button class="btn btn-primary" @click="showPrintPreview()" :disabled="generating || !activeInstance">
                <span x-text="generating ? 'Generating…' : 'Print Preview'"></span>
              </button>
            </div>
          </div>

          <template x-if="activeFormType === '2408-20'">
          <div class="banner-note">
            POC scope: coordinate-fill path. Rows beyond 20 automatically overflow onto
            additional copies of the form (12 rows on the front page, 8 on the back),
            sharing this same header.
          </div>
          </template>
          <template x-if="activeFormType === '2408-18'">
          <div class="banner-note">
            POC scope: AcroForm named-field fill path — this PDF already has fillable
            fields, so values are set directly on them (no coordinates needed). Rows beyond
            29 overflow onto additional copies (14 rows on the front page, 15 on the back),
            sharing this same header.
          </div>
          </template>

          <template x-if="activeFormType === '2408-20' && activeInstance">
          <div class="card">
            <div class="section-title">End item</div>
            <div class="field-grid">
              <div>
                <label>Nomenclature</label>
                <input type="text" x-model="activeInstance.header.endItemNomenclature">
              </div>
              <div>
                <label>Make or type</label>
                <input type="text" x-model="activeInstance.header.endItemMakeOrType">
              </div>
              <div>
                <label>Serial number</label>
                <input type="text" x-model="activeInstance.header.endItemSerialNumber">
              </div>
            </div>

            <div class="section-title">Component &amp; sample</div>
            <div class="field-grid">
              <div>
                <label>Component nomenclature &amp; type</label>
                <input type="text" x-model="activeInstance.header.componentNomenclatureType">
              </div>
              <div>
                <label>Component serial number</label>
                <input type="text" x-model="activeInstance.header.componentSerialNumber">
              </div>
              <div>
                <label>Time since new or overhaul</label>
                <input type="text" x-model="activeInstance.header.componentTimeSinceNewOverhaul">
              </div>
              <div>
                <label>Sample frequency</label>
                <input type="text" x-model="activeInstance.header.sampleFrequency">
              </div>
              <div>
                <label>Acft hrs — last oil change</label>
                <input type="text" x-model="activeInstance.header.acftHrsLastOilChange">
              </div>
              <div>
                <label>Acft hrs — installed</label>
                <input type="text" x-model="activeInstance.header.acftHrsInstalled">
              </div>
            </div>

            <div class="section-title">Sample rows (<span x-text="activeInstance.rows.length"></span>)</div>
            <div class="table-wrap">
              <table class="rows">
                <thead>
                  <tr>
                    <th style="width:18px"></th>
                    <th style="width:26px"></th>
                    <th>Date submitted</th>
                    <th>Hrs — end item</th>
                    <th>Hrs — component</th>
                    <th>Hrs — last oil chg</th>
                    <th>Reason for sample</th>
                    <th>Results</th>
                    <th>Results date</th>
                    <th>Results PID</th>
                    <th style="width:44px"></th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="(row, idx) in activeInstance.rows" :key="row.id">
                    <tr :class="{ dragging: dragIndex === idx }"
                        @dragover.prevent @drop="dropRow(idx)">
                      <td class="drag-handle" draggable="true"
                          @dragstart="dragStart(idx)" @dragend="dragIndex = null" title="Drag to reorder">&#8942;&#8942;</td>
                      <td class="row-num" x-text="idx + 1"></td>
                      <td><input type="text" x-model="row.dateSampleSubmitted"></td>
                      <td><input type="text" x-model="row.hoursEndItem"></td>
                      <td><input type="text" x-model="row.hoursComponent"></td>
                      <td><input type="text" x-model="row.hoursLastOilChange"></td>
                      <td><input type="text" x-model="row.reasonForSample"></td>
                      <td><input type="text" x-model="row.results"></td>
                      <td><input type="text" x-model="row.resultsDate"></td>
                      <td><input type="text" x-model="row.resultsPid"></td>
                      <td class="row-actions">
                        <button title="Duplicate row" @click="duplicateRow(idx)">
                          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="13" height="13" rx="1.5"/><path d="M4 16V5a1 1 0 0 1 1-1h11"/></svg>
                        </button>
                        <button class="danger" title="Remove row" @click="removeRow(idx)">
                          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
                        </button>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
            <div class="table-actions">
              <button class="btn btn-sm" @click="addRow()">+ Add row</button>
            </div>

            <div class="section-title">Remarks</div>
            <div class="field-grid wide">
              <div>
                <textarea x-model="activeInstance.header.remarks"></textarea>
              </div>
            </div>
          </div>
          </template>

          <template x-if="activeFormType === '2408-18' && activeInstance">
          <div class="card">
            <div class="section-title">Header</div>
            <div class="field-grid">
              <div>
                <label>Nomenclature</label>
                <input type="text" x-model="activeInstance.header.nomenclature">
              </div>
              <div>
                <label>Model</label>
                <input type="text" x-model="activeInstance.header.model">
              </div>
              <div>
                <label>Serial number</label>
                <input type="text" x-model="activeInstance.header.serialNumber">
              </div>
            </div>

            <div class="section-title">Inspection items (<span x-text="activeInstance.rows.length"></span>)</div>
            <div class="table-wrap">
              <table class="rows">
                <thead>
                  <tr>
                    <th style="width:18px"></th>
                    <th style="width:26px"></th>
                    <th>Insp no.</th>
                    <th>Item to be inspected</th>
                    <th>Reference</th>
                    <th>Frequency</th>
                    <th>Next due</th>
                    <th>Completed at</th>
                    <th style="width:44px"></th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="(row, idx) in activeInstance.rows" :key="row.id">
                    <tr :class="{ dragging: dragIndex === idx }"
                        @dragover.prevent @drop="dropRow(idx)">
                      <td class="drag-handle" draggable="true"
                          @dragstart="dragStart(idx)" @dragend="dragIndex = null" title="Drag to reorder">&#8942;&#8942;</td>
                      <td class="row-num" x-text="idx + 1"></td>
                      <td><input type="text" x-model="row.inspNo" maxlength="5"></td>
                      <td><input type="text" x-model="row.item"></td>
                      <td><input type="text" x-model="row.ref"></td>
                      <td><input type="text" x-model="row.freq"></td>
                      <td><input type="text" x-model="row.nextDue" maxlength="20"></td>
                      <td><input type="text" x-model="row.compAt"></td>
                      <td class="row-actions">
                        <button title="Duplicate row" @click="duplicateRow(idx)">
                          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="13" height="13" rx="1.5"/><path d="M4 16V5a1 1 0 0 1 1-1h11"/></svg>
                        </button>
                        <button class="danger" title="Remove row" @click="removeRow(idx)">
                          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
                        </button>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
            <div class="table-actions">
              <button class="btn btn-sm" @click="addRow()">+ Add row</button>
            </div>
          </div>
          </template>
        </div>
      </template>

    </main>

    <!-- ============ RIGHT PREVIEW PANEL ============ -->
    <aside class="preview" x-show="current && previewPanelOpen">
      <div class="preview-toolbar">
        <span class="label">PDF preview</span>
        <div style="display:flex; gap:6px;">
          <button class="btn btn-sm" @click="regeneratePreview()" :disabled="generating">Refresh</button>
          <button class="btn btn-sm btn-primary" @click="printPreview()" :disabled="!previewGenerated">Print</button>
          <button class="sidebar-toggle" title="Close preview" @click="previewPanelOpen = false">&times;</button>
        </div>
      </div>
      <div class="preview-frame-wrap">
        <div class="preview-pages" x-ref="previewPages" x-show="previewGenerated"></div>
        <template x-if="!previewGenerated">
          <div class="preview-empty">
            <span x-text="generating ? 'Generating preview…' : 'Click \'Print Preview\' to render this logbook.'"></span>
          </div>
        </template>
      </div>
      <div class="preview-footer">Preview reflects unsaved changes as of the last refresh</div>
    </aside>

  </div>

  <!-- ============ NEW LOGBOOK MODAL ============ -->
  <template x-if="showNewModal">
    <div class="modal-backdrop" @click.self="showNewModal = false">
      <div class="modal">
        <h2>New logbook</h2>
        <div class="cap">UH-60R &middot; Logbook &middot; DA Form 2408-20 + DA Form 2408-18</div>

        <div class="field">
          <label>Aircraft tail number</label>
          <input type="text" x-model="newTailNumber" placeholder="e.g. 16-04578" x-ref="tailInput">
        </div>

        <div class="field">
          <label>Start from</label>
          <div class="source-option" :class="{ selected: newSource === 'blank' }" @click="newSource = 'blank'">
            <input type="radio" :checked="newSource === 'blank'" @click.stop="newSource = 'blank'">
            <span class="name">Blank logbook</span>
          </div>
          <template x-for="d in defaults" :key="d.id">
            <div class="source-option" :class="{ selected: newSource === d.id }" @click="newSource = d.id">
              <input type="radio" :checked="newSource === d.id" @click.stop="newSource = d.id">
              <span class="name" x-text="d.name"></span>
              <span style="font-size:10.5px;color:var(--muted);" x-text="defaultSummary(d)"></span>
              <button class="del" title="Delete this default" @click.stop="deleteDefault(d.id)">&times;</button>
            </div>
          </template>
          <div class="cap" x-show="defaults.length === 0" style="margin:6px 0 0;">
            No saved defaults yet — open a logbook and use "Save as default" to create one.
          </div>
        </div>

        <div class="modal-actions">
          <button class="btn" @click="showNewModal = false">Cancel</button>
          <button class="btn btn-primary" @click="confirmCreateLogbook()" :disabled="!newTailNumber.trim()">Create</button>
        </div>
      </div>
    </div>
  </template>

  <!-- ============ SAVE AS DEFAULT MODAL ============ -->
  <template x-if="showSaveDefaultModal">
    <div class="modal-backdrop" @click.self="showSaveDefaultModal = false">
      <div class="modal">
        <h2>Save as default</h2>
        <div class="cap">
          Stores this logbook's header and rows as a reusable starting point for new
          DA 2408-20 logbooks. This logbook stays independent — editing it later won't
          change the saved default.
        </div>
        <div class="field">
          <label>Default name</label>
          <input type="text" x-model="newDefaultName" placeholder="e.g. Standard UH-60R oil log" x-ref="defaultNameInput">
        </div>
        <div class="modal-actions">
          <button class="btn" @click="showSaveDefaultModal = false">Cancel</button>
          <button class="btn btn-primary" @click="confirmSaveDefault()" :disabled="!newDefaultName.trim()">Save</button>
        </div>
      </div>
    </div>
  </template>


<script src="js/form2408-20.js"></script>
<script src="js/form2408-18.js"></script>

<script>
// ---------------------------------------------------------------------------
// Shared storage keys, id helper, and the Document-level (logbook) model —
// per-form data shapes/fill engines live in js/form2408-20.js and
// js/form2408-18.js.
// ---------------------------------------------------------------------------
const STORAGE_KEY = "pdfgen-vanilla-logbooks";
const DEFAULTS_KEY = "pdfgen-vanilla-defaults";

// Form types this POC supports, in numeric order — drives the sidebar list,
// the Print All ordering (all of one type together before the next), and
// the storage-key lookup ("2408-20" -> "forms2408_20").
const FORM_TYPES = [
  { type: "2408-18", label: "DA 2408-18 · Equipment Inspection List", empty: emptyForm2408_18, build: (i) => buildFilledPdf2408_18(i) },
  { type: "2408-20", label: "DA 2408-20 · Oil Analysis Log", empty: emptyForm2408_20, build: (i) => buildFilledPdf(i) },
];

function formTypeKey(type) {
  return "forms" + type.replace("-", "_"); // '2408-20' -> 'forms2408_20'
}

function uid() {
  return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
}


// A logbook document bundles every form type belonging to it (per the
// "Document = collection of Forms" model) — just these two in this POC.
// Each form type holds an *array* of instances (a logbook can contain more
// than one 2408-20 or 2408-18), starting with exactly one of each.
function emptyLogbookForms() {
  return { forms2408_20: [emptyForm2408_20()], forms2408_18: [emptyForm2408_18()] };
}

function cloneLogbookForms(forms) {
  return {
    forms2408_20: forms.forms2408_20.map(cloneForm2408_20),
    forms2408_18: forms.forms2408_18.map(cloneForm2408_18),
  };
}

function emptyLogbook(tailNumber, forms) {
  const now = new Date().toISOString();
  const f = forms || emptyLogbookForms();
  return {
    id: uid(),
    tailNumber,
    aircraftModel: "UH-60R",
    documentType: "Logbook",
    createdAt: now,
    updatedAt: now,
    forms2408_20: f.forms2408_20,
    forms2408_18: f.forms2408_18,
  };
}

// Migrates a pre-multi-instance saved logbook/default (singular
// form2408_20/form2408_18 objects) into the current array shape, in place.
// Lets existing localStorage data from before this change keep working.
function migrateFormsShape(obj) {
  if (obj.form2408_20 && !obj.forms2408_20) {
    obj.forms2408_20 = [{ id: uid(), ...obj.form2408_20 }];
    delete obj.form2408_20;
  }
  if (obj.form2408_18 && !obj.forms2408_18) {
    obj.forms2408_18 = [{ id: uid(), ...obj.form2408_18 }];
    delete obj.form2408_18;
  }
}

// ---------------------------------------------------------------------------
// Preview rendering. Mobile browsers (Chrome/Safari on Android/iOS in
// particular) do not render PDFs inline inside an <iframe> — they show a
// generic "open externally" card instead, which also breaks
// iframe.contentWindow.print(). Rendering each page to a <canvas> with
// pdf.js works identically on every platform, and printing is done by
// turning those canvases into images in a dedicated print window instead of
// relying on any browser's native PDF viewer.
// ---------------------------------------------------------------------------
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

// kept outside Alpine's reactive state — it's a large binary blob, not UI
// state, so there's no reason to pay for deep-proxying it on every change.
let lastPreviewBytes = null;

async function renderPreviewPages(container, bytes) {
  container.innerHTML = "";
  // pdf.js detaches/transfers the buffer it's given, so hand it a copy —
  // the caller (and printPreview, via lastPreviewBytes) still needs the
  // original bytes afterward.
  const loadingTask = pdfjsLib.getDocument({ data: bytes.slice() });
  const pdf = await loadingTask.promise;
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const viewport = page.getViewport({ scale: 1.4 });
    const canvas = document.createElement("canvas");
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    container.appendChild(canvas);
    await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
  }
}

function printRenderedPages(container) {
  const canvases = container.querySelectorAll("canvas");
  if (!canvases.length) return;
  const win = window.open("", "_blank");
  if (!win) {
    alert("Your browser blocked the print window — please allow pop-ups for this page and try again.");
    return;
  }
  const imagesHtml = Array.from(canvases)
    .map(c => `<img src="${c.toDataURL("image/png")}">`)
    .join("");
  win.document.open();
  win.document.write(`<!doctype html><html><head><title>Print preview</title><style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    img { display: block; width: 100%; page-break-after: always; }
    @media print { @page { margin: 0; } }
  </style></head><body>${imagesHtml}</body></html>`);
  win.document.close();
  setTimeout(() => { win.focus(); win.print(); }, 150);
}

function pdfgenApp() {
  return {
    logbooks: [],
    defaults: [],
    currentId: null,
    generating: false,
    previewGenerated: false,

    sidebarOpen: true,
    previewPanelOpen: false,
    FORM_TYPES,
    activeFormType: "2408-18", // '2408-18' | '2408-20' — which form type is open
    activeInstanceId: null,    // id of the specific instance of that type being edited
    dragIndex: null,

    // Fake examples for testing the selectors — only UH-60R / Logbook is
    // actually implemented in this POC (see isSupported below).
    AIRCRAFT_MODELS: ["UH-60R", "UH-60M", "MH-60R", "MH-60M", "AH-64D", "AH-64E"],
    DOCUMENT_TYPES: ["Logbook", "SN Book", "Maintenance Record", "Historical Record"],
    selectedModel: "UH-60R",
    selectedDocType: "Logbook",

    showNewModal: false,
    newTailNumber: "",
    newSource: "blank",

    showSaveDefaultModal: false,
    newDefaultName: "",

    get current() {
      return this.logbooks.find(l => l.id === this.currentId) || null;
    },

    get isSupported() {
      return this.selectedModel === "UH-60R" && this.selectedDocType === "Logbook";
    },

    // the currently-open logbook's instances of a given form type
    instancesOf(type) {
      return this.current ? this.current[formTypeKey(type)] : [];
    },

    get activeInstance() {
      if (!this.current) return null;
      const list = this.current[formTypeKey(this.activeFormType)];
      return list.find(i => i.id === this.activeInstanceId) || null;
    },

    activeFormLabel() {
      const ft = FORM_TYPES.find(f => f.type === this.activeFormType);
      return ft ? ft.label : "";
    },

    activeInstanceIndex() {
      if (!this.current) return "";
      const list = this.current[formTypeKey(this.activeFormType)];
      const idx = list.findIndex(i => i.id === this.activeInstanceId);
      return idx === -1 ? "" : idx + 1;
    },

    init() {
      this.load();
      this.$watch("logbooks", () => this.persistLogbooks(), { deep: true });
      this.$watch("defaults", () => this.persistDefaults(), { deep: true });
    },

    load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        this.logbooks = raw ? JSON.parse(raw) : [];
      } catch { this.logbooks = []; }
      this.logbooks.forEach(migrateFormsShape);
      try {
        const raw = localStorage.getItem(DEFAULTS_KEY);
        this.defaults = raw ? JSON.parse(raw) : [];
      } catch { this.defaults = []; }
      this.defaults.forEach(d => migrateFormsShape(d.forms));
    },

    persistLogbooks() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(this.logbooks)); }
      catch (e) { console.warn("Could not save logbooks", e); }
    },

    persistDefaults() {
      try { localStorage.setItem(DEFAULTS_KEY, JSON.stringify(this.defaults)); }
      catch (e) { console.warn("Could not save defaults", e); }
    },

    sortedLogbooks() {
      return this.logbooks.slice().sort((a, b) => b.updatedAt.localeCompare(a.updatedAt));
    },

    formatDate(iso) {
      try { return new Date(iso).toLocaleString(); } catch { return iso; }
    },

    defaultSummary(d) {
      return FORM_TYPES
        .map(ft => d.forms[formTypeKey(ft.type)].length + ' × ' + ft.type)
        .join(', ');
    },

    clearPreview() {
      lastPreviewBytes = null;
      this.previewGenerated = false;
      if (this.$refs.previewPages) this.$refs.previewPages.innerHTML = "";
    },

    // ---- new logbook modal ----
    openNewModal() {
      this.newTailNumber = "";
      this.newSource = "blank";
      this.showNewModal = true;
      this.$nextTick(() => this.$refs.tailInput && this.$refs.tailInput.focus());
    },

    confirmCreateLogbook() {
      const tail = this.newTailNumber.trim();
      if (!tail) return;
      let forms;
      if (this.newSource === "blank") {
        forms = emptyLogbookForms();
      } else {
        const d = this.defaults.find(x => x.id === this.newSource);
        forms = d ? cloneLogbookForms(d.forms) : emptyLogbookForms();
      }
      const lb = emptyLogbook(tail, forms);
      this.logbooks.push(lb);
      this.showNewModal = false;
      this.openLogbook(lb.id);
    },

    // ---- save as default modal ----
    openSaveDefaultModal() {
      this.newDefaultName = "";
      this.showSaveDefaultModal = true;
      this.$nextTick(() => this.$refs.defaultNameInput && this.$refs.defaultNameInput.focus());
    },

    confirmSaveDefault() {
      const name = this.newDefaultName.trim();
      if (!name || !this.current) return;
      this.defaults.push({
        id: uid(),
        name,
        createdAt: new Date().toISOString(),
        forms: cloneLogbookForms(this.current),
      });
      this.showSaveDefaultModal = false;
    },

    deleteDefault(id) {
      if (!confirm("Delete this default? This cannot be undone.")) return;
      this.defaults = this.defaults.filter(d => d.id !== id);
      if (this.newSource === id) this.newSource = "blank";
    },

    // ---- logbook selection ----
    openLogbook(id) {
      this.currentId = id;
      const lb = this.logbooks.find(l => l.id === id);
      this.activeFormType = FORM_TYPES[0].type; // numeric-first, e.g. 2408-18
      this.activeInstanceId = lb ? lb[formTypeKey(this.activeFormType)][0]?.id ?? null : null;
      this.previewPanelOpen = false;
      this.clearPreview();
    },

    // ---- form instance selection (sidebar "Forms in this document") ----
    openFormInstance(type, instanceId) {
      if (this.activeFormType === type && this.activeInstanceId === instanceId) return;
      this.activeFormType = type;
      this.activeInstanceId = instanceId;
      this.previewPanelOpen = false;
      this.clearPreview();
    },

    addFormInstance(type) {
      if (!this.current) return;
      const ft = FORM_TYPES.find(f => f.type === type);
      const list = this.current[formTypeKey(type)];
      const instance = ft.empty();
      list.push(instance);
      this.current.updatedAt = new Date().toISOString();
      this.openFormInstance(type, instance.id);
    },

    deleteFormInstance(type, instanceId) {
      if (!this.current) return;
      const list = this.current[formTypeKey(type)];
      if (list.length <= 1) {
        alert("A logbook needs at least one instance of each form type.");
        return;
      }
      if (!confirm("Delete this form instance? This cannot be undone.")) return;
      const idx = list.findIndex(i => i.id === instanceId);
      if (idx === -1) return;
      list.splice(idx, 1);
      this.current.updatedAt = new Date().toISOString();
      if (this.activeFormType === type && this.activeInstanceId === instanceId) {
        this.openFormInstance(type, list[0].id);
      }
    },

    deleteLogbook(id) {
      if (!confirm("Delete this logbook? This cannot be undone.")) return;
      this.logbooks = this.logbooks.filter(l => l.id !== id);
      if (this.currentId === id) {
        this.currentId = null;
        this.previewPanelOpen = false;
        this.clearPreview();
      }
    },

    // opens the right-hand panel and (re)generates the preview into it —
    // the panel is only ever shown via this action, per the "only display
    // the right panel on Print Preview" requirement.
    async showPrintPreview() {
      this.previewPanelOpen = true;
      await this.regeneratePreview();
    },

    addRow() {
      const form = this.activeInstance;
      if (!form) return;
      form.rows.push(this.activeFormType === "2408-20" ? emptyRow2408_20() : emptyRow2408_18());
      this.current.updatedAt = new Date().toISOString();
    },

    removeRow(idx) {
      const form = this.activeInstance;
      if (!form) return;
      form.rows.splice(idx, 1);
      if (form.rows.length === 0) {
        form.rows.push(this.activeFormType === "2408-20" ? emptyRow2408_20() : emptyRow2408_18());
      }
      this.current.updatedAt = new Date().toISOString();
    },

    duplicateRow(idx) {
      const form = this.activeInstance;
      if (!form) return;
      const copy = { ...form.rows[idx], id: uid() };
      form.rows.splice(idx + 1, 0, copy);
      this.current.updatedAt = new Date().toISOString();
    },

    dragStart(idx) {
      this.dragIndex = idx;
    },

    dropRow(targetIdx) {
      if (this.dragIndex === null || this.dragIndex === targetIdx) { this.dragIndex = null; return; }
      const form = this.activeInstance;
      if (!form) { this.dragIndex = null; return; }
      const [moved] = form.rows.splice(this.dragIndex, 1);
      form.rows.splice(targetIdx, 0, moved);
      this.dragIndex = null;
      this.current.updatedAt = new Date().toISOString();
    },

    async regeneratePreview() {
      if (!this.activeInstance) return;
      this.generating = true;
      try {
        const ft = FORM_TYPES.find(f => f.type === this.activeFormType);
        const bytes = await ft.build(this.activeInstance);
        lastPreviewBytes = bytes;
        await renderPreviewPages(this.$refs.previewPages, bytes);
        this.previewGenerated = true;
      } catch (e) {
        console.error(e);
        alert("Could not generate the PDF preview — see console for details.");
      } finally {
        this.generating = false;
      }
    },

    printPreview() {
      if (!lastPreviewBytes || !this.$refs.previewPages) return;
      printRenderedPages(this.$refs.previewPages);
    },

    // "Print All" — every form instance in this logbook, merged into one PDF.
    // Doesn't touch activeFormType/activeInstanceId, only the preview panel.
    async printAllPreview() {
      if (!this.current) return;
      this.previewPanelOpen = true;
      this.generating = true;
      try {
        const bytes = await buildCombinedPdf(this.current);
        lastPreviewBytes = bytes;
        await renderPreviewPages(this.$refs.previewPages, bytes);
        this.previewGenerated = true;
      } catch (e) {
        console.error(e);
        alert("Could not generate the combined PDF — see console for details.");
      } finally {
        this.generating = false;
      }
    },
  };
}

// ---------------------------------------------------------------------------
// Shared by both fill engines (js/form2408-20.js, js/form2408-18.js).
// ---------------------------------------------------------------------------
function b64ToBytes(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

// ---------------------------------------------------------------------------
// "Print All" — runs every form instance's fill engine independently, then
// merges their output pages into a single combined PDF. Grouped by form
// type in numeric order (all 2408-18 instances, then all 2408-20 instances),
// each type's own instances in the order they appear in the sidebar. Each
// instance keeps generating its own document exactly as it would standalone;
// this only stitches the results together afterward.
// ---------------------------------------------------------------------------
async function buildCombinedPdf(logbook) {
  const { PDFDocument } = PDFLib;
  const outDoc = await PDFDocument.create();
  for (const ft of FORM_TYPES) {
    for (const instance of logbook[formTypeKey(ft.type)]) {
      const bytes = await ft.build(instance);
      const doc = await PDFDocument.load(bytes);
      const pages = await outDoc.copyPages(doc, doc.getPageIndices());
      pages.forEach(p => outDoc.addPage(p));
    }
  }
  return outDoc.save();
}
</script>
